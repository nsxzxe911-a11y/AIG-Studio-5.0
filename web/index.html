<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020407">
<title>AIG II CNC • BLACK RGB Runtime</title>
<style>
:root{
 --bg:#020407;--panel:#060a0f;--panel2:#0a1017;--panel3:#0d151e;
 --text:#eefbff;--muted:#879da9;--cyan:#27e9ff;--blue:#3694ff;--green:#33f39b;
 --amber:#ffb326;--pink:#ff4da6;--violet:#9f72ff;--red:#ff465f;--line:#193446;
 --shadow:0 14px 38px rgba(0,0,0,.55);--r:14px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020407;color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",Inter,system-ui,sans-serif}
button,textarea,input,select{font:inherit}button{color:inherit}
.app{min-height:100vh;background:
 radial-gradient(circle at 38% 0%,rgba(39,233,255,.045),transparent 29%),
 radial-gradient(circle at 100% 60%,rgba(255,77,166,.03),transparent 24%),#020407}
.top{min-height:58px;display:flex;align-items:center;gap:12px;padding:7px 10px;position:sticky;top:0;z-index:30;
 background:rgba(2,4,7,.97);border-bottom:1px solid rgba(39,233,255,.28);box-shadow:0 8px 30px #000}
.brand{display:flex;align-items:center;gap:9px;min-width:190px}.logo{font-weight:900;font-size:21px;letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}
.status{margin-left:auto;color:var(--green);font-size:11px;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:6px;flex:1;max-width:850px}
.nav button,.btn{border:1px solid #223846;background:linear-gradient(#0d141c,#05080c);border-radius:10px;min-height:40px;cursor:pointer;
 box-shadow:inset 0 1px rgba(255,255,255,.045),0 7px 18px rgba(0,0,0,.35)}
.nav button:hover,.btn:hover{border-color:#2e6681}
.btn:disabled{opacity:.34;cursor:not-allowed;border-color:#26323a!important;box-shadow:none!important;color:#70818b!important}
.nav button.active{border-color:var(--accent,var(--cyan));box-shadow:0 0 18px color-mix(in srgb,var(--accent,var(--cyan)) 32%,transparent),inset 0 0 18px color-mix(in srgb,var(--accent,var(--cyan)) 10%,transparent)}
.shell{padding:9px;display:grid;gap:9px}
.screen{display:none}.screen.active{display:block}
.panel{background:linear-gradient(180deg,#080d12,#04070a);border:1px solid rgba(71,146,177,.34);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid rgba(63,139,168,.24)}
.head h2,.head h3{font-size:14px;margin:0}.head small{color:var(--muted)}.head .spacer{flex:1}
.body{padding:9px}
.simgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,.86fr);gap:9px;min-height:690px}
.simleft{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.axisbar{display:flex;gap:6px;flex-wrap:wrap}
.axis{border:1px solid rgba(39,233,255,.3);background:#050a0e;border-radius:9px;padding:6px 9px;font-size:11px;min-width:95px}
.axis.a{border-color:rgba(255,179,38,.5)}.axis.b,.axis.c{border-color:rgba(255,77,166,.5)}
.sceneWrap{position:relative;min-height:530px;border-radius:11px;border:1px solid #102934;background:#010306;overflow:hidden}
.sim3dCanvas,.simCanvas{position:absolute;inset:0;display:block;width:100%;height:100%;min-height:530px}
.sim3dCanvas{background:#010306;touch-action:none;cursor:grab}
.sim3dCanvas:active{cursor:grabbing}
.simCanvas{background:transparent;pointer-events:none}
.sceneHud{position:absolute;inset:12px 12px auto auto;padding:8px 9px;background:rgba(0,0,0,.78);border:1px solid rgba(39,233,255,.28);border-radius:9px;

.sceneTitle{position:absolute;left:17px;bottom:15px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px #000}.sceneTitle small{display:block;color:var(--muted);font-weight:400;margin-top:3px;letter-spacing:0}
.controls{display:flex;gap:7px;flex-wrap:wrap;padding-top:8px}.controls .btn{min-width:78px;padding:7px 10px}
.play{border-color:rgba(51,243,155,.55)!important;color:#c8ffe6}.danger{border-color:rgba(255,70,95,.5)!important;color:#ffd0d7}.warn{border-color:rgba(255,179,38,.5)!important}

.execLine{padding:2px 5px;border-left:2px solid transparent;color:#a9bac3;white-space:pre}
.execLine.active{color:#fff;background:rgba(39,233,255,.09);border-left-color:var(--cyan)}
.execLine.done{color:#6f8c7c}
.execLine.collision{color:#ff9aaa;border-left-color:#ff465f;background:rgba(255,70,95,.07)}
.execLine.alarm{color:#fff;border-left-color:#ff465f;background:rgba(255,70,95,.22);box-shadow:inset 0 0 16px rgba(255,70,95,.12)}
.editactions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.editactions .btn{min-height:34px}
.runtimeStatus{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:6px;margin-top:8px}

.aigIssueCenter.show{display:block}.aigIssueCenter.info{border-color:#24546b;color:#bfefff}.aigIssueCenter.warn{border-color:#806119;color:#ffd888;background:rgba(255,179,38,.06)}.aigIssueCenter.error{border-color:#7e2634;color:#ffbdc6;background:rgba(255,70,95,.07)}
.fieldIssue{display:none;margin-top:4px;font-size:9px;line-height:1.35}.fieldIssue.show{display:block}.fieldIssue.warn{color:#ffcf70}.fieldIssue.error{color:#ff8fa1}
input.aigWarn,select.aigWarn,textarea.aigWarn{border-color:#9b731d!important;box-shadow:0 0 0 1px rgba(255,179,38,.15)!important}
input.aigError,select.aigError,textarea.aigError{border-color:#a82d43!important;box-shadow:0 0 0 1px rgba(255,70,95,.18)!important}
.progress{height:7px;background:#101820;border-radius:99px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 12px rgba(39,233,255,.35)}
.workgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:9px;min-height:690px}
.canvas{min-height:580px;background:
 linear-gradient(rgba(39,233,255,.028) 1px,transparent 1px),
 linear-gradient(90deg,rgba(39,233,255,.028) 1px,transparent 1px),#020508;background-size:32px 32px;border-radius:11px}
.cadCanvasWrap{position:relative;min-height:580px;border:1px solid #102934;border-radius:11px;overflow:hidden;background:#010306}
.cadCanvas{display:block;width:100%;height:580px;touch-action:none;cursor:crosshair;background:#010306}
.cadHud{position:absolute;left:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.cadHud span{padding:4px 7px;background:rgba(0,0,0,.76);border:1px solid #17384a;border-radius:7px;font:10px ui-monospace,monospace;color:#bfefff}

.cadSide{display:grid;gap:7px}.cadSide .field{min-height:48px}
.cadSideControls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.cadSideControls .btn{padding:7px}

.ops{display:grid;gap:6px}.ops .btn{width:100%;padding:8px}

.tpList{display:grid;gap:6px;max-height:520px;overflow:auto}.tpList .btn{width:100%;text-align:left;padding:8px}
.tpNodeEdit{border-color:var(--pink)!important;box-shadow:0 0 16px rgba(255,77,166,.18)!important}
.camStats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.camStats .field{min-height:48px}
.form{display:grid;gap:8px}.field{padding:8px;background:#04080b;border:1px solid #18303e;border-radius:9px}.field b{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}.field span{font-size:12px}
.menuGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.menuCard{min-height:145px;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:800;border:1px solid rgba(39,233,255,.28);background:linear-gradient(145deg,#0a1118,#030507);border-radius:15px;cursor:pointer}
.menuCard:hover{box-shadow:0 0 22px rgba(39,233,255,.1)}
.menuCard.active{border-color:var(--violet);box-shadow:0 0 22px rgba(159,114,255,.18)}
.menuDetail{display:grid;gap:9px}.menuDetailGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menuDetail .field input,.menuDetail .field select{width:100%;margin-top:5px;background:#010305;color:#eefbff;border:1px solid #24485a;border-radius:6px;padding:6px}
@media(max-width:700px){.menuDetailGrid{grid-template-columns:1fr}}
.footer{padding:6px 10px 10px;color:#66808f;font-size:9px;text-align:center}
.badge{font-size:10px;color:var(--muted);border:1px solid #233846;border-radius:999px;padding:5px 8px}
.notice{font-size:10px;color:#b7c8d1;padding:6px 8px;border:1px solid #172b36;border-radius:8px;background:#03070a}
.param{display:flex;align-items:center;gap:5px;min-height:32px;padding:4px 7px;border:1px solid #1b3441;border-radius:9px;background:#03070a;color:var(--muted);font-size:10px}
.param input{width:62px;background:#010305;color:var(--text);border:1px solid #24485a;border-radius:6px;padding:4px 5px;outline:none}
.param input:focus{border-color:var(--cyan)}
.fieldIssue{display:none;width:100%;font-size:9px;line-height:1.35;margin-top:3px;padding:3px 6px;border-radius:6px}
.fieldIssue.show{display:block}
.fieldIssue.error{color:#ffd6dc;background:rgba(255,70,95,.12);border:1px solid rgba(255,70,95,.34)}
.fieldIssue.warn{color:#ffe6b4;background:rgba(255,179,38,.10);border:1px solid rgba(255,179,38,.30)}
.fieldIssue.info{color:#bfefff;background:rgba(39,233,255,.08);border:1px solid rgba(39,233,255,.22)}
.field-invalid{border-color:var(--red)!important;box-shadow:0 0 0 1px rgba(255,70,95,.22)!important}
.field-warning{border-color:var(--amber)!important;box-shadow:0 0 0 1px rgba(255,179,38,.18)!important}
.runtimeIssueDock{position:fixed;right:10px;bottom:10px;z-index:1000;display:grid;gap:6px;width:min(430px,calc(100vw - 20px));pointer-events:none}
.runtimeIssue{pointer-events:auto;padding:8px 10px;border-radius:10px;background:rgba(3,7,10,.96);border:1px solid #24485a;box-shadow:0 10px 30px rgba(0,0,0,.55);font-size:11px;line-height:1.45}
.runtimeIssue.error{border-color:rgba(255,70,95,.56);color:#ffd6dc}
.runtimeIssue.warn{border-color:rgba(255,179,38,.48);color:#ffe6b4}
.runtimeIssue.info{border-color:rgba(39,233,255,.38);color:#c9f8ff}
.runtimeIssue b{display:block;margin-bottom:2px}
.cycleTag{color:var(--amber)!important}
@media(max-width:920px){
 .top{height:auto;flex-wrap:wrap}.brand{min-width:140px}.nav{order:3;grid-template-columns:repeat(7,minmax(58px,1fr));max-width:none;flex-basis:100%}
 .simgrid,.workgrid,.camgrid{grid-template-columns:1fr}.editor{min-height:560px}.code{min-height:330px}
 .runtimeStatus{grid-template-columns:repeat(3,1fr)}.menuGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .shell{padding:6px}.status{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{min-height:42px;font-size:11px}
 .sceneWrap,.simCanvas{min-height:44vh}.cadCanvasWrap,.cadCanvas,.camCanvas,.tpCanvas{min-height:48vh;height:48vh}.simgrid{min-height:0}.editor{min-height:500px}.code{min-height:300px}.menuGrid{grid-template-columns:1fr 1fr}
 .runtimeStatus{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div><div class="logo">AIG II CNC</div><small>BLACK RGB RUNTIME</small></div></div>
 <nav class="nav" id="nav"></nav>
 <div class="status">● LOCAL READY　0.001 mm</div>
</header>
<main class="shell" id="screens"></main>
<div class="runtimeIssueDock" id="runtimeIssues" aria-live="polite"></div>
<footer class="footer">AIG II CNC • 黑色高對比 Runtime • Web motion prototype • CNC machine output disabled</footer>
</div>
<script>
const pages=[
 ["功能","#9f72ff"],["CAD","#27e9ff"],["CAM","#33f39b"],["刀路","#ff4da6"],["3AX","#3694ff"],["4AX","#ffb326"],["5AX","#ff4da6"]
];
const nav=document.getElementById("nav"),screens=document.getElementById("screens");
const runtimeIssues=document.getElementById("runtimeIssues");
const runtimeIssueState={last:new Map(),items:[]};
function reportRuntimeIssue(level,area,message,opts={}){
 const lvl=String(level||"info").toLowerCase(),key=(area||"AIG")+"|"+message,now=Date.now();
 if(runtimeIssueState.last.has(key)&&now-runtimeIssueState.last.get(key)<1500)return;
 runtimeIssueState.last.set(key,now);
 runtimeIssueState.items.push({lvl,area:area||"AIG",message:String(message||"未知訊息"),time:now});
 runtimeIssueState.items=runtimeIssueState.items.slice(-5);
 if(runtimeIssues){
   runtimeIssues.innerHTML=runtimeIssueState.items.map((x,i)=>'<div class="runtimeIssue '+x.lvl+'"><b>'+escapeHtml(x.area)+' • '+(x.lvl==="error"?"錯誤":x.lvl==="warn"?"警示":"訊息")+'</b>'+escapeHtml(x.message)+'</div>').join("");
   clearTimeout(runtimeIssueState.timer);
   runtimeIssueState.timer=setTimeout(()=>{runtimeIssueState.items=runtimeIssueState.items.slice(-2);runtimeIssues.innerHTML=runtimeIssueState.items.map(x=>'<div class="runtimeIssue '+x.lvl+'"><b>'+escapeHtml(x.area)+'</b>'+escapeHtml(x.message)+'</div>').join("")},7000);
 }
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function safeRun(area,fn,fallback=null){
 try{return fn()}catch(err){
   const msg=err instanceof Error?err.message:String(err);
   reportRuntimeIssue("error",area,msg+"；此模組已隔離，AIG 其他功能繼續運作。");
   return fallback;
 }
}
function fieldCaption(el){
 const label=el.closest("label");if(label){const txt=[...label.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join("").trim();if(txt)return txt}
 const field=el.closest(".field");const b=field?.querySelector("b");if(b?.textContent)return b.textContent.trim();
 return el.getAttribute("aria-label")||el.name||el.dataset?.fieldName||el.placeholder||"欄位";
}
function setFieldIssue(el,level,message){
 if(!el)return false;
 let issue=el.parentElement?.querySelector(":scope > .fieldIssue");
 if(!issue){issue=document.createElement("span");issue.className="fieldIssue";el.parentElement?.appendChild(issue)}
 el.classList.remove("field-invalid","field-warning");
 el.removeAttribute("aria-invalid");
 if(!message){if(issue){issue.className="fieldIssue";issue.textContent=""}return false}
 const lvl=level==="error"?"error":level==="warn"?"warn":"info";
 issue.className="fieldIssue show "+lvl;issue.textContent=message;
 if(lvl==="error"){el.classList.add("field-invalid");el.setAttribute("aria-invalid","true")}
 if(lvl==="warn")el.classList.add("field-warning");
 return lvl==="error";
}
function validateNativeField(el){
 if(!el||el.disabled)return false;
 const name=fieldCaption(el),raw=String(el.value??"").trim();
 if(el.hasAttribute("required")&&!raw)return setFieldIssue(el,"error",name+"：不可空白。");
 if(el.type==="number"&&raw!==""){
   const n=Number(raw);
   if(!Number.isFinite(n))return setFieldIssue(el,"error",name+"：請輸入有效數字。");
   if(el.min!==""&&n<Number(el.min))return setFieldIssue(el,"error",name+"：目前 "+raw+"，不可小於 "+el.min+"。");
   if(el.max!==""&&n>Number(el.max))return setFieldIssue(el,"error",name+"：目前 "+raw+"，不可大於 "+el.max+"。");
 }
 if(el.matches("textarea.code")&&!raw)return setFieldIssue(el,"warn","G-code 目前為空；AIG 可繼續編輯，但不會執行空程式。");
 setFieldIssue(el,null,"");return false;
}
function validateScope(scope,custom){
 let errors=0;
 scope.querySelectorAll("input,select,textarea").forEach(el=>{if(validateNativeField(el))errors++});
 if(typeof custom==="function")errors+=Number(custom()||0);
 return errors;
}
function installFieldValidation(scope,custom){
 const run=()=>validateScope(scope,custom);
 scope.addEventListener("input",e=>{if(e.target.matches("input,select,textarea"))safeRun("欄位驗證",run,0)});
 scope.addEventListener("change",e=>{if(e.target.matches("input,select,textarea"))safeRun("欄位驗證",run,0)});
 scope.addEventListener("blur",e=>{if(e.target.matches("input,select,textarea"))safeRun("欄位驗證",run,0)},true);
 safeRun("欄位驗證",run,0);
 return run;
}
function safeMount(selector,name,fn){
 document.querySelectorAll(selector).forEach((el,i)=>safeRun(name+" #"+(i+1),()=>fn(el)));
}
window.addEventListener("error",e=>{
 reportRuntimeIssue("error","Runtime",String(e.message||"未預期錯誤")+"；頁面保持可用，請依訊息修正欄位或重新操作。");
 e.preventDefault();
});
window.addEventListener("unhandledrejection",e=>{
 const r=e.reason instanceof Error?e.reason.message:String(e.reason||"Promise error");
 reportRuntimeIssue("error","Runtime",r+"；背景工作已隔離，AIG 不停止。");
 e.preventDefault();
});

const sourceCode={
 "3AX":[
  "O1000","N10 M98 P4","N20 S12000 M3","N30 G0 X0. Y0. Z50.",
  "N40 G99 G81 Z-10. R3. F150 L0","N50 G90 G34 X30. Y30. I20. J0. K6","N60 G80",
  "N70 G0 X0. Y0. Z5.","N80 G1 Z-2. F800","N90 X60. Y0. F1200","N100 X60. Y60.","N110 X0. Y60.","N120 X0. Y0.",
  "N130 M98 P5","N140 M30",
  "O4","N10 T1 M6","N20 G90 G54 G17 G40 G49 G80","N30 G43 Z30. H1 M8","N40 M99",
  "O5","N10 M9","N20 M5","N30 G0 Z100.","N40 M99"
 ].join("\n"),

  "O2000","N10 M98 P4","N20 S6000 M3","N30 G0 X0. Y0. Z40. A0.","N40 G1 Z-3. F600",
  "N50 X45. F1000","N60 A90.","N70 X0.","N80 A180.","N90 X45.","N100 A270.",
  "N110 M98 P5","N120 M30",
  "O4","N10 T4 M6","N20 G90 G54 G40 G49 G80","N30 G43 Z30. H4 M8","N40 M99",

  "N50 X12.430 Y-5.210 A15. B10.","N60 G1 X25.680 Y8.430 A30. B-12.","N70 G1 X36.000 Y18.000 A45. B18.",
  "N80 G1 X22.000 Y32.000 A60. B-20.","N90 G1 X0. Y24.000 A35. B8.","N100 G1 X0. Y0. A0. B0.",

 ].join("\n")
};

function panel(title,body,cls=""){return '<section class="panel '+cls+'"><div class="head"><h3>'+title+'</h3></div><div class="body">'+body+'</div></section>'}
function simPage(axis){
 const axes=axis==="3AX"?["X","Y","Z"]:axis==="4AX"?["X","Y","Z","A"]:["X","Y","Z","A","B"];

const AIG_ISSUES={last:null};
function aigFieldLabel(el){
 const label=el?.closest?.("label");if(label){const b=label.querySelector("b");if(b?.textContent)return b.textContent.trim();const txt=[...label.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(" ").trim();if(txt)return txt}
 return el?.getAttribute?.("aria-label")||el?.dataset?.label||el?.name||el?.dataset?.axis||el?.placeholder||"欄位";
}
function aigEnsureIssueCenter(root){
 if(!root)return null;let box=root.querySelector(":scope > .aigIssueCenter");
 if(!box){box=document.createElement("div");box.className="aigIssueCenter";box.setAttribute("role","status");box.setAttribute("aria-live","polite");root.prepend(box)}
 return box;
}
function aigShowIssue(root,severity,message){
 const box=aigEnsureIssueCenter(root);if(!box)return;
 const level=severity==="error"?"error":severity==="warn"?"warn":"info";
 box.className="aigIssueCenter show "+level;
 box.textContent=(level==="error"?"錯誤：":level==="warn"?"提醒：":"訊息：")+message;
 AIG_ISSUES.last={severity:level,message,time:Date.now()};
}
function aigClearIssue(root){
 const box=root?.querySelector?.(":scope > .aigIssueCenter");if(box){box.className="aigIssueCenter";box.textContent=""}
}
function aigFieldIssue(el,severity,message){
 if(!el)return;
 el.classList.remove("aigWarn","aigError");el.removeAttribute("aria-invalid");
 let tip=el.parentElement?.querySelector?.(":scope > .fieldIssue");
 if(!tip&&el.parentElement){tip=document.createElement("small");tip.className="fieldIssue";el.insertAdjacentElement("afterend",tip)}
 if(!severity||!message){if(tip){tip.className="fieldIssue";tip.textContent=""}return}
 const level=severity==="error"?"error":"warn";el.classList.add(level==="error"?"aigError":"aigWarn");
 if(level==="error")el.setAttribute("aria-invalid","true");
 if(tip){tip.className="fieldIssue show "+level;tip.textContent=message}
}
function aigFiniteNumber(value,fallback){
 const n=Number(value);return Number.isFinite(n)?n:fallback;
}
function aigValidateField(el){
 if(!el||el.disabled||el.type==="file"||el.type==="button")return true;
 const label=aigFieldLabel(el),value=String(el.value??"").trim();
 if(el.required&&!value){aigFieldIssue(el,"error",label+"：必填。");return false}
 if(el.type==="number"&&value!==""){
   const n=Number(value);
   if(!Number.isFinite(n)){aigFieldIssue(el,"error",label+"：請輸入有效數字。");return false}
   if(el.min!==""&&n<Number(el.min)){aigFieldIssue(el,"error",label+"：不可小於 "+el.min+"。");return false}
   if(el.max!==""&&n>Number(el.max)){aigFieldIssue(el,"error",label+"：不可大於 "+el.max+"。");return false}
   if(el.validity?.stepMismatch){aigFieldIssue(el,"warn",label+"：建議依步進 "+el.step+" 輸入。");return true}
 }
 aigFieldIssue(el,null,"");return true;
}
function aigValidateAllFields(root){
 let ok=true;root?.querySelectorAll?.("input,select,textarea").forEach(el=>{if(!aigValidateField(el))ok=false});return ok;
}
function aigBindFieldFeedback(root){
 if(!root||root.dataset.aigFieldFeedback==="1")return;root.dataset.aigFieldFeedback="1";aigEnsureIssueCenter(root);
 const check=el=>{
   if(!el)return;const ok=aigValidateField(el),tip=el.parentElement?.querySelector?.(":scope > .fieldIssue");
   if(el.classList.contains("aigError"))aigShowIssue(root,"error",tip?.textContent||aigFieldLabel(el)+" 輸入有誤。");
   else if(el.classList.contains("aigWarn"))aigShowIssue(root,"warn",tip?.textContent||aigFieldLabel(el)+" 請確認。");
   else if(ok&&!root.querySelector(".aigError,.aigWarn"))aigClearIssue(root);
 };
 root.addEventListener("input",e=>check(e.target.closest?.("input,select,textarea")));
 root.addEventListener("change",e=>check(e.target.closest?.("input,select,textarea")));
 root.querySelectorAll("input,select,textarea").forEach(check);
}

   const detail=err&&err.message?err.message:String(err||"未知錯誤");
   aigShowIssue(root,severity,label+"： "+detail+"。AIG 已保留目前資料並繼續運作。");

 }

function parseWords(line){
 const clean=line.replace(/\([^)]*\)/g," ").replace(/;.*$/," ").trim().toUpperCase();
 const out={};
 const re=/([A-Z])\s*([-+]?\d*\.?\d+)/g;let m;
 while((m=re.exec(clean))) out[m[1]]=Number(m[2]);
 return {clean,out};
}
function compilePrograms(text){
 const sourceLines=text.split(/\r?\n/);
 const programs=new Map();
 programs.set("MAIN",[]);
 let current="MAIN",firstO=null;
 sourceLines.forEach((raw,line)=>{
   const clean=raw.replace(/\([^)]*\)/g," ").replace(/;.*$/," ").trim().toUpperCase();
   const om=clean.match(/^O\s*0*(\d+)\b/);
   if(om){
     current=String(Number(om[1]));
     if(firstO===null)firstO=current;
     if(!programs.has(current))programs.set(current,[]);
     return;
   }
   if(!programs.has(current))programs.set(current,[]);
   programs.get(current).push({raw,line,program:current});
 });
 let mainKey="MAIN";
 if((programs.get("MAIN")||[]).every(x=>!x.raw.trim()) && firstO!==null)mainKey=firstO;
 const errors=[],warnings=[],executionLines=[];
 const maxDepth=8,maxExpanded=12000;

 function expand(key,depth,stack,repeat=1){
   if(depth>maxDepth){errors.push("子程式巢狀超過 "+maxDepth+" 層："+stack.join("→"));return;}
   const body=programs.get(String(Number(key)))||programs.get(key);
   if(!body){errors.push("找不到子程式 O"+key);return;}
   for(let r=0;r<repeat;r++){
     for(const item of body){
       if(executionLines.length>=maxExpanded){errors.push("子程式展開超過 "+maxExpanded+" 行，已停止以避免無限迴圈。");return;}
       const clean=item.raw.replace(/\([^)]*\)/g," ").replace(/;.*$/," ").trim().toUpperCase();
       const {out}=parseWords(item.raw);
       const m98=/M\s*0*98\b/.test(clean);
       const m99=/M\s*0*99\b/.test(clean);
       const m30=/M\s*0*30\b/.test(clean);
       if(m98){
         const p=Number.isFinite(out.P)?Math.trunc(out.P):null;
         const l=Number.isFinite(out.L)?Math.max(1,Math.min(999,Math.trunc(out.L))):1;
         executionLines.push({...item,subCall:p,callRepeat:l,callDepth:depth});
         if(p===null){errors.push("M98 缺少 P 子程式號：第 "+(item.line+1)+" 行");continue;}
         const pKey=String(Number(p));
         if(stack.includes(pKey)){errors.push("偵測到子程式遞迴："+[...stack,pKey].join("→"));continue;}
         expand(pKey,depth+1,[...stack,pKey],l);
         continue;
       }
       executionLines.push({...item,callDepth:depth,subReturn:m99});
       if(m99)return;
       if(m30 && key===mainKey)return;
     }
   }
 }
 expand(mainKey,0,[mainKey],1);
 if(!executionLines.length)warnings.push("沒有可執行的 G-code 區塊。");
 return {sourceLines,executionLines,programs,mainKey,errors,warnings};
}

function parseProgram(text,axis,opts={}){
 const compiled=compilePrograms(text);
 const lines=compiled.sourceLines;
 const executionLines=compiled.executionLines;
 let pos={X:0,Y:0,Z:0,A:0,B:0,C:0,F:0,S:0},absolute=true,motion="G0",plane="G17",returnMode="G98";
 let cycle=null,cycleZ=null,cycleR=null,cycleQ=null;
 let machine={T:0,selectedTool:0,H:0,spindle:"M5",coolant:false,wcs:"G54",toolComp:false};
 const blocks=[];const errors=[...compiled.errors];const warnings=[...compiled.warnings];
 let currentMeta={subprogram:compiled.mainKey,subCall:null,subReturn:false,callDepth:0,callRepeat:1};
 const g73Raw=Number(opts.g73Retract),g73Retract=Number.isFinite(g73Raw)?Math.max(0,g73Raw):0.5;

 function moveTo(line,raw,to,motionName,extra={}){
   const from={...pos},dest={...pos,...to};
   dest.F=Number.isFinite(to.F)?to.F:pos.F;dest.S=Number.isFinite(to.S)?to.S:pos.S;
   blocks.push({
     line,raw,kind:"move",motion:motionName,absolute,plane,from,to:dest,n:null,
     arc:{I:null,J:null,K:null,R:null},cutting:false,machine:{...machine},skipEligible:/^\s*\//.test(raw),...currentMeta,...extra
   });
   pos={...dest};
 }
 function resolveAxisValue(word,value,base){
   if(!Number.isFinite(value))return base;
   return absolute?value:base+value;
 }
 function invokeCycle(line,raw,out,cycleStart,resolvedXY=null,patternMeta={}){
   const initialZ=pos.Z;
   const x=resolvedXY?resolvedXY.X:resolveAxisValue("X",out.X,pos.X),y=resolvedXY?resolvedXY.Y:resolveAxisValue("Y",out.Y,pos.Y);
   if(x!==pos.X||y!==pos.Y)moveTo(line,raw,{X:x,Y:y},"G0",{cycle,cyclePhase:"xy",cutting:false,synthetic:true,...patternMeta});

   if(cycleStart || Number.isFinite(out.R)){
     if(Number.isFinite(out.R))cycleR=absolute?out.R:initialZ+out.R;
   }
   if(cycleStart || Number.isFinite(out.Z)){
     if(Number.isFinite(out.Z))cycleZ=absolute?out.Z:(cycleR??initialZ)+out.Z;
   }
   if(Number.isFinite(out.Q))cycleQ=Math.abs(out.Q);
   const safeRaw=Number(opts.safeZ),safeFallback=Number.isFinite(safeRaw)?safeRaw:5;
   const r=Number.isFinite(cycleR)?cycleR:Math.min(initialZ,safeFallback);
   const z=Number.isFinite(cycleZ)?cycleZ:pos.Z;
   if(pos.Z!==r)moveTo(line,raw,{Z:r},"G0",{cycle,cyclePhase:"rapid-r",cutting:false,synthetic:true,...patternMeta});
   const feed=Number.isFinite(out.F)?out.F:pos.F;

   if(cycle==="G81"){
     moveTo(line,raw,{Z:z,F:feed},"G1",{cycle,cyclePhase:"feed",cutting:z<0,synthetic:true,drillBottom:true,...patternMeta});
   }else if(cycle==="G84"){
     moveTo(line,raw,{Z:z,F:feed},"G1",{cycle,cyclePhase:"tap-feed",cutting:z<0,synthetic:true,drillBottom:true,tapping:true,...patternMeta});
     const tapReturn=returnMode==="G98"?initialZ:r;
     if(pos.Z!==tapReturn)moveTo(line,raw,{Z:tapReturn,F:feed},"G1",{cycle,cyclePhase:"tap-return",cutting:false,synthetic:true,tapping:true,...patternMeta});
     return;
   }else if(cycle==="G73"||cycle==="G83"){
     const q=Math.max(0.001,Number(cycleQ)||Math.max(1,Math.abs(r-z)));
     const dir=z<r?-1:1;
     let depth=r;
     let guard=0;
     while(((dir<0&&depth>z)||(dir>0&&depth<z))&&guard++<500){
       const next=dir<0?Math.max(z,depth-q):Math.min(z,depth+q);
       moveTo(line,raw,{Z:next,F:feed},"G1",{cycle,cyclePhase:"peck-feed",cutting:Math.min(depth,next)<0,synthetic:true,drillBottom:next===z,...patternMeta});
       depth=next;
       if(depth===z)break;
       if(cycle==="G83"){
         moveTo(line,raw,{Z:r},"G0",{cycle,cyclePhase:"full-retract",cutting:false,synthetic:true,...patternMeta});
         const approach=dir<0?Math.max(depth+Math.min(q*.15,1),r):Math.min(depth-Math.min(q*.15,1),r);
         if(approach!==r)moveTo(line,raw,{Z:approach},"G0",{cycle,cyclePhase:"re-approach",cutting:false,synthetic:true,...patternMeta});
         depth=approach;
       }else{
         const retract=dir<0?Math.min(r,depth+g73Retract):Math.max(r,depth-g73Retract);
         moveTo(line,raw,{Z:retract},"G0",{cycle,cyclePhase:"chip-retract",cutting:false,synthetic:true,...patternMeta});
         depth=retract;
       }
     }
   }
   const returnZ=returnMode==="G98"?initialZ:r;
   if(pos.Z!==returnZ)moveTo(line,raw,{Z:returnZ},"G0",{cycle,cyclePhase:"return",cutting:false,synthetic:true,...patternMeta});
 }

 executionLines.forEach(item=>{
  const raw=item.raw,index=item.line;
  const meta={subprogram:item.program,subCall:item.subCall??null,subReturn:Boolean(item.subReturn),callDepth:item.callDepth||0,callRepeat:item.callRepeat||1};
  currentMeta=meta;
  const {clean,out}=parseWords(raw);
  if(!clean)return;
  const gMatches=[...clean.matchAll(/G\s*0*(\d+(?:\.\d+)?)/g)].map(m=>"G"+Number(m[1]));
  const mMatches=[...clean.matchAll(/M\s*0*(\d+)/g)].map(m=>"M"+Number(m[1]));
  if(Number.isFinite(out.T))machine.selectedTool=Math.trunc(out.T);
  if(mMatches.includes("M6"))machine.T=machine.selectedTool;
  if(Number.isFinite(out.H))machine.H=Math.trunc(out.H);
  for(const code of ["G54","G55","G56","G57","G58","G59"])if(gMatches.includes(code))machine.wcs=code;
  if(gMatches.includes("G43"))machine.toolComp=true;
  if(gMatches.includes("G49"))machine.toolComp=false;
  if(mMatches.includes("M3"))machine.spindle="M3";
  if(mMatches.includes("M4"))machine.spindle="M4";
  if(mMatches.includes("M5"))machine.spindle="M5";
  if(mMatches.includes("M8"))machine.coolant=true;
  if(mMatches.includes("M9"))machine.coolant=false;
  const stopCode=mMatches.includes("M30")?"M30":mMatches.includes("M0")?"M0":mMatches.includes("M1")?"M1":null;
  if(gMatches.includes("G90"))absolute=true;
  if(gMatches.includes("G91"))absolute=false;
  if(gMatches.includes("G17"))plane="G17";
  if(gMatches.includes("G18"))plane="G18";
  if(gMatches.includes("G19"))plane="G19";
  if(gMatches.includes("G98"))returnMode="G98";
  if(gMatches.includes("G99"))returnMode="G99";
  if(gMatches.includes("G0"))motion="G0";
  if(gMatches.includes("G1"))motion="G1";
  if(gMatches.includes("G2"))motion="G2";
  if(gMatches.includes("G3"))motion="G3";
  if(Number.isFinite(out.F))pos.F=out.F;
  if(Number.isFinite(out.S))pos.S=out.S;

  if(gMatches.includes("G80")){
    cycle=null;cycleZ=null;cycleR=null;cycleQ=null;
    blocks.push({line:index,raw,kind:"modal",motion:"G80",absolute,plane,from:{...pos},to:{...pos},cycle:null,machine:{...machine},stopCode,skipEligible:/^\s*\//.test(raw),...meta});
    return;
  }

  const cycleStart=["G81","G73","G83","G84"].find(g=>gMatches.includes(g));
  if(cycleStart)cycle=cycleStart;

  // L0 loads the canned-cycle data without drilling a hole.
  if(cycleStart && Number.isFinite(out.L) && out.L===0){
    const initialZ=pos.Z;
    if(Number.isFinite(out.R))cycleR=absolute?out.R:initialZ+out.R;
    if(Number.isFinite(out.Z))cycleZ=absolute?out.Z:(cycleR??initialZ)+out.Z;
    if(Number.isFinite(out.Q))cycleQ=Math.abs(out.Q);
    blocks.push({line:index,raw,kind:"modal",motion:cycleStart,absolute,plane,from:{...pos},to:{...pos},cycle,cyclePhase:"preset",presetOnly:true,machine:{...machine},stopCode,skipEligible:/^\s*\//.test(raw),...meta});
    return;
  }

  // G34: X/Y center, I radius, J start angle, K signed hole count.
  if(gMatches.includes("G34")){
    const centerX=resolveAxisValue("X",out.X,pos.X),centerY=resolveAxisValue("Y",out.Y,pos.Y);
    const radius=Math.abs(Number(out.I));
    const startDeg=Number.isFinite(out.J)?out.J:0;
    const signedK=Math.trunc(Number(out.K));
    const count=Math.abs(signedK);
    if(!Number.isFinite(radius)||radius<=0)errors.push("G34 I 半徑必須大於 0。");
    if(!Number.isFinite(signedK)||count<1)errors.push("G34 K 孔數不得為 0。");
    if(Number.isFinite(radius)&&radius>0&&count>=1){
      const dir=signedK>=0?1:-1;
      for(let h=0;h<count;h++){
        const deg=startDeg+dir*(360/count)*h,rad=deg*Math.PI/180;
        const hole={X:centerX+radius*Math.cos(rad),Y:centerY+radius*Math.sin(rad)};
        const meta={pattern:"G34",holeIndex:h+1,holeCount:count,patternCenter:{X:centerX,Y:centerY},patternRadius:radius,patternAngle:deg};
        if(cycle){
          invokeCycle(index,raw,{},false,hole,meta);
        }else{
          moveTo(index,raw,hole,"G0",{cycle:null,cyclePhase:"pattern-position",cutting:false,synthetic:true,...meta});
        }
      }
      if(!cycle)warnings.push("G34 沒有已啟用的 G81/G73/G83/G84，因此目前只做孔位定位。");
    }
    return;
  }

  if(cycle && (cycleStart || Number.isFinite(out.X) || Number.isFinite(out.Y))){
    if(plane!=="G17")warnings.push(cycle+" 目前以 Z 軸鑽孔方式模擬；非 G17 鑽孔循環需再核對機台設定。");
    if(!absolute)warnings.push(cycle+" + G91 已按增量 R/Z 規則展開，實機前仍需依 Fanuc 參數核對。");
    invokeCycle(index,raw,out,Boolean(cycleStart));
    return;
  }

  if(gMatches.includes("G92")){
    for(const a of ["X","Y","Z","A","B","C"]) if(Number.isFinite(out[a])) pos[a]=out[a];
    blocks.push({line:index,raw,kind:"set",motion:"G92",absolute,plane,from:{...pos},to:{...pos},cycle:null,machine:{...machine},stopCode,skipEligible:/^\s*\//.test(raw),...meta});
    return;
  }

  const from={...pos},to={...pos};let moved=false;
  for(const a of ["X","Y","Z","A","B","C"]){
    if(Number.isFinite(out[a])){to[a]=absolute?out[a]:pos[a]+out[a];moved=true;}
  }
  to.F=pos.F;to.S=pos.S;
  const n=Number.isFinite(out.N)?out.N:null;
  if(moved){
    const cutting=motion!=="G0" && Math.min(from.Z,to.Z)<0;
    blocks.push({
      line:index,raw,kind:"move",motion,absolute,plane,from,to,n,cycle:null,cutting,machine:{...machine},stopCode,skipEligible:/^\s*\//.test(raw),...meta,
      arc:{I:Number.isFinite(out.I)?out.I:null,J:Number.isFinite(out.J)?out.J:null,K:Number.isFinite(out.K)?out.K:null,R:Number.isFinite(out.R)?out.R:null}
    });
    pos={...to};
  }else{
    blocks.push({line:index,raw,kind:"modal",motion,absolute,plane,from:{...pos},to:{...pos},n,cycle:null,machine:{...machine},stopCode,skipEligible:/^\s*\//.test(raw),...meta});
  }
 });
 if(axis==="3AX" && blocks.some(b=>Math.abs(b.to.A)>1e-9||Math.abs(b.to.B)>1e-9||Math.abs(b.to.C)>1e-9))errors.push("3AX 程式含旋轉軸指令。");
 if(axis==="4AX" && blocks.some(b=>Math.abs(b.to.B)>1e-9))errors.push("4AX 程式含 B 軸指令。");
 return {lines,blocks,errors,warnings,mainProgram:compiled.mainKey,programCount:compiled.programs.size};
}


function sampleRuntimeBlock(bl,t){
 const mix=(a,b)=>Number(a||0)+(Number(b||0)-Number(a||0))*t;
 if(!bl||bl.kind!=="move")return bl?.to?{...bl.to}:{X:0,Y:0,Z:0,A:0,B:0,C:0,F:0,S:0};
 let spec=null;
 if(bl.motion==="G2"||bl.motion==="G3"){
   if(bl.plane==="G18"&&bl.arc?.I!=null&&bl.arc?.K!=null)spec={u:"X",v:"Z",w:"Y",du:bl.arc.I,dv:bl.arc.K};
   else if(bl.plane==="G19"&&bl.arc?.J!=null&&bl.arc?.K!=null)spec={u:"Y",v:"Z",w:"X",du:bl.arc.J,dv:bl.arc.K};
   else if(bl.arc?.I!=null&&bl.arc?.J!=null)spec={u:"X",v:"Y",w:"Z",du:bl.arc.I,dv:bl.arc.J};
 }
 const p={};for(const k of ["X","Y","Z","A","B","C","F","S"])p[k]=mix(bl.from?.[k],bl.to?.[k]);
 if(!spec)return p;
 const cu=Number(bl.from[spec.u]||0)+Number(spec.du||0),cv=Number(bl.from[spec.v]||0)+Number(spec.dv||0);
 const r=Math.hypot(Number(bl.from[spec.u]||0)-cu,Number(bl.from[spec.v]||0)-cv);
 if(r<1e-9)return p;
 let a0=Math.atan2(Number(bl.from[spec.v]||0)-cv,Number(bl.from[spec.u]||0)-cu);
 let a1=Math.atan2(Number(bl.to[spec.v]||0)-cv,Number(bl.to[spec.u]||0)-cu),d=a1-a0;
 if(bl.motion==="G2"&&d>=0)d-=Math.PI*2;
 if(bl.motion==="G3"&&d<=0)d+=Math.PI*2;
 const a=a0+d*t;p[spec.u]=cu+Math.cos(a)*r;p[spec.v]=cv+Math.sin(a)*r;return p;
}
function inverseRuntimeABPoint(p,aDeg,bDeg){
 const a=Number(aDeg||0)*Math.PI/180,b=Number(bDeg||0)*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
 const x1=Number(p.x||0)*cb-Number(p.z||0)*sb,z1=Number(p.x||0)*sb+Number(p.z||0)*cb;
 return{x:x1,y:Number(p.y||0)*ca+z1*sa,z:-Number(p.y||0)*sa+z1*ca};
}
function runtimeStockEnvelope(parsed){
 const moves=(parsed?.blocks||[]).filter(b=>b.kind==="move"),pts=moves.flatMap(b=>[b.from,b.to]);
 const minX=pts.length?Math.min(...pts.map(p=>Number(p.X||0))):-20,maxX=pts.length?Math.max(...pts.map(p=>Number(p.X||0))):20;
 const minY=pts.length?Math.min(...pts.map(p=>Number(p.Y||0))):-20,maxY=pts.length?Math.max(...pts.map(p=>Number(p.Y||0))):20;
 const minZ=pts.length?Math.min(...pts.map(p=>Number(p.Z||0))):-10;
 const spanX=Math.max(40,maxX-minX+20),spanY=Math.max(40,maxY-minY+20),stockH=Math.max(12,Math.min(35,Math.abs(Math.min(0,minZ))+8));
 const cx=(minX+maxX)/2,cy=(minY+maxY)/2,tableR=Math.max(spanX,spanY)*.72;
 return{minX:cx-spanX/2,maxX:cx+spanX/2,minY:cy-spanY/2,maxY:cy+spanY/2,minZ:-stockH,maxZ:0,stockH,spanX,spanY,cx,cy,tableR,tableBottom:-stockH-12,tableTop:-stockH-4};
}
function sphereHitsBox(p,r,b){
 const dx=p.x<b.minX?b.minX-p.x:p.x>b.maxX?p.x-b.maxX:0;
 const dy=p.y<b.minY?b.minY-p.y:p.y>b.maxY?p.y-b.maxY:0;
 const dz=p.z<b.minZ?b.minZ-p.z:p.z>b.maxZ?p.z-b.maxZ:0;
 return dx*dx+dy*dy+dz*dz<=r*r;
}
function scanRuntimeCollisions(parsed,axis,cfg={}){
 const blocks=parsed?.blocks||[],env=runtimeStockEnvelope(parsed),collisions=[];
 const toolR=Math.max(.05,Number(cfg.toolDia)||10)/2,cutterLen=Math.max(1,Number(cfg.cutterLen)||30);
 const holderR=Math.max(toolR,Math.max(1,Number(cfg.holderDia)||25)/2),holderLen=Math.max(1,Number(cfg.holderLen)||25);
 const stockBox={minX:env.minX,maxX:env.maxX,minY:env.minY,maxY:env.maxY,minZ:env.minZ,maxZ:env.maxZ};
 function localCenter(p,d){
   const a=axis==="3AX"?0:Number(p.A||0),b=axis==="5AX"?Number(p.B||0):0;
   return inverseRuntimeABPoint({x:Number(p.X||0),y:Number(p.Y||0),z:Number(p.Z||0)+d},a,b);
 }
 function tableHit(q,r){
   const radial=Math.hypot(q.x,q.y);
   return radial<=env.tableR+r && q.z>=env.tableBottom-r && q.z<=env.tableTop+r;
 }
 function segmentHitsStock(p,d0,d1,r,steps){
   for(let k=0;k<=steps;k++){const q=localCenter(p,d0+(d1-d0)*k/steps);if(sphereHitsBox(q,r,stockBox))return q}return null;
 }
 function segmentHitsTable(p,d0,d1,r,steps){
   for(let k=0;k<=steps;k++){const q=localCenter(p,d0+(d1-d0)*k/steps);if(tableHit(q,r))return q}return null;
 }
 for(let bi=0;bi<blocks.length;bi++){
   const bl=blocks[bi];if(bl.kind!=="move")continue;
   const dx=Number(bl.to.X||0)-Number(bl.from.X||0),dy=Number(bl.to.Y||0)-Number(bl.from.Y||0),dz=Number(bl.to.Z||0)-Number(bl.from.Z||0);
   const da=Math.abs(Number(bl.to.A||0)-Number(bl.from.A||0)),db=Math.abs(Number(bl.to.B||0)-Number(bl.from.B||0));
   const samples=Math.max(8,Math.min(72,Math.ceil(Math.hypot(dx,dy,dz)/3+(da+db)/8)));
   const p0=sampleRuntimeBlock(bl,0),startToolInside=Boolean(segmentHitsStock(p0,0,cutterLen,toolR,8));
   let hit=null;
   for(let j=0;j<=samples&&!hit;j++){
     const t=j/samples,p=sampleRuntimeBlock(bl,t);
     const holderStock=segmentHitsStock(p,cutterLen,cutterLen+holderLen,holderR,8);
     if(holderStock){hit={type:"HOLDER_STOCK",message:"刀柄碰工件",point:holderStock,t};break}
     const toolTable=segmentHitsTable(p,0,cutterLen,toolR,8);
     if(toolTable){hit={type:"TOOL_TABLE",message:"刀具碰工作台",point:toolTable,t};break}
     const holderTable=segmentHitsTable(p,cutterLen,cutterLen+holderLen,holderR,8);
     if(holderTable){hit={type:"HOLDER_TABLE",message:"刀柄碰工作台",point:holderTable,t};break}
     if(!bl.cutting&&!startToolInside){
       const rapidStock=segmentHitsStock(p,0,cutterLen,toolR,8);
       if(rapidStock){hit={type:"RAPID_TOOL_STOCK",message:"快速移動刀具進入工件",point:rapidStock,t};break}
     }
   }
   if(hit)collisions.push({...hit,blockIndex:bi,line:bl.line,raw:bl.raw,subprogram:bl.subprogram||parsed.mainProgram||"MAIN"});
 }
 return{collisions,envelope:env,config:{toolR,cutterLen,holderR,holderLen}};
}

function makeGlScene(canvas,axis){
 const gl=canvas.getContext("webgl",{antialias:true,alpha:false,preserveDrawingBuffer:false});
 if(!gl)return null;
 let lost=false;canvas.addEventListener("webglcontextlost",e=>{e.preventDefault();lost=true});canvas.addEventListener("webglcontextrestored",()=>{lost=false});
 const camera={yaw:-.72,pitch:.58,zoom:2.55,drag:null};

 const meshProg=program(

  'precision mediump float;uniform vec3 uC;varying vec3 vN;void main(){vec3 n=normalize(vN);float d=.30+.70*max(dot(n,normalize(vec3(.35,.55,.78))),0.0);gl_FragColor=vec4(uC*d,1.0);}'
 );
 const lineProg=program(
  'attribute vec3 aP;uniform mat4 uVP;void main(){gl_Position=uVP*vec4(aP,1.0);}',
  'precision mediump float;uniform vec3 uC;void main(){gl_FragColor=vec4(uC,1.0);}'
 );

   if(simultaneousTap){msgEl.textContent="G84 攻牙目前只允許 3AX 或 INDEXED 定角；SIMULTANEOUS A/B 已阻擋。";statusEl.textContent="此次未輸出";return null}
   const target=targetInput.value||"3AX",wcs=wcsInput.value||"G54",tool=Math.max(1,Math.trunc(Number(toolNoInput.value)||1)),hno=Math.max(1,Math.trunc(Number(hNoInput.value)||1));
   const rpm=Math.max(1,Math.trunc(aigFiniteNumber(rpmInput.value,12000))),defaultFeed=Math.max(1,Math.trunc(aigFiniteNumber(feedInput.value,1200))),defaultSafe=aigFiniteNumber(safeInput.value,5);
   const lines=[];let n=10;const push=line=>{lines.push("N"+n+" "+line);n+=10};
   const mainO=target==="3AX"?"O1000":target==="4AX"?"O2000":"O3000";
   lines.push(mainO);push("M98 P4");push("S"+rpm+" M3");
   for(const path of state.paths){
     if(!path.points?.length)continue;
     const safe=Number(path.safeZ??defaultSafe),depth=Number(path.depth??depthInput.value??-10),feed=Math.max(1,Math.trunc(Number(path.feed)||defaultFeed));
     const mode=path.rotMode==="SIMULTANEOUS"?"SIMULTANEOUS":"INDEXED",r0=rotaryAt(path,0,target);
     push("G0 Z"+fmt(safe));
     if(target!=="3AX")push("G0"+r0.text);
     if(path.kind==="drill"){
       const pt=path.points[0];
       push("G0 X"+fmt(pt.x)+" Y"+fmt(pt.y));
       push("G81 X"+fmt(pt.x)+" Y"+fmt(pt.y)+" Z"+fmt(depth)+" R"+fmt(Math.min(safe,3))+" F"+feed);
       push("G80");continue;
     }
     if(path.kind==="tap"){
       const pt=path.points[0],pitch=Number(path.pitch),tapRpm=Math.max(1,Math.trunc(Number(path.rpm)||rpm)),tapFeed=tapRpm*pitch;
       push("S"+tapRpm+" M3");
       push("G0 X"+fmt(pt.x)+" Y"+fmt(pt.y));
       push("G94 G84 X"+fmt(pt.x)+" Y"+fmt(pt.y)+" Z"+fmt(depth)+" R"+fmt(Math.min(safe,3))+" F"+fmt(tapFeed));
       push("G80");continue;
     }
     const first=path.points[0],li=leadPoint(path,"in"),lo=leadPoint(path,"out"),start=li||first;
     push("G0 X"+fmt(start.x)+" Y"+fmt(start.y));
     push("G1 Z"+fmt(depth)+" F"+Math.max(1,Math.trunc(feed*.35)));
     if(li)push("G1 X"+fmt(first.x)+" Y"+fmt(first.y)+(mode==="SIMULTANEOUS"?rotaryAt(path,0,target).text:"")+" F"+feed);
     const denom=Math.max(1,path.points.length-1);
     for(let i=1;i<path.points.length;i++){
       const pt=path.points[i],frac=i/denom;
       push("G1 X"+fmt(pt.x)+" Y"+fmt(pt.y)+(mode==="SIMULTANEOUS"?rotaryAt(path,frac,target).text:"")+" F"+feed);
     }
     if(lo)push("G1 X"+fmt(lo.x)+" Y"+fmt(lo.y)+(mode==="SIMULTANEOUS"?rotaryAt(path,1,target).text:"")+" F"+feed);
     push("G0 Z"+fmt(safe));
   }
   push("M98 P5");push("M30");
   lines.push("O4");lines.push("N10 T"+tool+" M6");lines.push("N20 G90 "+wcs+" G17 G40 G49 G80");lines.push("N30 G43 Z30. H"+hno+" M8");lines.push("N40 M99");
   lines.push("O5");lines.push("N10 M9");lines.push("N20 M5");lines.push("N30 G0 Z100.");lines.push("N40 M99");
   const code=lines.join("\n");
   const collisionCfg={
     toolDia:Math.max(.1,aigFiniteNumber(toolDiaInput.value,10)),
     cutterLen:Math.max(1,aigFiniteNumber(cutterLenInput.value,30)),
     holderDia:Math.max(1,aigFiniteNumber(holderDiaInput.value,25)),
     holderLen:Math.max(1,aigFiniteNumber(holderLenInput.value,25)),
     safeZ:defaultSafe,g73Retract:.5
   };
   const preParsed=parseProgram(code,target,collisionCfg);
   if(preParsed.errors.length){statusEl.textContent="此次未輸出";msgEl.textContent="NC Preflight parser FAIL："+preParsed.errors.slice(0,3).join("；");return null}
   const preCollision=scanRuntimeCollisions(preParsed,target,collisionCfg);
   if(preCollision.collisions.length){
     const c=preCollision.collisions[0];statusEl.textContent="此次未輸出";
     msgEl.textContent="NC 碰撞 Preflight FAIL：第 "+(c.line+1)+" 行 "+c.message+" ["+c.type+"]；未寫入 "+target+"。";return null
   }
   localStorage.setItem("aig-code-"+target,code);
   const ta=document.querySelector('textarea[data-axis="'+target+'"]');
   if(ta){ta.value=code;ta.dispatchEvent(new Event("input",{bubbles:true}))}
   statusEl.textContent="POST "+target+" READY";
   msgEl.textContent="Fanuc NC 已通過刀具/刀柄碰撞 Preflight 並送到 "+target+"；旋轉軸在 Safe-Z 先定位，SIMULTANEOUS 模式再把 A/B 寫入每段 G1。";
   return code;
 }
 function action(name){

     state.deleteArmedUntil=0;state.paths.splice(state.selected,1);state.selected=Math.max(0,Math.min(state.selected,state.paths.length-1));save();renderList();syncInputs();draw();updateInfo();return
