<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020407">
<title>AIG II CNC • BLACK RGB Runtime</title>
<style>
:root{
 --bg:#020407;--panel:#060a0f;--panel2:#0a1017;--panel3:#0d151e;
 --text:#eefbff;--muted:#879da9;--cyan:#27e9ff;--blue:#3694ff;--green:#33f39b;
 --amber:#ffb326;--pink:#ff4da6;--violet:#9f72ff;--red:#ff465f;--line:#193446;
 --shadow:0 14px 38px rgba(0,0,0,.55);--r:14px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020407;color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",Inter,system-ui,sans-serif}
button,textarea,input,select{font:inherit}button{color:inherit}
.app{min-height:100vh;background:
 radial-gradient(circle at 38% 0%,rgba(39,233,255,.045),transparent 29%),
 radial-gradient(circle at 100% 60%,rgba(255,77,166,.03),transparent 24%),#020407}
.top{min-height:58px;display:flex;align-items:center;gap:12px;padding:7px 10px;position:sticky;top:0;z-index:30;
 background:rgba(2,4,7,.97);border-bottom:1px solid rgba(39,233,255,.28);box-shadow:0 8px 30px #000}
.brand{display:flex;align-items:center;gap:9px;min-width:190px}.logo{font-weight:900;font-size:21px;letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}
.status{margin-left:auto;color:var(--green);font-size:11px;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:6px;flex:1;max-width:850px}
.nav button,.btn{border:1px solid #223846;background:linear-gradient(#0d141c,#05080c);border-radius:10px;min-height:40px;cursor:pointer;
 box-shadow:inset 0 1px rgba(255,255,255,.045),0 7px 18px rgba(0,0,0,.35)}
.nav button:hover,.btn:hover{border-color:#2e6681}
.nav button.active{border-color:var(--accent,var(--cyan));box-shadow:0 0 18px color-mix(in srgb,var(--accent,var(--cyan)) 32%,transparent),inset 0 0 18px color-mix(in srgb,var(--accent,var(--cyan)) 10%,transparent)}
.shell{padding:9px;display:grid;gap:9px}
.screen{display:none}.screen.active{display:block}
.panel{background:linear-gradient(180deg,#080d12,#04070a);border:1px solid rgba(71,146,177,.34);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid rgba(63,139,168,.24)}
.head h2,.head h3{font-size:14px;margin:0}.head small{color:var(--muted)}.head .spacer{flex:1}
.body{padding:9px}
.simgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,.86fr);gap:9px;min-height:690px}
.simleft{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.axisbar{display:flex;gap:6px;flex-wrap:wrap}
.axis{border:1px solid rgba(39,233,255,.3);background:#050a0e;border-radius:9px;padding:6px 9px;font-size:11px;min-width:95px}
.axis.a{border-color:rgba(255,179,38,.5)}.axis.b,.axis.c{border-color:rgba(255,77,166,.5)}
.sceneWrap{position:relative;min-height:530px;border-radius:11px;border:1px solid #102934;background:#010306;overflow:hidden}
.simCanvas{display:block;width:100%;height:100%;min-height:530px;background:#010306}
.sceneHud{position:absolute;inset:12px 12px auto auto;padding:8px 9px;background:rgba(0,0,0,.78);border:1px solid rgba(39,233,255,.28);border-radius:9px;
 font:11px/1.55 ui-monospace,monospace;pointer-events:none;min-width:120px}
.sceneTitle{position:absolute;left:17px;bottom:15px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px #000}.sceneTitle small{display:block;color:var(--muted);font-weight:400;margin-top:3px;letter-spacing:0}
.controls{display:flex;gap:7px;flex-wrap:wrap;padding-top:8px}.controls .btn{min-width:78px;padding:7px 10px}
.play{border-color:rgba(51,243,155,.55)!important;color:#c8ffe6}.danger{border-color:rgba(255,70,95,.5)!important;color:#ffd0d7}.warn{border-color:rgba(255,179,38,.5)!important}
.editor{display:grid;grid-template-rows:auto auto 1fr auto auto;min-height:690px}
.editorbar{display:flex;gap:6px;flex-wrap:wrap}.editorbar .btn{min-height:32px;padding:5px 9px}
.code{width:100%;height:100%;min-height:390px;resize:none;background:#010305;color:#edf9ff;border:1px solid #173548;border-radius:9px;padding:12px;
 font:12px/1.62 "Cascadia Mono","Consolas",monospace;outline:none;tab-size:2}
.code:focus{border-color:var(--violet);box-shadow:0 0 18px rgba(159,114,255,.12)}
.execView{max-height:165px;overflow:auto;background:#010305;border:1px solid #142a37;border-radius:9px;padding:6px;font:11px/1.5 "Cascadia Mono","Consolas",monospace}
.execLine{padding:2px 5px;border-left:2px solid transparent;color:#a9bac3;white-space:pre}
.execLine.active{color:#fff;background:rgba(39,233,255,.09);border-left-color:var(--cyan)}
.execLine.done{color:#6f8c7c}
.editactions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.editactions .btn{min-height:34px}
.runtimeStatus{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:6px;margin-top:8px}
.metric{padding:8px;border:1px solid #173344;border-radius:9px;background:#04080b}.metric b{display:block;font-size:9px;color:var(--muted);margin-bottom:2px}.metric span{font-size:12px}
.progress{height:7px;background:#101820;border-radius:99px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 12px rgba(39,233,255,.35)}
.workgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:9px;min-height:690px}
.canvas{min-height:580px;background:
 linear-gradient(rgba(39,233,255,.028) 1px,transparent 1px),
 linear-gradient(90deg,rgba(39,233,255,.028) 1px,transparent 1px),#020508;background-size:32px 32px;border-radius:11px}
.cadCanvasWrap{position:relative;min-height:580px;border:1px solid #102934;border-radius:11px;overflow:hidden;background:#010306}
.cadCanvas{display:block;width:100%;height:580px;touch-action:none;cursor:crosshair;background:#010306}
.cadHud{position:absolute;left:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.cadHud span{padding:4px 7px;background:rgba(0,0,0,.76);border:1px solid #17384a;border-radius:7px;font:10px ui-monospace,monospace;color:#bfefff}
.cadSelected{border-color:var(--cyan)!important;box-shadow:0 0 16px rgba(39,233,255,.2)!important}
.cadSide{display:grid;gap:7px}.cadSide .field{min-height:48px}
.cadSideControls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.cadSideControls .btn{padding:7px}
.cadMsg{min-height:44px;color:#b7c8d1;font-size:10px;line-height:1.45}
.toolstrip{display:flex;gap:6px;flex-wrap:wrap}.toolstrip .btn{min-width:84px;padding:7px}
.sidegroup{display:grid;gap:7px}.sidegroup .btn{padding:8px}
.camgrid{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:9px;min-height:690px}
.ops{display:grid;gap:6px}.ops .btn{width:100%;padding:8px}
.preview{min-height:580px;background:radial-gradient(circle,rgba(51,243,155,.08),transparent 42%),#020508;border-radius:11px;border:1px solid #123128}
.form{display:grid;gap:8px}.field{padding:8px;background:#04080b;border:1px solid #18303e;border-radius:9px}.field b{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}.field span{font-size:12px}
.menuGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.menuCard{min-height:145px;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:800;border:1px solid rgba(39,233,255,.28);background:linear-gradient(145deg,#0a1118,#030507);border-radius:15px;cursor:pointer}
.menuCard:hover{box-shadow:0 0 22px rgba(39,233,255,.1)}
.footer{padding:6px 10px 10px;color:#66808f;font-size:9px;text-align:center}
.badge{font-size:10px;color:var(--muted);border:1px solid #233846;border-radius:999px;padding:5px 8px}
.notice{font-size:10px;color:#b7c8d1;padding:6px 8px;border:1px solid #172b36;border-radius:8px;background:#03070a}
.param{display:flex;align-items:center;gap:5px;min-height:32px;padding:4px 7px;border:1px solid #1b3441;border-radius:9px;background:#03070a;color:var(--muted);font-size:10px}
.param input{width:62px;background:#010305;color:var(--text);border:1px solid #24485a;border-radius:6px;padding:4px 5px;outline:none}
.param input:focus{border-color:var(--cyan)}
.cycleTag{color:var(--amber)!important}
@media(max-width:920px){
 .top{height:auto;flex-wrap:wrap}.brand{min-width:140px}.nav{order:3;grid-template-columns:repeat(7,minmax(58px,1fr));max-width:none;flex-basis:100%}
 .simgrid,.workgrid,.camgrid{grid-template-columns:1fr}.editor{min-height:560px}.code{min-height:330px}
 .runtimeStatus{grid-template-columns:repeat(3,1fr)}.menuGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .shell{padding:6px}.status{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{min-height:42px;font-size:11px}
 .sceneWrap,.simCanvas{min-height:44vh}.cadCanvasWrap,.cadCanvas{min-height:48vh;height:48vh}.simgrid{min-height:0}.editor{min-height:500px}.code{min-height:300px}.menuGrid{grid-template-columns:1fr 1fr}
 .runtimeStatus{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div><div class="logo">AIG II CNC</div><small>BLACK RGB RUNTIME</small></div></div>
 <nav class="nav" id="nav"></nav>
 <div class="status">● LOCAL READY　0.001 mm</div>
</header>
<main class="shell" id="screens"></main>
<footer class="footer">AIG II CNC • 黑色高對比 Runtime • Web motion prototype • CNC machine output disabled</footer>
</div>
<script>
const pages=[
 ["功能","#9f72ff"],["CAD","#27e9ff"],["CAM","#33f39b"],["刀路","#ff4da6"],["3AX","#3694ff"],["4AX","#ffb326"],["5AX","#ff4da6"]
];
const nav=document.getElementById("nav"),screens=document.getElementById("screens");
const sourceCode={
 "3AX":[
  "O1000","N10 M98 P4","N20 S12000 M3","N30 G0 X0. Y0. Z50.",
  "N40 G99 G81 Z-10. R3. F150 L0","N50 G90 G34 X30. Y30. I20. J0. K6","N60 G80",
  "N70 G0 X0. Y0. Z5.","N80 G1 Z-2. F800","N90 X60. Y0. F1200","N100 X60. Y60.","N110 X0. Y60.","N120 X0. Y0.",
  "N130 M98 P5","N140 M30",
  "O4","N10 T1 M6","N20 G90 G54 G17 G40 G49 G80","N30 G43 Z30. H1 M8","N40 M99",
  "O5","N10 M9","N20 M5","N30 G0 Z100.","N40 M99"
 ].join("\n"),
 "4AX":[
  "O2000","N10 M98 P4","N20 S6000 M3","N30 G0 X0. Y0. Z40. A0.","N40 G1 Z-3. F600",
  "N50 X45. F1000","N60 A90.","N70 X0.","N80 A180.","N90 X45.","N100 A270.",
  "N110 M98 P5","N120 M30",
  "O4","N10 T4 M6","N20 G90 G54 G40 G49 G80","N30 G43 Z30. H4 M8","N40 M99",
  "O5","N10 M9","N20 M5","N30 G0 Z100.","N40 M99"
 ].join("\n"),
 "5AX":[
  "O3000","N10 M98 P4","N20 S8000 M3","N30 G0 X0. Y0. Z50. A0. B0.","N40 G1 Z-2. F1200",
  "N50 X12.430 Y-5.210 A15. B10.","N60 G1 X25.680 Y8.430 A30. B-12.","N70 G1 X36.000 Y18.000 A45. B18.",
  "N80 G1 X22.000 Y32.000 A60. B-20.","N90 G1 X0. Y24.000 A35. B8.","N100 G1 X0. Y0. A0. B0.",
  "N110 M98 P5","N120 M30",
  "O4","N10 T12 M6","N20 G90 G54 G40 G49 G80","N30 G43 Z30. H12 M8","N40 M99",
  "O5","N10 M9","N20 M5","N30 G0 Z100.","N40 M99"
 ].join("\n")
};

function panel(title,body,cls=""){return '<section class="panel '+cls+'"><div class="head"><h3>'+title+'</h3></div><div class="body">'+body+'</div></section>'}
function simPage(axis){
 const axes=axis==="3AX"?["X","Y","Z"]:axis==="4AX"?["X","Y","Z","A"]:["X","Y","Z","A","B"];
 const axisHtml=axes.map(a=>'<span class="axis '+a.toLowerCase()+'" data-axis-read="'+a+'">'+a+'　0.000</span>').join("");
 const left='<section class="panel simleft"><div class="head"><div><h2>'+axis+' 模擬</h2><small>G-code 驅動 • G90/G91 • X/Y/Z'+(axis==="4AX"?"/A":axis==="5AX"?"/A/B":"")+'</small></div><span class="spacer"></span><span class="badge" data-run-badge>READY</span></div>'+
 '<div class="body"><div class="axisbar">'+axisHtml+'</div><div class="sceneWrap"><canvas class="simCanvas" data-canvas></canvas><div class="sceneHud" data-hud></div><div class="sceneTitle">'+axis+' 加工模擬<small>已執行刀路以綠色顯示；未執行刀路以藍色顯示</small></div></div>'+
 '<div class="controls"><button class="btn play" data-cmd="play">▶ 播放</button><button class="btn" data-cmd="pause">Ⅱ 暫停</button><button class="btn" data-cmd="step">單步</button><button class="btn" data-cmd="dry">空跑</button><button class="btn" data-cmd="single">單節</button><button class="btn" data-cmd="optional">選擇停</button><button class="btn" data-cmd="blockskip">跳段</button><button class="btn danger" data-cmd="reset">重設</button></div>'+
 '<div class="runtimeStatus"><div class="metric"><b>主軸</b><span data-spindle>0 RPM</span></div><div class="metric"><b>進給</b><span data-feed>0 mm/min</span></div><div class="metric"><b>目前區塊</b><span data-block>—</span></div><div class="metric"><b>進度</b><span data-progress-text>0%</span><div class="progress"><i data-progress></i></div></div><div class="metric"><b>模式</b><span data-mode>G90</span></div><div class="metric"><b>循環</b><span data-cycle>—</span></div><div class="metric"><b>刀具直徑</b><span data-toolmetric>Ø10.000 mm</span></div><div class="metric"><b>材料移除深度</b><span data-removal>0.000 mm</span></div><div class="metric"><b>工作座標</b><span data-wcsmetric>G54</span></div><div class="metric"><b>刀長補償</b><span data-hmetric>G49</span></div><div class="metric"><b>程式層</b><span data-subprogram>MAIN</span></div></div></div></section>';
 const right='<section class="panel editor"><div class="head"><div><h2>G-code 編輯器</h2><small>'+axis+' 同畫面直接修改</small></div></div>'+
 '<div class="body editorbar"><button class="btn" data-editcmd="parse">重新解析</button><button class="btn" data-editcmd="verify">驗證</button><button class="btn" data-editcmd="load">讀取暫存</button><button class="btn" data-editcmd="clear">清除暫存</button><label class="param">刀徑 Ø<input data-tool-dia type="number" value="10" min="0.1" step="0.1"></label><label class="param">Safe-Z<input data-safe-z type="number" value="5" step="0.1"></label><label class="param">G73 退屑<input data-g73-retract type="number" value="0.5" min="0" step="0.1"></label><label class="param">G54 X<input data-g54-x type="number" value="0" step="0.001"></label><label class="param">G54 Y<input data-g54-y type="number" value="0" step="0.001"></label><label class="param">G54 Z<input data-g54-z type="number" value="0" step="0.001"></label><label class="param">G55 X<input data-g55-x type="number" value="0" step="0.001"></label><label class="param">G55 Y<input data-g55-y type="number" value="0" step="0.001"></label><label class="param">G55 Z<input data-g55-z type="number" value="0" step="0.001"></label><label class="param">H1<input data-h1 type="number" value="0" step="0.001"></label><label class="param">H4<input data-h4 type="number" value="0" step="0.001"></label><label class="param">H12<input data-h12 type="number" value="0" step="0.001"></label></div>'+
 '<div class="body" style="padding-top:0"><textarea class="code" data-axis="'+axis+'" spellcheck="false">'+sourceCode[axis]+'</textarea></div>'+
 '<div class="body" style="padding-top:0"><div class="execView" data-exec></div></div>'+
 '<div class="body editactions"><button class="btn" data-editcmd="insert">插入行</button><button class="btn danger" data-editcmd="delete">刪除行</button><button class="btn" data-editcmd="undo">復原</button><button class="btn" data-editcmd="redo">重做</button><button class="btn play" data-editcmd="save">儲存</button></div>'+
 '<div class="body" style="padding-top:0"><div class="notice" data-verify>可編輯 G-code；目前為瀏覽器模擬，不會送指令到實體 CNC。</div></div></section>';
 return '<div class="simgrid" data-runtime="'+axis+'">'+left+right+'</div>';
}
function cadPage(){
 const drawTools=["LINE","RECT","CIRCLE","ARC","HOLE"].map(x=>'<button class="btn" data-cad-tool="'+x+'">'+x+'</button>').join("");
 const editTools=["TRIM","EXTEND","OFFSET","ARRAY","DIM"].map(x=>'<button class="btn" data-cad-action="'+x+'">'+x+'</button>').join("");
 return '<div data-cad-runtime><div class="toolstrip">'+drawTools+editTools+'</div><div class="workgrid" style="margin-top:9px">'+
 '<section class="panel"><div class="head"><div><h2>CAD 製圖</h2><small>真 2D Canvas • SNAP • AutoSave / Recovery • 0.001 mm</small></div><span class="spacer"></span><span class="badge" data-cad-count>0 entities</span></div><div class="body">'+
 '<div class="cadCanvasWrap"><canvas class="cadCanvas" data-cad-canvas></canvas><div class="cadHud"><span data-cad-toolhud>SELECT</span><span data-cad-coord>X 0.000 Y 0.000</span><span data-cad-snaphud>SNAP ON</span></div></div>'+
 '<div class="controls"><button class="btn" data-cad-action="UNDO">Undo</button><button class="btn" data-cad-action="REDO">Redo</button><button class="btn" data-cad-tool="SELECT">Select</button><button class="btn" data-cad-tool="PAN">Pan</button><button class="btn" data-cad-action="FIT">Fit</button><button class="btn play" data-cad-action="SNAP">SNAP</button></div></div></section>'+
 '<section class="panel"><div class="head"><h3>製圖屬性</h3></div><div class="body cadSide">'+
 '<div class="field"><b>選取</b><span data-cad-selected>無</span></div>'+
 '<div class="field"><b>SNAP</b><span data-cad-snap>端點 / 中點 / 圓心 / 交點 / H / V / 1mm Grid</span></div>'+
 '<div class="field"><b>拓樸</b><span data-cad-topology>DISCONNECTED</span></div>'+
 '<label class="param">OFFSET<input data-cad-offset type="number" value="5" step="0.001"></label>'+
 '<label class="param">ARRAY 數量<input data-cad-array-count type="number" value="3" min="2" max="99" step="1"></label>'+
 '<label class="param">ARRAY X<input data-cad-array-spacing type="number" value="10" step="0.001"></label>'+
 '<label class="param">DIM mm<input data-cad-dim type="number" value="20" min="0.001" step="0.001"></label>'+
 '<div class="cadSideControls"><button class="btn play" data-cad-action="CONNECT">CONNECT</button><button class="btn" data-cad-action="DISCONNECT">DISCONNECT</button><button class="btn danger" data-cad-action="DELETE">DELETE</button><button class="btn danger" data-cad-action="CLEAR">CLEAR</button></div>'+
 '<div class="notice cadMsg" data-cad-msg>選擇工具後可直接在畫布操作。ARC：圓心 → 起點 → 終點。</div>'+
 '</div></section></div></div>';
}
function camPage(){
 const ops=["平面","輪廓","口袋","鑽孔","等高","平行","自適應","倒角","攻牙"].map(x=>'<button class="btn">'+x+'</button>').join("");
 const fields=["刀具｜Ø10 End Mill","深度｜-10.000 mm","進給｜1200 mm/min","轉速｜12000 RPM","Safe-Z｜5.000 mm","加工區域｜已選","方向｜順銑"].map(x=>{const p=x.split("｜");return '<div class="field"><b>'+p[0]+'</b><span>'+p[1]+'</span></div>'}).join("");
 return '<div class="camgrid">'+panel("快速刀路",'<div class="ops">'+ops+'</div>')+
 '<section class="panel"><div class="head"><h2>CAM 加工預覽</h2><small>策略與幾何分離</small></div><div class="body"><div class="preview"></div></div></section>'+
 panel("刀具與參數",'<div class="form">'+fields+'<button class="btn play">計算刀路</button><button class="btn">選取區域</button><button class="btn">套用</button></div>')+'</div>';
}
function toolpathPage(){
 const ops=["OP10 平面","OP20 口袋","OP30 輪廓","OP40 鑽孔","OP50 倒角"].map(x=>'<button class="btn">'+x+'</button>').join("");
 const top=[["顯示/隱藏",""],["重新計算","play"],["編輯節點",""],["Safe-Z","warn"],["進刀",""],["退刀",""],["驗證","play"],["刪除","danger"]].map(x=>'<button class="btn '+x[1]+'">'+x[0]+'</button>').join("");
 const fields=["刀具半徑補償","深度 -10.000","步距 0.500","進給 1200","轉速 12000","進刀 斜降","退刀 圓弧","碰撞檢查 開"].map(x=>'<div class="field"><span>'+x+'</span></div>').join("");
 return '<div class="toolstrip">'+top+'</div><div class="camgrid" style="grid-template-columns:260px minmax(0,1fr) 290px;margin-top:9px">'+
 panel("刀路列表",'<div class="ops">'+ops+'</div>')+
 '<section class="panel"><div class="head"><h2>刀路 3D 編輯區</h2><small>顯示與重新計算分開</small></div><div class="body"><div class="preview"></div></div></section>'+
 panel("刀路參數",'<div class="form">'+fields+'</div>')+'</div>';

function menuPage(){

 function eventPoint(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

 function shapeDistance(sh,p){
   if(sh.type==="line")return pointSegDistance(p,sh.a,sh.b);
   if(sh.type==="rect"){return Math.min(...segments(sh).map(x=>pointSegDistance(p,x[0],x[1])))}
   if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")return Math.abs(dist(p,sh.c)-sh.r);
   return Infinity;
 }
 function selectAt(p){
   const tol=10/state.view.scale;let best=null,bestD=Infinity;
   for(let i=state.shapes.length-1;i>=0;i--){const d=shapeDistance(state.shapes[i],p);if(d<tol&&d<bestD){best=state.shapes[i];bestD=d}}
   state.selectedId=best?.id||null;state.lastPick={...p};updateInfo();draw();
 }

 function addShape(sh){
   sh.id=newId();sh.connected=false;state.shapes.push(sh);state.selectedId=sh.id;state.points=[];pushHistory();
 }
 function commitPoint(p){
   if(state.tool==="SELECT"){selectAt(p);return}
   if(state.tool==="PAN")return;
   state.points.push({...p});
   if(state.tool==="LINE"&&state.points.length===2)addShape({type:"line",a:state.points[0],b:state.points[1]});
   else if(state.tool==="RECT"&&state.points.length===2)addShape({type:"rect",a:state.points[0],b:state.points[1]});
   else if((state.tool==="CIRCLE"||state.tool==="HOLE")&&state.points.length===2)addShape({type:state.tool.toLowerCase(),c:state.points[0],r:Math.max(.001,dist(state.points[0],state.points[1]))});
   else if(state.tool==="ARC"&&state.points.length===3){
     const c=state.points[0],r=Math.max(.001,dist(c,state.points[1])),a0=Math.atan2(state.points[1].y-c.y,state.points[1].x-c.x),a1=Math.atan2(state.points[2].y-c.y,state.points[2].x-c.x);
     addShape({type:"arc",c,r,a0,a1});
   }else draw();
 }

 function setTool(tool){
   state.tool=tool;state.points=[];state.panDrag=null;
   root.querySelectorAll("[data-cad-tool]").forEach(b=>b.classList.toggle("cadSelected",b.dataset.cadTool===tool));
   toolHud.textContent=tool;msgEl.textContent=tool==="ARC"?"ARC：圓心 → 起點 → 終點。":tool==="PAN"?"拖曳平移；雙指也可縮放/平移。":tool==="SELECT"?"點選幾何後可 Trim / Extend / Offset / Array / DIM。":"點選畫布建立 "+tool+"。";
   draw();
 }

 function translateShape(sh,dx,dy){
   const cp=clone(sh);cp.id=newId();
   for(const k of ["a","b","c"])if(cp[k]){cp[k].x+=dx;cp[k].y+=dy}
   return cp;
 }
 function mutateSelected(fn,msg){
   const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return false}
   const ok=fn(sh);if(ok===false)return false;pushHistory();msgEl.textContent=msg;return true;
 }
 function trimSelected(){
   mutateSelected(sh=>{
     if(sh.type!=="line"){msgEl.textContent="TRIM 目前對 LINE 生效。";return false}
     const hits=[];
     for(const other of state.shapes){if(other.id===sh.id)continue;for(const sg of segments(other)){const p=lineIntersection(sh.a,sh.b,sg[0],sg[1],true,true);if(p&&p.t>1e-5&&p.t<1-1e-5)hits.push(p)}}
     if(!hits.length){msgEl.textContent="找不到可 Trim 的交點。";return false}
     hits.sort((u,v)=>dist(u,state.lastPick)-dist(v,state.lastPick));const p=hits[0];
     if(dist(sh.a,state.lastPick)<dist(sh.b,state.lastPick))sh.a={x:p.x,y:p.y};else sh.b={x:p.x,y:p.y};
   },"TRIM 完成。");
 }
 function extendSelected(){
   mutateSelected(sh=>{
     if(sh.type!=="line"){msgEl.textContent="EXTEND 目前對 LINE 生效。";return false}
     const hits=[];
     for(const other of state.shapes){if(other.id===sh.id)continue;for(const sg of segments(other)){const p=lineIntersection(sh.a,sh.b,sg[0],sg[1],false,true);if(p&&(p.t<0||p.t>1))hits.push(p)}}
     if(!hits.length){msgEl.textContent="找不到可 Extend 的交點。";return false}
     hits.sort((u,v)=>Math.min(Math.abs(u.t),Math.abs(u.t-1))-Math.min(Math.abs(v.t),Math.abs(v.t-1)));const p=hits[0];
     if(p.t<0)sh.a={x:p.x,y:p.y};else sh.b={x:p.x,y:p.y};
   },"EXTEND 完成。");
 }
 function offsetSelected(){
   const d=Number(offsetInput.value)||0;
   const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return}
   let cp=clone(sh);cp.id=newId();
   if(sh.type==="line"){const dx=sh.b.x-sh.a.x,dy=sh.b.y-sh.a.y,len=Math.hypot(dx,dy)||1,n={x:-dy/len*d,y:dx/len*d};cp.a.x+=n.x;cp.a.y+=n.y;cp.b.x+=n.x;cp.b.y+=n.y}
   else if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")cp.r=Math.max(.001,sh.r+d);
   else if(sh.type==="rect"){const minX=Math.min(sh.a.x,sh.b.x)-d,maxX=Math.max(sh.a.x,sh.b.x)+d,minY=Math.min(sh.a.y,sh.b.y)-d,maxY=Math.max(sh.a.y,sh.b.y)+d;cp.a={x:minX,y:minY};cp.b={x:maxX,y:maxY}}
   else return;
   state.shapes.push(cp);state.selectedId=cp.id;pushHistory();msgEl.textContent="OFFSET "+d.toFixed(3)+" mm 完成。";
 }
 function arraySelected(){
   const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return}
   const count=Math.max(2,Math.min(99,Math.trunc(Number(arrayCountInput.value)||3))),spacing=Number(arraySpacingInput.value)||10;
   for(let i=1;i<count;i++)state.shapes.push(translateShape(sh,spacing*i,0));
   pushHistory();msgEl.textContent="ARRAY "+count+" 個，X 間距 "+spacing.toFixed(3)+" mm。";
 }
 function dimensionSelected(){
   const val=Math.max(.001,Number(dimInput.value)||.001);
   mutateSelected(sh=>{
     if(sh.type==="line"){const dx=sh.b.x-sh.a.x,dy=sh.b.y-sh.a.y,len=Math.hypot(dx,dy)||1;sh.b={x:sh.a.x+dx/len*val,y:sh.a.y+dy/len*val}}
     else if(sh.type==="circle"||sh.type==="hole")sh.r=val/2;
     else if(sh.type==="arc")sh.r=val;
     else if(sh.type==="rect"){const sign=sh.b.x>=sh.a.x?1:-1;sh.b.x=sh.a.x+sign*val}
   },"DIM 已套用 "+val.toFixed(3)+" mm。");
 }
 function action(name){
   if(name==="UNDO"){if(state.historyIndex>0){state.historyIndex--;loadSnapshot(state.historyIndex)}return}
   if(name==="REDO"){if(state.historyIndex<state.history.length-1){state.historyIndex++;loadSnapshot(state.historyIndex)}return}
   if(name==="FIT"){fit();return}
   if(name==="SNAP"){state.snap=!state.snap;snapEl.textContent=state.snap?"SNAP ON":"SNAP OFF";root.querySelector('[data-cad-action="SNAP"]').classList.toggle("play",state.snap);draw();return}
   if(name==="TRIM"){trimSelected();return}
   if(name==="EXTEND"){extendSelected();return}
   if(name==="OFFSET"){offsetSelected();return}
   if(name==="ARRAY"){arraySelected();return}
   if(name==="DIM"){dimensionSelected();return}
   if(name==="CONNECT"){mutateSelected(sh=>{sh.connected=true},"CONNECT：只改拓樸狀態，不破壞幾何。");return}
   if(name==="DISCONNECT"){mutateSelected(sh=>{sh.connected=false},"DISCONNECT：幾何保留。");return}
   if(name==="DELETE"){
     const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return}
     const now=Date.now();
     if(now>state.deleteArmedUntil){state.deleteArmedUntil=now+2500;msgEl.textContent="DELETE 已待命：2.5 秒內再按一次才刪除 #"+sh.id+"。";return}
     state.deleteArmedUntil=0;state.shapes=state.shapes.filter(x=>x.id!==sh.id);state.selectedId=null;pushHistory();msgEl.textContent="已刪除選取幾何；可 Undo 還原。";return
   }
   if(name==="CLEAR"){
     if(!state.shapes.length)return;
     const now=Date.now();
     if(now>state.clearArmedUntil){state.clearArmedUntil=now+2500;msgEl.textContent="CLEAR 已待命：2.5 秒內再按一次才清空 CAD。";return}
     state.clearArmedUntil=0;state.shapes=[];state.selectedId=null;state.points=[];pushHistory();msgEl.textContent="CAD 畫布已清除；可 Undo 還原。";return
   }
 }

 function boundsOfShapes(){
   if(!state.shapes.length)return null;const pts=[];
   for(const sh of state.shapes){
     if(sh.type==="line"){pts.push(sh.a,sh.b)}
     else if(sh.type==="rect")pts.push(...rectCorners(sh));
     else if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")pts.push({x:sh.c.x-sh.r,y:sh.c.y-sh.r},{x:sh.c.x+sh.r,y:sh.c.y+sh.r});
   }
   return{minX:Math.min(...pts.map(p=>p.x)),maxX:Math.max(...pts.map(p=>p.x)),minY:Math.min(...pts.map(p=>p.y)),maxY:Math.max(...pts.map(p=>p.y))};
 }
 function fit(){
   const {w,h}=resize(),b=boundsOfShapes();if(!b){state.view={scale:4,panX:0,panY:0};draw();return}
   const ww=Math.max(1,b.maxX-b.minX),hh=Math.max(1,b.maxY-b.minY);
   state.view.scale=Math.max(.15,Math.min(60,Math.min((w-80)/ww,(h-80)/hh)));
   const cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2;state.view.panX=-cx*state.view.scale;state.view.panY=cy*state.view.scale;
   persist();draw();
 }
 function updateInfo(){
   countEl.textContent=state.shapes.length+" entities";
   const sh=currentSelected();
   selectedEl.textContent=sh?sh.type.toUpperCase()+" #"+sh.id:"無";
   topologyEl.textContent=sh?.connected?"CONNECTED":"DISCONNECTED";
 }
 function measureText(sh){
   if(sh.type==="line")return "L "+dist(sh.a,sh.b).toFixed(3);
   if(sh.type==="rect")return "W "+Math.abs(sh.b.x-sh.a.x).toFixed(3)+" H "+Math.abs(sh.b.y-sh.a.y).toFixed(3);
   if(sh.type==="circle"||sh.type==="hole")return "Ø "+(sh.r*2).toFixed(3);
   if(sh.type==="arc")return "R "+sh.r.toFixed(3);
   return "";
 }

 function drawShape(sh,c,w,h,preview=false){
   const sel=sh.id===state.selectedId,stroke=preview?"rgba(255,255,255,.5)":sel?"#ff4da6":sh.connected?"#33f39b":"#27e9ff";
   c.strokeStyle=stroke;c.lineWidth=sel?2.3:1.5;c.setLineDash(preview?[6,5]:[]);c.beginPath();
   if(sh.type==="line"){const a=w2s(sh.a,w,h),b=w2s(sh.b,w,h);c.moveTo(a.x,a.y);c.lineTo(b.x,b.y)}
   else if(sh.type==="rect"){const a=w2s(sh.a,w,h),b=w2s(sh.b,w,h);c.rect(a.x,a.y,b.x-a.x,b.y-a.y)}
   else if(sh.type==="circle"||sh.type==="hole"){const cc=w2s(sh.c,w,h);c.arc(cc.x,cc.y,sh.r*state.view.scale,0,Math.PI*2)}
   else if(sh.type==="arc"){const cc=w2s(sh.c,w,h);c.arc(cc.x,cc.y,sh.r*state.view.scale,-sh.a0,-sh.a1,true)}
   c.stroke();c.setLineDash([]);
   if(sh.type==="hole"){const cc=w2s(sh.c,w,h),rr=sh.r*state.view.scale;c.strokeStyle=stroke;c.beginPath();c.moveTo(cc.x-rr*.6,cc.y);c.lineTo(cc.x+rr*.6,cc.y);c.moveTo(cc.x,cc.y-rr*.6);c.lineTo(cc.x,cc.y+rr*.6);c.stroke()}
   if(sel&&!preview){const label=measureText(sh);if(label){const anchor=sh.c||sh.a||{x:0,y:0},q=w2s(anchor,w,h);c.fillStyle="#fff";c.font="11px ui-monospace,monospace";c.fillText(label,q.x+8,q.y-8)}}
 }
 function previewShape(){
   const p=state.snapPoint||state.cursor;if(!state.points.length)return null;
   if(state.tool==="LINE")return{type:"line",a:state.points[0],b:p};
   if(state.tool==="RECT")return{type:"rect",a:state.points[0],b:p};
   if(state.tool==="CIRCLE"||state.tool==="HOLE")return{type:state.tool.toLowerCase(),c:state.points[0],r:Math.max(.001,dist(state.points[0],p))};
   if(state.tool==="ARC"&&state.points.length===1)return{type:"circle",c:state.points[0],r:Math.max(.001,dist(state.points[0],p))};
   if(state.tool==="ARC"&&state.points.length===2){const c=state.points[0],r=Math.max(.001,dist(c,state.points[1])),a0=Math.atan2(state.points[1].y-c.y,state.points[1].x-c.x),a1=Math.atan2(p.y-c.y,p.x-c.x);return{type:"arc",c,r,a0,a1}}
   return null;
 }
 function draw(){
   const {w,h}=resize(),c=ctx;c.clearRect(0,0,w,h);c.fillStyle="#010306";c.fillRect(0,0,w,h);
   const scale=state.view.scale,grid=10;
   const left=s2w({x:0,y:h},w,h).x,right=s2w({x:w,y:0},w,h).x,bottom=s2w({x:0,y:h},w,h).y,top=s2w({x:w,y:0},w,h).y;
   c.lineWidth=1;c.strokeStyle="rgba(39,233,255,.055)";
   for(let x=Math.floor(left/grid)*grid;x<=right;x+=grid){const a=w2s({x,y:bottom},w,h),b=w2s({x,y:top},w,h);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
   for(let y=Math.floor(bottom/grid)*grid;y<=top;y+=grid){const a=w2s({x:left,y},w,h),b=w2s({x:right,y},w,h);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
   const ox=w2s({x:0,y:0},w,h);c.strokeStyle="rgba(39,233,255,.28)";c.beginPath();c.moveTo(0,ox.y);c.lineTo(w,ox.y);c.moveTo(ox.x,0);c.lineTo(ox.x,h);c.stroke();
   for(const sh of state.shapes)drawShape(sh,c,w,h,false);
   const pv=previewShape();if(pv)drawShape(pv,c,w,h,true);
   if(state.snap&&state.snapPoint){const q=w2s(state.snapPoint,w,h);c.strokeStyle="#ffb326";c.lineWidth=1.5;c.beginPath();c.moveTo(q.x-7,q.y);c.lineTo(q.x+7,q.y);c.moveTo(q.x,q.y-7);c.lineTo(q.x,q.y+7);c.stroke()}
 }

 canvas.addEventListener("pointerdown",e=>{
   canvas.setPointerCapture(e.pointerId);const sp=eventPoint(e);state.pointers.set(e.pointerId,sp);const {w,h}=resize();
   if(state.pointers.size===2){
     const pts=[...state.pointers.values()],dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
     state.gesture={dist:Math.hypot(dx,dy)||1,scale:state.view.scale,panX:state.view.panX,panY:state.view.panY,cx:(pts[0].x+pts[1].x)/2,cy:(pts[0].y+pts[1].y)/2};
     state.points=[];return;
   }
   const raw=s2w(sp,w,h),sn=snapWorld(raw);state.cursor=raw;state.snapPoint=sn.p;state.snapType=sn.type;state.lastPick={...sn.p};
   if(state.tool==="PAN"){state.panDrag={sp,panX:state.view.panX,panY:state.view.panY};return}
   commitPoint(sn.p);
 });
 canvas.addEventListener("pointermove",e=>{
   const sp=eventPoint(e);if(state.pointers.has(e.pointerId))state.pointers.set(e.pointerId,sp);const {w,h}=resize();
   if(state.gesture&&state.pointers.size>=2){
     const pts=[...state.pointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,dd=Math.hypot(dx,dy)||1,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
     state.view.scale=Math.max(.15,Math.min(80,state.gesture.scale*dd/state.gesture.dist));
     state.view.panX=state.gesture.panX+(cx-state.gesture.cx);state.view.panY=state.gesture.panY+(cy-state.gesture.cy);draw();return;
   }
   if(state.panDrag&&state.tool==="PAN"){state.view.panX=state.panDrag.panX+(sp.x-state.panDrag.sp.x);state.view.panY=state.panDrag.panY+(sp.y-state.panDrag.sp.y);draw();return}
   const raw=s2w(sp,w,h),sn=snapWorld(raw);state.cursor=raw;state.snapPoint=sn.p;state.snapType=sn.type;
   coordEl.textContent="X "+sn.p.x.toFixed(3)+" Y "+sn.p.y.toFixed(3)+(sn.type?" • "+sn.type:"");draw();
 });
 function releasePointer(e){
   state.pointers.delete(e.pointerId);if(state.pointers.size<2){state.gesture=null;if(state.panDrag){state.panDrag=null;persist()}}
 }
 canvas.addEventListener("pointerup",releasePointer);canvas.addEventListener("pointercancel",releasePointer);
 canvas.addEventListener("wheel",e=>{
   e.preventDefault();const sp=eventPoint(e),{w,h}=resize(),before=s2w(sp,w,h),factor=e.deltaY<0?1.12:.89;
   state.view.scale=Math.max(.15,Math.min(80,state.view.scale*factor));
   const after=w2s(before,w,h);state.view.panX+=sp.x-after.x;state.view.panY+=sp.y-after.y;persist();draw();
 },{passive:false});

 root.addEventListener("click",e=>{
   const tb=e.target.closest("[data-cad-tool]");if(tb){setTool(tb.dataset.cadTool);return}
   const ab=e.target.closest("[data-cad-action]");if(ab){action(ab.dataset.cadAction);return}
 });
 if(persisted?.shapes?.length)msgEl.textContent="Recovery：已自動還原 "+persisted.shapes.length+" 個 CAD 幾何。";
 setTool("SELECT");updateInfo();draw();
}
pages.forEach(([name,color])=>{
 const b=document.createElement("button");b.textContent=name;b.dataset.page=name;b.style.setProperty("--accent",color);b.onclick=()=>show(name);nav.appendChild(b);
 const s=document.createElement("section");s.className="screen";s.dataset.page=name;
 s.innerHTML=name==="功能"?menuPage():name==="CAD"?cadPage():name==="CAM"?camPage():name==="刀路"?toolpathPage():simPage(name);
 screens.appendChild(s);
});
document.querySelectorAll("[data-runtime]").forEach(makeRuntime);
document.querySelectorAll("[data-cad-runtime]").forEach(makeCadRuntime);
function show(name){
 if(!pages.some(p=>p[0]===name))name="5AX";
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===name));
 document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.dataset.page===name));
 history.replaceState(null,"","#"+encodeURIComponent(name));
 setTimeout(()=>window.dispatchEvent(new Event("resize")),0);
}
show(decodeURIComponent((location.hash||"#5AX").slice(1)));
</script>
</body>
