<style>
:root{
 --bg:#020407;--panel:#060a0f;--panel2:#0a1017;--panel3:#0d151e;
 --text:#eefbff;--muted:#879da9;--cyan:#27e9ff;--blue:#3694ff;--green:#33f39b;
 --amber:#ffb326;--pink:#ff4da6;--violet:#9f72ff;--red:#ff465f;--line:#193446;
 --shadow:0 14px 38px rgba(0,0,0,.55);--r:14px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020407;color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",Inter,system-ui,sans-serif}
button,textarea,input,select{font:inherit}button{color:inherit}
.app{min-height:100vh;background:
 radial-gradient(circle at 38% 0%,rgba(39,233,255,.045),transparent 29%),
 radial-gradient(circle at 100% 60%,rgba(255,77,166,.03),transparent 24%),#020407}
.top{min-height:58px;display:flex;align-items:center;gap:12px;padding:7px 10px;position:sticky;top:0;z-index:30;
 background:rgba(2,4,7,.97);border-bottom:1px solid rgba(39,233,255,.28);box-shadow:0 8px 30px #000}
.brand{display:flex;align-items:center;gap:9px;min-width:190px}.logo{font-weight:900;font-size:21px;letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}
.status{margin-left:auto;color:var(--green);font-size:11px;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(9,minmax(72px,1fr));gap:6px;flex:1;max-width:850px}
.nav button,.btn{border:1px solid #223846;background:linear-gradient(#0d141c,#05080c);border-radius:10px;min-height:40px;cursor:pointer;
 box-shadow:inset 0 1px rgba(255,255,255,.045),0 7px 18px rgba(0,0,0,.35)}
.nav button:hover,.btn:hover{border-color:#2e6681}
.btn:disabled{opacity:.34;cursor:not-allowed;border-color:#26323a!important;box-shadow:none!important;color:#70818b!important}
.nav button.active{border-color:var(--accent,var(--cyan));box-shadow:0 0 18px color-mix(in srgb,var(--accent,var(--cyan)) 32%,transparent),inset 0 0 18px color-mix(in srgb,var(--accent,var(--cyan)) 10%,transparent)}
.shell{padding:9px;display:grid;gap:9px}
.screen{display:none}.screen.active{display:block}
.panel{background:linear-gradient(180deg,#080d12,#04070a);border:1px solid rgba(71,146,177,.34);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid rgba(63,139,168,.24)}
.head h2,.head h3{font-size:14px;margin:0}.head small{color:var(--muted)}.head .spacer{flex:1}
.body{padding:9px}
.simgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,.86fr);gap:9px;min-height:690px}
.simleft{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.axisbar{display:flex;gap:6px;flex-wrap:wrap}
.axis{border:1px solid rgba(39,233,255,.3);background:#050a0e;border-radius:9px;padding:6px 9px;font-size:11px;min-width:95px}
.axis.a{border-color:rgba(255,179,38,.5)}.axis.b,.axis.c{border-color:rgba(255,77,166,.5)}
.sceneWrap{position:relative;min-height:530px;border-radius:11px;border:1px solid #102934;background:#010306;overflow:hidden}
.sim3dCanvas,.simCanvas{position:absolute;inset:0;display:block;width:100%;height:100%;min-height:530px}
.sim3dCanvas{background:#010306;touch-action:none;cursor:grab}
.sim3dCanvas:active{cursor:grabbing}
.simCanvas{background:transparent;pointer-events:none}
.sceneHud{position:absolute;inset:12px 12px auto auto;padding:8px 9px;background:rgba(0,0,0,.78);border:1px solid rgba(39,233,255,.28);border-radius:9px;
 font:11px/1.55 ui-monospace,monospace;pointer-events:none;min-width:120px}
.sceneTitle{position:absolute;left:17px;bottom:15px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px #000}.sceneTitle small{display:block;color:var(--muted);font-weight:400;margin-top:3px;letter-spacing:0}
.controls{display:flex;gap:7px;flex-wrap:wrap;padding-top:8px}.controls .btn{min-width:78px;padding:7px 10px}
.play{border-color:rgba(51,243,155,.55)!important;color:#c8ffe6}.danger{border-color:rgba(255,70,95,.5)!important;color:#ffd0d7}.warn{border-color:rgba(255,179,38,.5)!important}
.editor{display:grid;grid-template-rows:auto auto 1fr auto auto;min-height:690px}
.editorbar{display:flex;gap:6px;flex-wrap:wrap}.editorbar .btn{min-height:32px;padding:5px 9px}
.code{width:100%;height:100%;min-height:390px;resize:none;background:#010305;color:#edf9ff;border:1px solid #173548;border-radius:9px;padding:12px;
 font:12px/1.62 "Cascadia Mono","Consolas",monospace;outline:none;tab-size:2}
.code:focus{border-color:var(--violet);box-shadow:0 0 18px rgba(159,114,255,.12)}
.execView{max-height:165px;overflow:auto;background:#010305;border:1px solid #142a37;border-radius:9px;padding:6px;font:11px/1.5 "Cascadia Mono","Consolas",monospace}
.execLine{padding:2px 5px;border-left:2px solid transparent;color:#a9bac3;white-space:pre}
.execLine.active{color:#fff;background:rgba(39,233,255,.09);border-left-color:var(--cyan)}
.execLine.done{color:#6f8c7c}
.execLine.collision{color:#ff9aaa;border-left-color:#ff465f;background:rgba(255,70,95,.07)}
.execLine.alarm{color:#fff;border-left-color:#ff465f;background:rgba(255,70,95,.22);box-shadow:inset 0 0 16px rgba(255,70,95,.12)}
.editactions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.editactions .btn{min-height:34px}
.runtimeStatus{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:6px;margin-top:8px}
.metric{padding:8px;border:1px solid #173344;border-radius:9px;background:#04080b}.metric b{display:block;font-size:9px;color:var(--muted);margin-bottom:2px}.metric span{font-size:12px}
.aigIssueCenter{display:none;margin:7px 0;padding:8px 10px;border-radius:9px;border:1px solid #31414b;background:#05090c;font-size:11px;line-height:1.5}
.aigIssueCenter.show{display:block}.aigIssueCenter.info{border-color:#24546b;color:#bfefff}.aigIssueCenter.warn{border-color:#806119;color:#ffd888;background:rgba(255,179,38,.06)}.aigIssueCenter.error{border-color:#315b6e;color:#d9f7ff;background:rgba(39,233,255,.05)}
[data-advanced-only]{display:none!important}body.aigAdvanced [data-advanced-only]{display:block!important}
.fieldIssue{display:none;margin-top:4px;font-size:9px;line-height:1.35}.fieldIssue.show{display:block}.fieldIssue.warn{color:#ffcf70}.fieldIssue.error{color:#d9f7ff}
input.aigWarn,select.aigWarn,textarea.aigWarn{border-color:#9b731d!important;box-shadow:0 0 0 1px rgba(255,179,38,.15)!important}
input.aigError,select.aigError,textarea.aigError{border-color:#3f6d82!important;box-shadow:0 0 0 1px rgba(39,233,255,.14)!important}
.progress{height:7px;background:#101820;border-radius:99px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 12px rgba(39,233,255,.35)}
.workgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:9px;min-height:690px}
.canvas{min-height:580px;background:
 linear-gradient(rgba(39,233,255,.028) 1px,transparent 1px),
 linear-gradient(90deg,rgba(39,233,255,.028) 1px,transparent 1px),#020508;background-size:32px 32px;border-radius:11px}
.cadCanvasWrap{position:relative;min-height:580px;border:1px solid #102934;border-radius:11px;overflow:hidden;background:#010306}
.cadCanvas{display:block;width:100%;height:580px;touch-action:none;cursor:crosshair;background:#010306}
.cadHud{position:absolute;left:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.cadHud span{padding:4px 7px;background:rgba(0,0,0,.76);border:1px solid #17384a;border-radius:7px;font:10px ui-monospace,monospace;color:#bfefff}
.cadSelected{border-color:var(--cyan)!important;box-shadow:0 0 16px rgba(39,233,255,.2)!important}
.cadSide{display:grid;gap:7px}.cadSide .field{min-height:48px}
.cadSideControls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.cadSideControls .btn{padding:7px}
.cadMsg{min-height:44px;color:#b7c8d1;font-size:10px;line-height:1.45}
.toolstrip{display:flex;gap:6px;flex-wrap:wrap}.toolstrip .btn{min-width:84px;padding:7px}
.sidegroup{display:grid;gap:7px}.sidegroup .btn{padding:8px}
.camgrid{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:9px;min-height:690px}
.ops{display:grid;gap:6px}.ops .btn{width:100%;padding:8px}
.preview{min-height:580px;background:radial-gradient(circle,rgba(51,243,155,.08),transparent 42%),#020508;border-radius:11px;border:1px solid #123128}
.camCanvas{display:block;width:100%;height:580px;touch-action:none;background:#010306;border-radius:11px;border:1px solid #123128}
.tpCanvas{display:block;width:100%;height:580px;touch-action:none;background:#010306;border-radius:11px;border:1px solid #331538}
.tpList{display:grid;gap:6px;max-height:520px;overflow:auto}.tpList .btn{width:100%;text-align:left;padding:8px}
.tpNodeEdit{border-color:var(--pink)!important;box-shadow:0 0 16px rgba(255,77,166,.18)!important}
.camStats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.camStats .field{min-height:48px}
.form{display:grid;gap:8px}.field{padding:8px;background:#04080b;border:1px solid #18303e;border-radius:9px}.field b{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}.field span{font-size:12px}
.menuGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.menuCard{min-height:145px;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:800;border:1px solid rgba(39,233,255,.28);background:linear-gradient(145deg,#0a1118,#030507);border-radius:15px;cursor:pointer}
.menuCard:hover{box-shadow:0 0 22px rgba(39,233,255,.1)}
.menuCard.active{border-color:var(--violet);box-shadow:0 0 22px rgba(159,114,255,.18)}
.menuDetail{display:grid;gap:9px}.menuDetailGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menuDetail .field input,.menuDetail .field select{width:100%;margin-top:5px;background:#010305;color:#eefbff;border:1px solid #24485a;border-radius:6px;padding:6px}
@media(max-width:700px){.menuDetailGrid{grid-template-columns:1fr}}

.ncEditGrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:9px;min-height:690px}
.ncEditorMain{display:grid;grid-template-rows:auto 1fr auto auto;min-width:0}
.ncKeypad{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:6px}
.ncKeypad .btn{min-height:42px;padding:6px 5px;font:11px/1.1 "Cascadia Mono","Consolas",monospace}
.ncCursor{display:grid;gap:7px}.ncCursor .field{min-height:50px}
.ncShortcut{font:10px/1.5 "Cascadia Mono","Consolas",monospace;color:#8fa7b4}
.ncAlarm{display:none;margin-top:6px;padding:8px 10px;border:1px solid #ff465f;border-radius:8px;background:rgba(255,70,95,.12);color:#ffe8ec;font:11px/1.45 "Cascadia Mono","Consolas",monospace;white-space:pre-wrap}.ncAlarm.show{display:block}
@media(max-width:920px){.ncEditGrid{grid-template-columns:1fr}.ncKeypad{grid-template-columns:repeat(5,1fr)}}
@media(max-width:560px){.ncKeypad{grid-template-columns:repeat(4,1fr)}.ncKeypad .btn{min-height:44px}}

.footer{padding:6px 10px 10px;color:#66808f;font-size:9px;text-align:center}
.badge{font-size:10px;color:var(--muted);border:1px solid #233846;border-radius:999px;padding:5px 8px}
.notice{font-size:10px;color:#b7c8d1;padding:6px 8px;border:1px solid #172b36;border-radius:8px;background:#03070a}
.param{display:flex;align-items:center;gap:5px;min-height:32px;padding:4px 7px;border:1px solid #1b3441;border-radius:9px;background:#03070a;color:var(--muted);font-size:10px}
.param input{width:62px;background:#010305;color:var(--text);border:1px solid #24485a;border-radius:6px;padding:4px 5px;outline:none}
.param input:focus{border-color:var(--cyan)}
.fieldIssue{display:none;width:100%;font-size:9px;line-height:1.35;margin-top:3px;padding:3px 6px;border-radius:6px}
.fieldIssue.show{display:block}
.fieldIssue.error{color:#d9f7ff;background:rgba(39,233,255,.07);border:1px solid rgba(39,233,255,.22)}
.fieldIssue.warn{color:#ffe6b4;background:rgba(255,179,38,.10);border:1px solid rgba(255,179,38,.30)}
.fieldIssue.info{color:#bfefff;background:rgba(39,233,255,.08);border:1px solid rgba(39,233,255,.22)}
.field-invalid{border-color:#3f6d82!important;box-shadow:0 0 0 1px rgba(39,233,255,.14)!important}
.field-warning{border-color:var(--amber)!important;box-shadow:0 0 0 1px rgba(255,179,38,.18)!important}
.guidanceTitle{font-weight:800;color:#dff9ff;margin-bottom:5px}.guidanceRow{display:grid;grid-template-columns:58px 1fr;gap:6px;margin-top:3px}.guidanceRow b{color:#8fc8d8}.guidanceActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.guidanceActions button{min-height:34px;padding:6px 9px;border:1px solid #315b6e;border-radius:8px;background:#07131a;color:#dff9ff}.guidanceFocus{outline:2px solid rgba(39,233,255,.55)!important;box-shadow:0 0 18px rgba(39,233,255,.18)!important}
.cycleTag{color:var(--amber)!important}
@media(max-width:920px){
 .top{height:auto;flex-wrap:wrap}.brand{min-width:140px}.nav{order:3;grid-template-columns:repeat(7,minmax(58px,1fr));max-width:none;flex-basis:100%}
 .simgrid,.workgrid,.camgrid{grid-template-columns:1fr}.editor{min-height:560px}.code{min-height:330px}
 .runtimeStatus{grid-template-columns:repeat(3,1fr)}.menuGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .shell{padding:6px}.status{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{min-height:42px;font-size:11px}
 .sceneWrap,.simCanvas{min-height:44vh}.cadCanvasWrap,.cadCanvas,.camCanvas,.tpCanvas{min-height:48vh;height:48vh}.simgrid{min-height:0}.editor{min-height:500px}.code{min-height:300px}.menuGrid{grid-template-columns:1fr 1fr}
 .runtimeStatus{grid-template-columns:repeat(2,1fr)}
}

@media(min-width:1100px){
 .workgrid{grid-template-columns:minmax(0,1fr) 260px}

 .top{gap:8px}

</style>

function parseWords(line){
 const clean=line.replace(/\([^)]*\)/g," ").replace(/;.*$/," ").trim().toUpperCase();
 const out={};
 const re=/([A-Z])\s*([-+]?\d*\.?\d+)/g;let m;
 while((m=re.exec(clean))) out[m[1]]=Number(m[2]);
 return {clean,out};
}
function compilePrograms(text){
 const sourceLines=text.split(/\r?\n/);
 const programs=new Map();
 programs.set("MAIN",[]);
 let current="MAIN",firstO=null;
 sourceLines.forEach((raw,line)=>{
   const clean=raw.replace(/\([^)]*\)/g," ").replace(/;.*$/," ").trim().toUpperCase();
   const om=clean.match(/^O\s*0*(\d+)\b/);
   if(om){
     current=String(Number(om[1]));
     if(firstO===null)firstO=current;
     if(!programs.has(current))programs.set(current,[]);
     return;
   }
   if(!programs.has(current))programs.set(current,[]);
   programs.get(current).push({raw,line,program:current});
 });
 let mainKey="MAIN";
 if((programs.get("MAIN")||[]).every(x=>!x.raw.trim()) && firstO!==null)mainKey=firstO;
 const errors=[],warnings=[],executionLines=[];
 const maxDepth=8,maxExpanded=12000;

 function expand(key,depth,stack,repeat=1){
   if(depth>maxDepth){errors.push("子程式巢狀超過 "+maxDepth+" 層："+stack.join("→"));return;}
   const body=programs.get(String(Number(key)))||programs.get(key);
   if(!body){errors.push("找不到子程式 O"+key);return;}
   for(let r=0;r<repeat;r++){
     for(const item of body){
       if(executionLines.length>=maxExpanded){errors.push("子程式展開超過 "+maxExpanded+" 行，已停止以避免無限迴圈。");return;}
       const clean=item.raw.replace(/\([^)]*\)/g," ").replace(/;.*$/," ").trim().toUpperCase();
       const {out}=parseWords(item.raw);
       const m98=/M\s*0*98\b/.test(clean);
       const m99=/M\s*0*99\b/.test(clean);
       const m30=/M\s*0*30\b/.test(clean);
       if(m98){
         const p=Number.isFinite(out.P)?Math.trunc(out.P):null;
         const l=Number.isFinite(out.L)?Math.max(1,Math.min(999,Math.trunc(out.L))):1;
         executionLines.push({...item,subCall:p,callRepeat:l,callDepth:depth});
         if(p===null){errors.push("M98 缺少 P 子程式號：第 "+(item.line+1)+" 行");continue;}
         const pKey=String(Number(p));
         if(stack.includes(pKey)){errors.push("偵測到子程式遞迴："+[...stack,pKey].join("→"));continue;}
         expand(pKey,depth+1,[...stack,pKey],l);
         continue;
       }
       executionLines.push({...item,callDepth:depth,subReturn:m99});
       if(m99)return;
       if(m30 && key===mainKey)return;
     }
   }
 }
 expand(mainKey,0,[mainKey],1);
 if(!executionLines.length)warnings.push("沒有可執行的 G-code 區塊。");
 return {sourceLines,executionLines,programs,mainKey,errors,warnings};
}

function parseProgram(text,axis,opts={}){
 const compiled=compilePrograms(text);
 const lines=compiled.sourceLines;
 const executionLines=compiled.executionLines;
 let pos={X:0,Y:0,Z:0,A:0,B:0,C:0,F:0,S:0},absolute=true,motion="G0",plane="G17",returnMode="G98";
 let cycle=null,cycleZ=null,cycleR=null,cycleQ=null;
 let machine={T:0,selectedTool:0,H:0,spindle:"M5",coolant:false,wcs:"G54",toolComp:false};
 const blocks=[];const errors=[...compiled.errors];const warnings=[...compiled.warnings];
 let currentMeta={subprogram:compiled.mainKey,subCall:null,subReturn:false,callDepth:0,callRepeat:1};
 let adaptiveContext=null;
 const stockTopRaw=Number(opts?.stock?.top),stockTop=Number.isFinite(stockTopRaw)?stockTopRaw:0;
 const g73Raw=Number(opts.g73Retract),g73Retract=Number.isFinite(g73Raw)?Math.max(0,g73Raw):0.5;

 function moveTo(line,raw,to,motionName,extra={}){
   const from={...pos},dest={...pos,...to};
   dest.F=Number.isFinite(to.F)?to.F:pos.F;dest.S=Number.isFinite(to.S)?to.S:pos.S;
   blocks.push({
     line,raw,kind:"move",motion:motionName,absolute,plane,from,to:dest,n:null,
     arc:{I:null,J:null,K:null,R:null},cutting:false,machine:{...machine},skipEligible:/^\s*\//.test(raw),...currentMeta,...extra
   });
   pos={...dest};
 }
 function resolveAxisValue(word,value,base){
   if(!Number.isFinite(value))return base;
   return absolute?value:base+value;
 }
 function invokeCycle(line,raw,out,cycleStart,resolvedXY=null,patternMeta={}){
   const initialZ=pos.Z;
   const x=resolvedXY?resolvedXY.X:resolveAxisValue("X",out.X,pos.X),y=resolvedXY?resolvedXY.Y:resolveAxisValue("Y",out.Y,pos.Y);
   if(x!==pos.X||y!==pos.Y)moveTo(line,raw,{X:x,Y:y},"G0",{cycle,cyclePhase:"xy",cutting:false,synthetic:true,...patternMeta});

   if(cycleStart || Number.isFinite(out.R)){
     if(Number.isFinite(out.R))cycleR=absolute?out.R:initialZ+out.R;
   }
   if(cycleStart || Number.isFinite(out.Z)){
     if(Number.isFinite(out.Z))cycleZ=absolute?out.Z:(cycleR??initialZ)+out.Z;
   }
   if(Number.isFinite(out.Q))cycleQ=Math.abs(out.Q);
   const safeRaw=Number(opts.safeZ),safeFallback=Number.isFinite(safeRaw)?safeRaw:5;
   const r=Number.isFinite(cycleR)?cycleR:Math.min(initialZ,safeFallback);
   const z=Number.isFinite(cycleZ)?cycleZ:pos.Z;
   if(pos.Z!==r)moveTo(line,raw,{Z:r},"G0",{cycle,cyclePhase:"rapid-r",cutting:false,synthetic:true,...patternMeta});
   const feed=Number.isFinite(out.F)?out.F:pos.F;

   if(cycle==="G81"){
     moveTo(line,raw,{Z:z,F:feed},"G1",{cycle,cyclePhase:"feed",cutting:z<stockTop,synthetic:true,drillBottom:true,...patternMeta});
   }else if(cycle==="G84"){
     moveTo(line,raw,{Z:z,F:feed},"G1",{cycle,cyclePhase:"tap-feed",cutting:z<stockTop,synthetic:true,drillBottom:true,tapping:true,...patternMeta});
     const tapReturn=returnMode==="G98"?initialZ:r;
     if(pos.Z!==tapReturn)moveTo(line,raw,{Z:tapReturn,F:feed},"G1",{cycle,cyclePhase:"tap-return",cutting:false,synthetic:true,tapping:true,...patternMeta});
     return;
   }else if(cycle==="G73"||cycle==="G83"){
     const q=Math.max(0.001,Number(cycleQ)||Math.max(1,Math.abs(r-z)));
     const dir=z<r?-1:1;
     let depth=r;
     let guard=0;
     while(((dir<0&&depth>z)||(dir>0&&depth<z))&&guard++<500){
       const next=dir<0?Math.max(z,depth-q):Math.min(z,depth+q);
       moveTo(line,raw,{Z:next,F:feed},"G1",{cycle,cyclePhase:"peck-feed",cutting:Math.min(depth,next)<stockTop,synthetic:true,drillBottom:next===z,...patternMeta});
       depth=next;
       if(depth===z)break;
       if(cycle==="G83"){
         moveTo(line,raw,{Z:r},"G0",{cycle,cyclePhase:"full-retract",cutting:false,synthetic:true,...patternMeta});
         const approach=dir<0?Math.max(depth+Math.min(q*.15,1),r):Math.min(depth-Math.min(q*.15,1),r);
         if(approach!==r)moveTo(line,raw,{Z:approach},"G0",{cycle,cyclePhase:"re-approach",cutting:false,synthetic:true,...patternMeta});
         depth=approach;
       }else{
         const retract=dir<0?Math.min(r,depth+g73Retract):Math.max(r,depth-g73Retract);
         moveTo(line,raw,{Z:retract},"G0",{cycle,cyclePhase:"chip-retract",cutting:false,synthetic:true,...patternMeta});
         depth=retract;
       }
     }
   }
   const returnZ=returnMode==="G98"?initialZ:r;
   if(pos.Z!==returnZ)moveTo(line,raw,{Z:returnZ},"G0",{cycle,cyclePhase:"return",cutting:false,synthetic:true,...patternMeta});
 }

 executionLines.forEach(item=>{
  const raw=item.raw,index=item.line;
  const adaptiveMatch=raw.match(/\(AIG\s+ADAPTIVE\s+2\.5D\s+L(\d+)\/(\d+)\s+R(\d+)\s+LOAD([\d.]+)%\)/i);
  if(adaptiveMatch){
    adaptiveContext={zLevelIndex:Number(adaptiveMatch[1]),zLevelCount:Number(adaptiveMatch[2]),adaptiveRing:Number(adaptiveMatch[3]),radialEngagement:Number(adaptiveMatch[4])/100};

 function save(){aigStorageSet(root,"aig-code-"+axis(),ta.value,axis()+" G-code");const rt=runtimes[axis()];if(rt?.reloadCode)rt.reloadCode(ta.value);stateEl.textContent="SAVED";msg.textContent="已儲存並同步到 "+axis()+" 模擬 Runtime。";refreshCursor()}
 function refreshNcEditorAlarm(focus=false){let parsed;try{parsed=parseProgram(ta.value,axis(),cfg())}catch(err){alarmEl.className="ncAlarm show";alarmEl.textContent="NC ALARM • 解析失敗 • "+(err?.message||String(err));stateEl.textContent="ALARM";return true}const alarm=ncEditorAlarm(ta.value,parsed);if(!alarm){alarmEl.className="ncAlarm";alarmEl.textContent="";return false}alarmEl.className="ncAlarm show";alarmEl.textContent="NC ALARM • L"+alarm.lineNumber+"\nGCODE: "+alarm.rawLine+"\n原因："+alarm.reason+"\n修正："+alarm.suggestion;stateEl.textContent="ALARM";if(focus)focusNcAlarmLine(ta,alarm.lineNumber);return true}
 function verify(){const parsed=parseProgram(ta.value,axis(),cfg());const syntaxAlarm=ncEditorAlarm(ta.value,parsed);blocksEl.textContent=parsed.blocks.length;if(syntaxAlarm){refreshNcEditorAlarm(true);msg.textContent="請直接修正上方 G-code ALARM 行後再驗證。";return}alarmEl.className="ncAlarm";alarmEl.textContent="";stateEl.textContent="PASS";msg.textContent="NC 驗證 PASS：只檢查 G-code。碰撞 / Setup / 3D 穩定性由 SIM 負責。";refreshCursor()}
 function lineBounds(){const pos=ta.selectionStart||0,lineStart=ta.value.lastIndexOf("\n",Math.max(0,pos-1))+1;let lineEnd=ta.value.indexOf("\n",pos);if(lineEnd<0)lineEnd=ta.value.length;return{lineStart,lineEnd}}
 function insertLine(){insertText("\n")}
 function deleteToken(){const a=ta.selectionStart,b=ta.selectionEnd;if(b>a)ta.setRangeText("",a,b,"end");else if(a>0)ta.setRangeText("",a-1,a,"end");refreshCursor()}
 function toggleBlockSkip(){const {lineStart,lineEnd}=lineBounds(),line=ta.value.slice(lineStart,lineEnd),m=line.match(/^\s*/)[0],i=lineStart+m.length;if(ta.value[i]==="/")ta.setRangeText("",i,i+1,"end");else ta.setRangeText("/",i,i,"end");ta.focus();refreshCursor()}
 function jump(where){const p=where==="TOP"?0:ta.value.length;ta.setSelectionRange(p,p);ta.focus();refreshCursor()}
 root.addEventListener("click",e=>aigGuard(root,"NC 操作",()=>{
   const key=e.target.closest("[data-nc-key]");if(key){const k=key.dataset.ncKey;if(k==="G/M 功能"){msg.textContent="常用：G90 G54 G43 H1 M8 • M98 P4 • M98 P5 • M99";return}insertText(k+" ");return}
   const b=e.target.closest("[data-nc-action]");if(!b)return;const cmd=b.dataset.ncAction;
   if(cmd==="LOAD")load();if(cmd==="SAVE")save();if(cmd==="VERIFY")verify();if(cmd==="SIM"){save();show(axis())}
   if(cmd==="INSERT")insertLine();if(cmd==="DELETE")deleteToken();if(cmd==="BLOCKSKIP")toggleBlockSkip();if(cmd==="TOP"||cmd==="BOTTOM")jump(cmd);
  },null,"warn"));
 ta.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(e.ctrlKey&&k==="s"){e.preventDefault();save()}else if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();verify()}else if(e.altKey&&k==="i"){e.preventDefault();insertLine()}else if(e.altKey&&k==="d"){e.preventDefault();deleteToken()}else if(e.altKey&&k==="b"){e.preventDefault();toggleBlockSkip()}});
 ["click","keyup","select","input"].forEach(ev=>ta.addEventListener(ev,refreshCursor));
 let alarmTimer;ta.addEventListener("input",()=>{clearTimeout(alarmTimer);alarmTimer=setTimeout(()=>refreshNcEditorAlarm(false),120)});
 axisEl.addEventListener("change",load);load();
}

function makeCadRuntime(root){
 const canvas=root.querySelector("[data-cad-canvas]"),ctx=canvas.getContext("2d");
 const countEl=root.querySelector("[data-cad-count]"),coordEl=root.querySelector("[data-cad-coord]"),snapEl=root.querySelector("[data-cad-snaphud]");
 const toolHud=root.querySelector("[data-cad-toolhud]"),selectedEl=root.querySelector("[data-cad-selected]"),topologyEl=root.querySelector("[data-cad-topology]"),msgEl=root.querySelector("[data-cad-msg]");
 const offsetInput=root.querySelector("[data-cad-offset]"),arrayCountInput=root.querySelector("[data-cad-array-count]"),arraySpacingInput=root.querySelector("[data-cad-array-spacing]"),dimInput=root.querySelector("[data-cad-dim]");
 let idSeed=1;
 const persisted=aigJsonRead(root,"aig-cad-draft-v1",null,"CAD AutoSave");
 const state={
   shapes:Array.isArray(persisted?.shapes)?persisted.shapes:[],
   tool:"SELECT",selectedId:null,points:[],cursor:{x:0,y:0},snapPoint:null,snapType:"",
   snap:true,view:persisted?.view||{scale:4,panX:0,panY:0},history:[],historyIndex:0,
   panDrag:null,pointers:new Map(),gesture:null,lastPick:{x:0,y:0},deleteArmedUntil:0,clearArmedUntil:0
 };
 function validateCadFields(){
   [offsetInput,arrayCountInput,arraySpacingInput,dimInput].forEach(aigValidateField);
   const off=Number(offsetInput.value),count=Number(arrayCountInput.value),spacing=Number(arraySpacingInput.value),dim=Number(dimInput.value);
   if(Number.isFinite(off)&&Math.abs(off)<1e-12)aigFieldIssue(offsetInput,"warn","OFFSET = 0.000 mm，不會產生幾何位移。");
   if(Number.isFinite(count)&&(!Number.isInteger(count)||count<2||count>99))aigFieldIssue(arrayCountInput,"error","ARRAY 數量必須是 2–99 的整數。");
   if(Number.isFinite(spacing)&&Math.abs(spacing)<1e-12)aigFieldIssue(arraySpacingInput,"warn","ARRAY X = 0.000 mm，複製物件會完全重疊。");
   if(Number.isFinite(dim)&&dim<=0)aigFieldIssue(dimInput,"error","DIM 必須大於 0 mm。");
 }
 for(const sh of state.shapes)idSeed=Math.max(idSeed,(Number(sh.id)||0)+1);
 const clone=x=>JSON.parse(JSON.stringify(x));
 const snapshot=()=>JSON.stringify(state.shapes);
 state.history=[snapshot()];

 function persist(){
   aigJsonWrite(root,"aig-cad-draft-v1",{shapes:state.shapes,view:state.view,updatedAt:Date.now()},"CAD AutoSave");
 }
 function pushHistory(){
   state.history=state.history.slice(0,state.historyIndex+1);
   state.history.push(snapshot());state.historyIndex=state.history.length-1;
   if(state.history.length>60){state.history.shift();state.historyIndex--;}
   persist();updateInfo();draw();
 }
 function loadSnapshot(i){
   state.shapes=JSON.parse(state.history[i]||"[]");state.selectedId=null;state.points=[];persist();updateInfo();draw();
 }
 function newId(){return idSeed++}
 function currentSelected(){return state.shapes.find(x=>x.id===state.selectedId)||null}

 function resize(){
   const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
   const w=Math.max(1,Math.floor(r.width*dpr)),h=Math.max(1,Math.floor(r.height*dpr));
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
   ctx.setTransform(dpr,0,0,dpr,0,0);
   return {w:r.width,h:r.height};
 }
 function w2s(p,w,h){return{x:w/2+state.view.panX+p.x*state.view.scale,y:h/2+state.view.panY-p.y*state.view.scale}}
 function s2w(p,w,h){return{x:(p.x-w/2-state.view.panX)/state.view.scale,y:-(p.y-h/2-state.view.panY)/state.view.scale}}
 function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
 function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
 function lineParam(p,a,b){
   const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<1e-12)return 0;
   return ((p.x-a.x)*dx+(p.y-a.y)*dy)/d2;
 }
 function pointSegDistance(p,a,b){
   const t=Math.max(0,Math.min(1,lineParam(p,a,b))),q={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};return dist(p,q);
 }
 function rectCorners(sh){
   return [{x:sh.a.x,y:sh.a.y},{x:sh.b.x,y:sh.a.y},{x:sh.b.x,y:sh.b.y},{x:sh.a.x,y:sh.b.y}];
 }
 function segments(sh){
   if(sh.type==="line")return [[sh.a,sh.b]];
   if(sh.type==="rect"){const c=rectCorners(sh);return [[c[0],c[1]],[c[1],c[2]],[c[2],c[3]],[c[3],c[0]]]}
   return [];
 }
 function lineIntersection(a,b,c,d,segmentAB=true,segmentCD=true){
   const r={x:b.x-a.x,y:b.y-a.y},ss={x:d.x-c.x,y:d.y-c.y},den=r.x*ss.y-r.y*ss.x;
   if(Math.abs(den)<1e-10)return null;
   const ca={x:c.x-a.x,y:c.y-a.y},t=(ca.x*ss.y-ca.y*ss.x)/den,u=(ca.x*r.y-ca.y*r.x)/den;
   if(segmentAB&&(t<-1e-9||t>1+1e-9))return null;
   if(segmentCD&&(u<-1e-9||u>1+1e-9))return null;
   return{x:a.x+t*r.x,y:a.y+t*r.y,t,u};
 }
 function shapeCandidates(){
   const out=[];
   for(const sh of state.shapes){
     if(sh.type==="line"){out.push({p:sh.a,type:"END"},{p:sh.b,type:"END"},{p:midpoint(sh.a,sh.b),type:"MID"})}
     if(sh.type==="rect"){const c=rectCorners(sh);c.forEach(p=>out.push({p,type:"END"}));for(let i=0;i<4;i++)out.push({p:midpoint(c[i],c[(i+1)%4]),type:"MID"});out.push({p:midpoint(sh.a,sh.b),type:"CENTER"})}
     if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")out.push({p:sh.c,type:"CENTER"});
     if(sh.type==="arc"){out.push({p:{x:sh.c.x+Math.cos(sh.a0)*sh.r,y:sh.c.y+Math.sin(sh.a0)*sh.r},type:"END"},{p:{x:sh.c.x+Math.cos(sh.a1)*sh.r,y:sh.c.y+Math.sin(sh.a1)*sh.r},type:"END"})}
   }
   const segs=[];for(const sh of state.shapes)for(const sg of segments(sh))segs.push(sg);
   for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){const p=lineIntersection(segs[i][0],segs[i][1],segs[j][0],segs[j][1],true,true);if(p)out.push({p,type:"INTERSECT"})}
   return out;
 }
 function snapWorld(raw){
   if(!state.snap)return{p:raw,type:""};
   const tol=10/state.view.scale,cands=shapeCandidates();let best=null,bestD=Infinity;
   for(const c of cands){const d=dist(raw,c.p);if(d<tol&&d<bestD){best=c;bestD=d}}
   let p=best?{...best.p}:{x:Math.round(raw.x),y:Math.round(raw.y)},type=best?best.type:"GRID";
   const anchor=state.points[0];
   if(anchor){
     if(Math.abs(raw.x-anchor.x)<tol){p.x=anchor.x;type=best?type+"+V":"V"}
     if(Math.abs(raw.y-anchor.y)<tol){p.y=anchor.y;type=best?type+"+H":"H"}
   }
   return{p,type};
 }
 function eventPoint(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

 function shapeDistance(sh,p){
   if(sh.type==="line")return pointSegDistance(p,sh.a,sh.b);
   if(sh.type==="rect"){return Math.min(...segments(sh).map(x=>pointSegDistance(p,x[0],x[1])))}
   if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")return Math.abs(dist(p,sh.c)-sh.r);
   return Infinity;
 }
 function selectAt(p){
   const tol=10/state.view.scale;let best=null,bestD=Infinity;
   for(let i=state.shapes.length-1;i>=0;i--){const d=shapeDistance(state.shapes[i],p);if(d<tol&&d<bestD){best=state.shapes[i];bestD=d}}
   state.selectedId=best?.id||null;state.lastPick={...p};updateInfo();draw();
 }

 function addShape(sh){
   sh.id=newId();sh.connected=false;state.shapes.push(sh);state.selectedId=sh.id;state.points=[];pushHistory();
 }
 function commitPoint(p){
   if(state.tool==="SELECT"){selectAt(p);return}
   if(state.tool==="PAN")return;
   state.points.push({...p});
   if(state.tool==="LINE"&&state.points.length===2)addShape({type:"line",a:state.points[0],b:state.points[1]});
   else if(state.tool==="RECT"&&state.points.length===2)addShape({type:"rect",a:state.points[0],b:state.points[1]});
   else if((state.tool==="CIRCLE"||state.tool==="HOLE")&&state.points.length===2)addShape({type:state.tool.toLowerCase(),c:state.points[0],r:Math.max(.001,dist(state.points[0],state.points[1]))});
   else if(state.tool==="ARC"&&state.points.length===3){
     const c=state.points[0],r=Math.max(.001,dist(c,state.points[1])),a0=Math.atan2(state.points[1].y-c.y,state.points[1].x-c.x),a1=Math.atan2(state.points[2].y-c.y,state.points[2].x-c.x);
     addShape({type:"arc",c,r,a0,a1});
   }else draw();
 }

 function setTool(tool){
   state.tool=tool;state.points=[];state.panDrag=null;
   root.querySelectorAll("[data-cad-tool]").forEach(b=>b.classList.toggle("cadSelected",b.dataset.cadTool===tool));
   toolHud.textContent=tool;msgEl.textContent=tool==="ARC"?"ARC：圓心 → 起點 → 終點。":tool==="PAN"?"拖曳平移；雙指也可縮放/平移。":tool==="SELECT"?"點選幾何後可 Trim / Extend / Offset / Array / DIM。":"點選畫布建立 "+tool+"。";
   draw();
 }

 function translateShape(sh,dx,dy){
   const cp=clone(sh);cp.id=newId();
   for(const k of ["a","b","c"])if(cp[k]){cp[k].x+=dx;cp[k].y+=dy}
   return cp;
 }
 function mutateSelected(fn,msg){
   const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return false}
   const ok=fn(sh);if(ok===false)return false;pushHistory();msgEl.textContent=msg;return true;
 }
 function trimSelected(){
   mutateSelected(sh=>{
     if(sh.type!=="line"){msgEl.textContent="TRIM 目前對 LINE 生效。";return false}
     const hits=[];
     for(const other of state.shapes){if(other.id===sh.id)continue;for(const sg of segments(other)){const p=lineIntersection(sh.a,sh.b,sg[0],sg[1],true,true);if(p&&p.t>1e-5&&p.t<1-1e-5)hits.push(p)}}
     if(!hits.length){msgEl.textContent="找不到可 Trim 的交點。";return false}
     hits.sort((u,v)=>dist(u,state.lastPick)-dist(v,state.lastPick));const p=hits[0];
     if(dist(sh.a,state.lastPick)<dist(sh.b,state.lastPick))sh.a={x:p.x,y:p.y};else sh.b={x:p.x,y:p.y};
   },"TRIM 完成。");
 }
 function extendSelected(){
   mutateSelected(sh=>{
     if(sh.type!=="line"){msgEl.textContent="EXTEND 目前對 LINE 生效。";return false}
     const hits=[];
     for(const other of state.shapes){if(other.id===sh.id)continue;for(const sg of segments(other)){const p=lineIntersection(sh.a,sh.b,sg[0],sg[1],false,true);if(p&&(p.t<0||p.t>1))hits.push(p)}}
     if(!hits.length){msgEl.textContent="找不到可 Extend 的交點。";return false}
     hits.sort((u,v)=>Math.min(Math.abs(u.t),Math.abs(u.t-1))-Math.min(Math.abs(v.t),Math.abs(v.t-1)));const p=hits[0];
     if(p.t<0)sh.a={x:p.x,y:p.y};else sh.b={x:p.x,y:p.y};
   },"EXTEND 完成。");
 }
 function offsetSelected(){
   validateCadFields();
   if(offsetInput.classList.contains("aigError")){msgEl.textContent="OFFSET 欄位有錯誤；只取消這次 OFFSET，CAD 繼續使用。";return}
   const d=aigFiniteNumber(offsetInput.value,0);
   const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return}
   let cp=clone(sh);cp.id=newId();
   if(sh.type==="line"){const dx=sh.b.x-sh.a.x,dy=sh.b.y-sh.a.y,len=Math.hypot(dx,dy)||1,n={x:-dy/len*d,y:dx/len*d};cp.a.x+=n.x;cp.a.y+=n.y;cp.b.x+=n.x;cp.b.y+=n.y}
   else if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")cp.r=Math.max(.001,sh.r+d);
   else if(sh.type==="rect"){const minX=Math.min(sh.a.x,sh.b.x)-d,maxX=Math.max(sh.a.x,sh.b.x)+d,minY=Math.min(sh.a.y,sh.b.y)-d,maxY=Math.max(sh.a.y,sh.b.y)+d;cp.a={x:minX,y:minY};cp.b={x:maxX,y:maxY}}
   else return;
   state.shapes.push(cp);state.selectedId=cp.id;pushHistory();msgEl.textContent="OFFSET "+d.toFixed(3)+" mm 完成。";
 }
 function arraySelected(){
   validateCadFields();
   if(arrayCountInput.classList.contains("aigError")||arraySpacingInput.classList.contains("aigError")){msgEl.textContent="ARRAY 欄位有錯誤；只取消這次 ARRAY。";return}
   const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return}
   const count=Math.max(2,Math.min(99,Math.trunc(aigFiniteNumber(arrayCountInput.value,3)))),spacing=aigFiniteNumber(arraySpacingInput.value,10);
   for(let i=1;i<count;i++)state.shapes.push(translateShape(sh,spacing*i,0));
   pushHistory();msgEl.textContent="ARRAY "+count+" 個，X 間距 "+spacing.toFixed(3)+" mm。";
 }
 function dimensionSelected(){
   validateCadFields();
   if(dimInput.classList.contains("aigError")){msgEl.textContent="DIM 欄位有錯誤；只取消這次尺寸修改。";return}
   const val=Math.max(.001,Number(dimInput.value)||.001);
   mutateSelected(sh=>{
     if(sh.type==="line"){const dx=sh.b.x-sh.a.x,dy=sh.b.y-sh.a.y,len=Math.hypot(dx,dy)||1;sh.b={x:sh.a.x+dx/len*val,y:sh.a.y+dy/len*val}}
     else if(sh.type==="circle"||sh.type==="hole")sh.r=val/2;
     else if(sh.type==="arc")sh.r=val;
     else if(sh.type==="rect"){const sign=sh.b.x>=sh.a.x?1:-1;sh.b.x=sh.a.x+sign*val}
   },"DIM 已套用 "+val.toFixed(3)+" mm。");
 }
 function fmt(v){const n=Number(v)||0;return n.toFixed(3).replace(/0+$/,"").replace(/\.$/,".") }
 function action(name){
   if(name==="UNDO"){if(state.historyIndex>0){state.historyIndex--;loadSnapshot(state.historyIndex)}return}
   if(name==="REDO"){if(state.historyIndex<state.history.length-1){state.historyIndex++;loadSnapshot(state.historyIndex)}return}
   if(name==="FIT"){fit();return}
   if(name==="SNAP"){state.snap=!state.snap;snapEl.textContent=state.snap?"SNAP ON":"SNAP OFF";root.querySelector('[data-cad-action="SNAP"]').classList.toggle("play",state.snap);draw();return}
   if(name==="TRIM"){trimSelected();return}
   if(name==="EXTEND"){extendSelected();return}
   if(name==="OFFSET"){offsetSelected();return}
   if(name==="ARRAY"){arraySelected();return}
   if(name==="DIM"){dimensionSelected();return}
   if(name==="CONNECT"){mutateSelected(sh=>{sh.connected=true},"CONNECT：只改拓樸狀態，不破壞幾何。");return}
   if(name==="DISCONNECT"){mutateSelected(sh=>{sh.connected=false},"DISCONNECT：幾何保留。");return}
   if(name==="DELETE"){
     const sh=currentSelected();if(!sh){msgEl.textContent="請先 Select 幾何。";return}
     const now=Date.now();
     if(now>state.deleteArmedUntil){state.deleteArmedUntil=now+2500;msgEl.textContent="DELETE 已待命：2.5 秒內再按一次才刪除 #"+sh.id+"。";return}
     state.deleteArmedUntil=0;state.shapes=state.shapes.filter(x=>x.id!==sh.id);state.selectedId=null;pushHistory();msgEl.textContent="已刪除選取幾何；可 Undo 還原。";return
   }
   if(name==="CLEAR"){
     if(!state.shapes.length)return;
     const now=Date.now();
     if(now>state.clearArmedUntil){state.clearArmedUntil=now+2500;msgEl.textContent="CLEAR 已待命：2.5 秒內再按一次才清空 CAD。";return}
     state.clearArmedUntil=0;state.shapes=[];state.selectedId=null;state.points=[];pushHistory();msgEl.textContent="CAD 畫布已清除；可 Undo 還原。";return
   }
 }

 function boundsOfShapes(){
   if(!state.shapes.length)return null;const pts=[];
   for(const sh of state.shapes){
     if(sh.type==="line"){pts.push(sh.a,sh.b)}
     else if(sh.type==="rect")pts.push(...rectCorners(sh));
     else if(sh.type==="circle"||sh.type==="hole"||sh.type==="arc")pts.push({x:sh.c.x-sh.r,y:sh.c.y-sh.r},{x:sh.c.x+sh.r,y:sh.c.y+sh.r});
   }
   return{minX:Math.min(...pts.map(p=>p.x)),maxX:Math.max(...pts.map(p=>p.x)),minY:Math.min(...pts.map(p=>p.y)),maxY:Math.max(...pts.map(p=>p.y))};
 }
 function fit(){
   const {w,h}=resize(),b=boundsOfShapes();if(!b){state.view={scale:4,panX:0,panY:0};draw();return}
   const ww=Math.max(1,b.maxX-b.minX),hh=Math.max(1,b.maxY-b.minY);
   state.view.scale=Math.max(.15,Math.min(60,Math.min((w-80)/ww,(h-80)/hh)));
   const cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2;state.view.panX=-cx*state.view.scale;state.view.panY=cy*state.view.scale;
   persist();draw();
 }
 function updateInfo(){
   countEl.textContent=state.shapes.length+" entities";
   const sh=currentSelected();
   selectedEl.textContent=sh?sh.type.toUpperCase()+" #"+sh.id:"無";
   topologyEl.textContent=sh?.connected?"CONNECTED":"DISCONNECTED";
 }
 function measureText(sh){
   if(sh.type==="line")return "L "+dist(sh.a,sh.b).toFixed(3);

 function validateToolpathFields(){

     for(const [label,v] of [["A0",p.aStart??0],["A1",p.aEnd??p.aStart??0],["B0",p.bStart??0],["B1",p.bEnd??p.bStart??0]])if(!Number.isFinite(Number(v)))errors.push("OP"+(i+1)+" "+label+" 非法");
   });

 function fmt(v){const n=Number(v)||0;return n.toFixed(3).replace(/0+$/,"").replace(/\.$/,".") }
 function rotaryAt(path,f,target){
   if(target==="3AX")return{A:0,B:0,text:""};
   const mode=path.rotMode==="SIMULTANEOUS"?"SIMULTANEOUS":"INDEXED";
   const a0=Number(path.aStart)||0,a1=mode==="SIMULTANEOUS"?(Number(path.aEnd)||0):a0;
   const b0=Number(path.bStart)||0,b1=mode==="SIMULTANEOUS"?(Number(path.bEnd)||0):b0;
   const A=a0+(a1-a0)*Math.max(0,Math.min(1,f)),B=b0+(b1-b0)*Math.max(0,Math.min(1,f));
   return{A,B,text:" A"+fmt(A)+(target==="5AX"?" B"+fmt(B):"")};
 }
 function generateFanucNC(){

   const invalidTap=enabledPaths.find(p=>p.kind==="tap"&&(!(Number(p.pitch)>0)||!(Number(p.rpm)>0)));
   if(invalidTap){msgEl.textContent="攻牙缺少有效螺距或轉速；此次不輸出 NC，其他功能仍可繼續使用。";statusEl.textContent="此次未輸出";return null}
   const simultaneousTap=enabledPaths.find(p=>p.kind==="tap"&&p.rotMode==="SIMULTANEOUS"&&(Math.abs(Number(p.aEnd||0)-Number(p.aStart||0))>1e-9||Math.abs(Number(p.bEnd||0)-Number(p.bStart||0))>1e-9));

   const rpm=Math.max(1,Math.trunc(aigFiniteNumber(rpmInput.value,12000))),defaultFeed=Math.max(1,Math.trunc(aigFiniteNumber(feedInput.value,1200))),defaultSafe=aigFiniteNumber(safeInput.value,5);

   for(const path of enabledPaths){
     if(!path.points?.length)continue;

     }
     push("G0 Z"+fmt(safe));

     if(path.kind==="drill"){
       const pt=path.points[0];
       push("G0 X"+fmt(pt.x)+" Y"+fmt(pt.y));
       push("G81 X"+fmt(pt.x)+" Y"+fmt(pt.y)+" Z"+fmt(depth)+" R"+fmt(Math.min(safe,3))+" F"+feed);
       push("G80");continue;
     }
     if(path.kind==="tap"){
       const pt=path.points[0],pitch=Number(path.pitch),tapRpm=Math.max(1,Math.trunc(Number(path.rpm)||rpm)),tapFeed=tapRpm*pitch;

       push("(AIG RAMP LOOP P"+rampPasses+" ANG"+Number(path.rampAngleDeg||0).toFixed(2)+" Z"+fmt(entryZ)+" TO Z"+fmt(depth)+")");

 function assemblySetupCheck(){
   const target=detail.querySelector("[data-assembly-check]");if(!target)return;
   const stock=readJson("aig-stock-v1",null),assembly=readJson("aig-assembly-v1",{version:1,items:[]});
   const payload=readJson("aig-cam-toolpath-v1",{}),pg=payload?.postGeometry||{},base=payload?.params||{};
   const wcs=readJson("aig-wcs-v1",{G54:{X:0,Y:0,Z:0},G55:{X:0,Y:0,Z:0}});
   const tools=readJson("aig-tool-table-v1",{T1:10,T4:6,T12:12,H1:0,H4:0,H12:0});
   const required=Math.max(0,Number(pg.clearance??2)||0),safeZ=Number(base.safeZ??5);
   const cfgBase={
     toolDia:Math.max(.1,Number(pg.toolDia??base.toolDia??tools.T1??10)||10),
     cutterLen:Math.max(1,Number(pg.cutterLen??30)||30),
     holderDia:Math.max(1,Number(pg.holderDia??25)||25),
     holderLen:Math.max(1,Number(pg.holderLen??25)||25),
     safeZ:Number.isFinite(safeZ)?safeZ:5,g73Retract:.5,stock,assembly,
     toolDiameters:toolDiametersFromTable(tools),
     offsets:wcs,
     toolLengths:{1:Number(tools.H1||0),4:Number(tools.H4||0),12:Number(tools.H12||0)}
   };
   const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
   const fixtureLabel=id=>{if(!id)return"";const item=(Array.isArray(assembly?.items)?assembly.items:[]).find(x=>String(x?.id)===String(id));return item?(String(item.name||item.type||"夾治具")+" #"+String(id)):("夾治具 #"+String(id))};
   const rows=[];
   for(const axis of ["3AX","4AX","5AX"]){
     const code=aigStorageGet(root,"aig-code-"+axis,null,axis+" G-code");
     if(!code){rows.push({axis,state:"NO NC",detail:"尚未產生 "+axis+" NC。",tone:"warn"});continue}
     const parsed=parseProgram(code,axis,cfgBase);
     if(parsed.errors.length){rows.push({axis,state:"PARSER",detail:parsed.errors.slice(0,2).join("；"),tone:"error"});continue}
     const scan=scanRuntimeCollisions(parsed,axis,cfgBase),clear=evaluateSetupClearance(parsed,axis,cfgBase);
     if(scan.collisions.length){
       const hit=scan.collisions[0];
       rows.push({axis,state:"COLLISION",detail:"第 "+(hit.line+1)+" 行 "+hit.message+" ["+hit.type+"]"+(hit.fixtureId?("；"+fixtureLabel(hit.fixtureId)):"")+(hit.toolNo?("；T"+hit.toolNo+" Ø"+Number(hit.toolDia||0).toFixed(3)):""),tone:"error",line:hit.line,fixtureId:hit.fixtureId||null});continue
     }
     const min=Number(clear.minimum),minText=Number.isFinite(min)?min.toFixed(3):"∞";
     if(min<required){
       rows.push({axis,state:"CLEARANCE",detail:minText+" mm < 要求 "+required.toFixed(3)+" mm；限制 "+String(clear.limitingType||"UNKNOWN")+(clear.line>=0?"；第 "+(clear.line+1)+" 行":"")+(clear.fixtureId?("；"+fixtureLabel(clear.fixtureId)):"")+(clear.toolNo?("；T"+clear.toolNo+" Ø"+Number(clear.toolDia||0).toFixed(3)):""),tone:"error",line:clear.line,fixtureId:clear.fixtureId||null});continue
     }
     rows.push({axis,state:"PASS",detail:"最小間隙 "+minText+" mm；要求 ≥ "+required.toFixed(3)+" mm；限制 "+String(clear.limitingType||"NONE"),tone:"pass"});
   }
   target.innerHTML=rows.map(r=>'<div class="field"><b>'+esc(r.axis)+' Setup</b><span style="color:'+(r.tone==="pass"?"#33f39b":r.tone==="error"?"#ff465f":"#ffb326")+'">'+esc(r.state)+'</span><small>'+esc(r.detail)+'</small>'+(Number.isInteger(r.line)&&r.line>=0?'<button class="btn warn" data-setup-jump-axis="'+esc(r.axis)+'" data-setup-jump-line="'+r.line+'">跳到第 '+(r.line+1)+' 行</button>':'')+(r.fixtureId?'<button class="btn warn" data-setup-jump-fixture="'+esc(r.fixtureId)+'">定位夾具</button>':'')+'</div>').join("");
   const fail=rows.filter(r=>r.tone==="error").length,missing=rows.filter(r=>r.state==="NO NC").length;
   const msg=detail.querySelector("[data-menu-msg]");
   if(msg)msg.textContent=fail?("Setup 檢查完成："+fail+" 軸需修正；只顯示問題，不停止 AIG。"):missing?("Setup 檢查完成；"+missing+" 軸尚無 NC，其餘已檢查。"):"3AX / 4AX / 5AX Setup 檢查全部 PASS。";
 }
 function assemblyView(){
   const stock=readJson("aig-stock-v1",null),assembly=readJson("aig-assembly-v1",{version:1,items:[]}),items=Array.isArray(assembly?.items)?assembly.items:[];
   const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
   const types=[["VISE_JAW","虎鉗顎"],["CLAMP","壓板"],["PARALLEL","墊塊"],["FIXTURE","夾治具"]];
   const options=selected=>types.map(([v,n])=>'<option value="'+v+'" '+(v===selected?'selected':'')+'>'+n+'</option>').join("");
   const sx=stock&&Number.isFinite(Number(stock.minX))&&Number.isFinite(Number(stock.maxX))?Number(stock.maxX)-Number(stock.minX):0;
   const sy=stock&&Number.isFinite(Number(stock.minY))&&Number.isFinite(Number(stock.maxY))?Number(stock.maxY)-Number(stock.minY):0;
   const cx=stock&&sx>0?(Number(stock.minX)+Number(stock.maxX))/2:0,cy=stock&&sy>0?(Number(stock.minY)+Number(stock.maxY))/2:0;
   const bottom=Number.isFinite(Number(stock?.bottom))?Number(stock.bottom):-20;
   const clearanceCfg=readJson("aig-cam-toolpath-v1",{}),requiredClearance=Math.max(0,Number(clearanceCfg?.postGeometry?.clearance??2)||0);
   const fixtureBoxes=runtimeAssemblyBoxes({assembly}),highestFixture=fixtureBoxes.length?Math.max(...fixtureBoxes.map(f=>f.maxZ)):-Infinity;
   const stockTop=Number.isFinite(Number(stock?.top))?Number(stock.top):0,staticHighest=Math.max(stockTop,highestFixture);
   const staticSafeZ=Number.isFinite(staticHighest)?staticHighest+requiredClearance:null;
   const stockInfo=stock&&sx>0&&sy>0
     ?("X "+Number(stock.minX).toFixed(3)+" ~ "+Number(stock.maxX).toFixed(3)+" / Y "+Number(stock.minY).toFixed(3)+" ~ "+Number(stock.maxY).toFixed(3)+" / Z "+Number(stock.bottom).toFixed(3)+" ~ "+Number(stock.top).toFixed(3))
     :"尚未建立 CAM 毛坯；可先手動建立夾治具，或到 CAM 套用毛坯。";
   const rows=items.map(item=>{
     const id=esc(item.id),enabled=item.enabled!==false;
     return '<div class="field" data-assembly-row="'+id+'" style="display:grid;gap:6px">'+
       '<b>'+esc(item.name||item.type||"夾治具")+' #'+id+(enabled?'':'（隱藏）')+'</b>'+
       '<div class="menuDetailGrid">'+
       '<label class="field"><b>類型</b><select data-assembly-field="type">'+options(String(item.type||"FIXTURE"))+'</select></label>'+
       '<label class="field"><b>名稱</b><input data-assembly-field="name" maxlength="40" value="'+esc(item.name||"夾治具")+'"></label>'+
       '<label class="field"><b>X 中心</b><input data-assembly-field="x" type="number" step="0.001" value="'+Number(item.x||0)+'"></label>'+
       '<label class="field"><b>Y 中心</b><input data-assembly-field="y" type="number" step="0.001" value="'+Number(item.y||0)+'"></label>'+
       '<label class="field"><b>Z 底面</b><input data-assembly-field="z" type="number" step="0.001" value="'+Number(item.z||0)+'"></label>'+
       '<label class="field"><b>X 寬</b><input data-assembly-field="w" type="number" min="0.001" step="0.001" value="'+Number(item.w||1)+'"></label>'+
       '<label class="field"><b>Y 深</b><input data-assembly-field="d" type="number" min="0.001" step="0.001" value="'+Number(item.d||1)+'"></label>'+
       '<label class="field"><b>Z 高</b><input data-assembly-field="h" type="number" min="0.001" step="0.001" value="'+Number(item.h||1)+'"></label>'+
       '</div><div class="controls"><button class="btn play" data-menu-action="ASSEMBLY_SAVE_ITEM" data-id="'+id+'">儲存模組</button><button class="btn" data-menu-action="ASSEMBLY_TOGGLE_ITEM" data-id="'+id+'">'+(enabled?'隱藏':'顯示')+'</button><button class="btn danger" data-menu-action="ASSEMBLY_DELETE_ITEM" data-id="'+id+'">刪除</button></div></div>';
   }).join("");
   detail.innerHTML=
     '<div class="notice"><b>目前毛坯：</b>'+esc(stockInfo)+'<br><b>3AX 靜態 Safe-Z 建議：</b>'+(Number.isFinite(staticSafeZ)?staticSafeZ.toFixed(3)+" mm":"—")+'（最高障礙 '+(Number.isFinite(staticHighest)?staticHighest.toFixed(3):"—")+' + 間隙 '+requiredClearance.toFixed(3)+'）<br>4AX/5AX 不用這個靜態值冒充安全結果，仍以 A/B 旋轉後的完整路徑碰撞與 Clearance 為準。</div>'+
     '<div class="menuDetailGrid">'+
       '<label class="field"><b>新模組類型</b><select data-assembly-new="type">'+options("CLAMP")+'</select></label>'+
       '<label class="field"><b>名稱</b><input data-assembly-new="name" maxlength="40" value="壓板"></label>'+
       '<label class="field"><b>X 中心</b><input data-assembly-new="x" type="number" step="0.001" value="'+cx.toFixed(3)+'"></label>'+
       '<label class="field"><b>Y 中心</b><input data-assembly-new="y" type="number" step="0.001" value="'+cy.toFixed(3)+'"></label>'+
       '<label class="field"><b>Z 底面</b><input data-assembly-new="z" type="number" step="0.001" value="'+bottom.toFixed(3)+'"></label>'+
       '<label class="field"><b>X 寬</b><input data-assembly-new="w" type="number" min="0.001" step="0.001" value="'+Math.max(20,sx*.5||40).toFixed(3)+'"></label>'+
       '<label class="field"><b>Y 深</b><input data-assembly-new="d" type="number" min="0.001" step="0.001" value="12.000"></label>'+
       '<label class="field"><b>Z 高</b><input data-assembly-new="h" type="number" min="0.001" step="0.001" value="10.000"></label>'+
     '</div><div class="controls"><button class="btn play" data-menu-action="ASSEMBLY_ADD">新增模組</button><button class="btn" data-menu-action="ASSEMBLY_VISE">依毛坯建立虎鉗預設</button><button class="btn play" data-menu-action="ASSEMBLY_CHECK">3/4/5AX Setup 檢查</button></div>'+
     '<div class="menuDetailGrid" data-assembly-check><div class="field"><b>Setup 檢查</b><span>尚未執行</span><small>讀取目前 NC、毛坯、夾治具、刀具/刀柄與安全間隙。</small></div></div>'+
     '<div class="notice" data-menu-msg>模組尺寸錯誤只會顯示在欄位，不會讓 AIG 停止。</div>'+
     '<div style="display:grid;gap:8px;margin-top:8px">'+(rows||'<div class="notice">目前沒有夾治具模組。</div>')+'</div>';
 }

 function simple(text){detail.innerHTML='<div class="notice">'+text+'</div>'}
 function render(key){
   root.querySelectorAll("[data-menu-key]").forEach(x=>x.classList.toggle("active",x.dataset.menuKey===key));
   const names={PROJECT:"專案",FILE:"檔案",TOOLS:"刀具庫",WCS:"工作座標",ASSEMBLY:"工件組裝",AI:"AI 助手",MONITOR:"監控",SETTINGS:"設定",MAINT:"維修",SYNC:"同步",UPDATE:"更新",SYSTEM:"系統資訊",HELP:"說明"};title.textContent=names[key]||"功能中心";
   if(key==="PROJECT")projectView();
   else if(key==="FILE")fileView();
   else if(key==="TOOLS")toolsView();
   else if(key==="WCS")wcsView();
   else if(key==="ASSEMBLY")assemblyView();
   else if(key==="MONITOR")monitorView();
   else if(key==="SYSTEM")systemView();
   else if(key==="AI"){detail.innerHTML='<div class="notice"><b>AI 老師</b><br>'+aigAiTeacherText()+'</div><div class="notice">AI 只做教學與跨模組說明，不代替 CAD / CAM / SIM / NC 自己的錯誤判斷。</div>';}
   else if(key==="SYNC")simple("同步目前維持 Offline-first。Shared Folder / LAN transport 尚未接到此 Web Prototype，因此不自動覆蓋其他裝置。");
   else if(key==="UPDATE")simple("此 Web Prototype 不執行網路自動更新；更新仍由版本分支、Gate 與驗證流程控制。");
   else if(key==="SETTINGS"){const on=aigTutorialMode(),d=aigDomainState();detail.innerHTML='<div class="menuDetailGrid"><div class="field"><b>錯誤分流</b><span>CAD / CAM / 3D-SIM / NC 各自處理各自錯誤。</span></div><div class="field"><b>AI 老師</b><span>'+aigAiTeacherText()+'</span></div><div class="field"><b>進階者模式</b><span>'+(d.advanced?'ON：顯示碰撞、干涉、3D 穩定性與完整追蹤':'OFF：一般操作保持精簡；執行 interlock 仍保留')+'</span></div></div><div class="controls"><button class="btn '+(d.cadCam?'selected':'')+'" data-link-cadcam>CAD ↔ CAM：'+(d.cadCam?'CONNECT':'DISCONNECT')+'</button><button class="btn '+(d.camSim?'selected':'')+'" data-link-camsim>CAM ↔ SIM：'+(d.camSim?'CONNECT':'DISCONNECT')+'</button><button class="btn '+(d.simNc?'selected':'')+'" data-link-simnc>SIM ↔ NC：'+(d.simNc?'CONNECT':'DISCONNECT')+'</button><button class="btn '+(d.advanced?'selected':'')+'" data-advanced-mode>進階者模式：'+(d.advanced?'ON':'OFF')+'</button><button class="btn" data-guidance-tutorial-toggle>教學模式：'+(on?'ON':'OFF')+'</button></div><div class="notice">CONNECT / DISCONNECT 是狀態，不是錯誤；斷開後各模組仍可獨立編輯。</div>';}
   else if(key==="MAINT")detail.innerHTML='<div class="notice">維修只處理 Web Prototype 暫存，不碰系統防毒或裝置安全。</div><button class="btn" data-menu-action="SELF_CHECK">Runtime 自我檢查</button><button class="btn danger" data-menu-action="CLEAR_DERIVED">清除 CAM/NC 衍生暫存</button><div class="notice" data-menu-msg></div>';
   else if(key==="HELP")simple("流程：CAD 製圖 → CAM 選策略 → 套用至刀路 → 刀路編輯/驗證 → 產生 NC → 3AX/4AX/5AX 模擬與 G-code 編輯。");
   setTimeout(()=>aigValidateAllFields(detail),0);
 }

   const card=e.target.closest("[data-menu-key]");if(card){render(card.dataset.menuKey);return}
   const tutorialToggle=e.target.closest("[data-guidance-tutorial-toggle]");if(tutorialToggle){const enabled=aigSetTutorialMode(!aigTutorialMode());render("SETTINGS");aigShowGuidance(root,{title:"AI 訊息導覽",where:"設定 / 教學模式",reason:"教學模式已切換。",suggested:enabled?"ON：顯示原因、建議值與影響":"OFF：只保留精簡導覽",impact:"只改說明密度，不會自動修改加工設定。"});return}
   const cadCam=e.target.closest("[data-link-cadcam]");if(cadCam){const d=aigDomainState();d.cadCam=!d.cadCam;aigSaveDomainState(d);render("SETTINGS");return}
   const camSim=e.target.closest("[data-link-camsim]");if(camSim){const d=aigDomainState();d.camSim=!d.camSim;aigSaveDomainState(d);render("SETTINGS");return}
   const simNc=e.target.closest("[data-link-simnc]");if(simNc){const d=aigDomainState();d.simNc=!d.simNc;aigSaveDomainState(d);render("SETTINGS");return}
   const advanced=e.target.closest("[data-advanced-mode]");if(advanced){const d=aigDomainState();d.advanced=!d.advanced;aigSaveDomainState(d);aigApplyAdvancedVisibility();render("SETTINGS");return}
   const setupJump=e.target.closest("[data-setup-jump-axis]");
   if(setupJump){
     const axis=setupJump.dataset.setupJumpAxis,line=Math.max(0,Math.trunc(Number(setupJump.dataset.setupJumpLine)||0));
     show(axis);
     setTimeout(()=>aigGuard(document.querySelector('.screen[data-page="'+axis+'"]')||document.body,axis+" 問題定位",()=>runtimes[axis]?.focusSourceLine?.(line),null,"warn"),40);
     return;
   }
   const setupFixture=e.target.closest("[data-setup-jump-fixture]");
   if(setupFixture){
     const id=String(setupFixture.dataset.setupJumpFixture||"");
