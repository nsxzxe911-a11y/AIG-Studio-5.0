<!doctype html>
<html lang="zh-Hant" data-aig-project="AIGII">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020407">
<meta name="color-scheme" content="dark">
<title>AIG-II • RGB Glass 正式工作區</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#020407;color:#ecf9ff;font-family:"Noto Sans TC",system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#17427e66,transparent 65%),#020407}
section{width:min(460px,100%);padding:40px 26px;text-align:center;background:linear-gradient(145deg,#0a1f34,#030810);border:1px solid #46b7e9;border-radius:20px;box-shadow:0 0 30px #287cff55}
h1{font-size:clamp(36px,9vw,62px);letter-spacing:.08em;margin:0 0 8px;color:#eafaff;text-shadow:0 0 17px #2488ff88}
p{margin:0 0 25px;color:#b4d4ed}
a{display:block;color:white;text-decoration:none;padding:13px;border:1px solid #6bdfff;border-radius:11px;background:linear-gradient(110deg,#1461a7,#492399);font-weight:750}
a:focus-visible{outline:2px solid #ffc45e;outline-offset:3px}
</style>
</head>
<body>
<main><section>
<h1>AIG-II</h1>
<p>AI GENERATIVE CNC · RGB GLASS</p>
<a id="enter-runtime" href="./mobile-runtime.html#HOME">進入正式工作區</a>
<noscript><p>啟用 JavaScript 可進入 CAD / CAM / SIM / NC 工作區。</p></noscript>
</section></main>
<script>
(function(){
 "use strict";
 const valid=new Set(["HOME","CAD","CAM","SIM","3AX","4AX","5AX","6AX","NC","AI"]);
 let key="HOME";
 try{const requested=decodeURIComponent(location.hash.replace(/^#/,"")).toUpperCase();if(valid.has(requested))key=requested}catch(_){}
 const dest=new URL("./mobile-runtime.html",location.href);
 dest.hash=key;
 const anchor=document.getElementById("enter-runtime");
 anchor.href=dest.href;
 location.replace(dest.href);
})();
</script>
</body>
</html>
