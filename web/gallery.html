<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020407;color:#effaff;font:15px system-ui,"Noto Sans TC",sans-serif}header{position:sticky;top:0;z-index:5;background:#03070bee;padding:14px clamp(12px,4vw,36px);border-bottom:1px solid #236078;display:flex;gap:15px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(12px)}h1{font-size:21px;margin:0}header a{margin-left:auto;text-decoration:none;color:#9ceeff;border:1px solid #326a88;border-radius:9px;padding:9px 14px}main{max-width:1600px;margin:auto;padding:clamp(12px,3vw,28px)}.hint{color:#bacbd4;line-height:1.7;background:#07111b;border:1px solid #234153;border-radius:12px;padding:13px 15px;margin:0 0 14px}.filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0}.filter{min-height:40px;border:1px solid #306077;background:#07111b;border-radius:9px;padding:8px 13px;color:#d9f7ff;cursor:pointer}.filter.active{border-color:#4fe1ff;box-shadow:0 0 13px #25c9ee35}input{background:#0b1924;border:1px solid #336980;border-radius:9px;min-height:40px;padding:8px;color:#fff;min-width:170px;flex:1;max-width:360px}#count{color:#a6c6d4;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:15px}.card{min-width:0;border:1px solid #24485e;border-radius:13px;overflow:hidden;background:#07111b;text-decoration:none;color:inherit}.card:focus-visible,.card:hover{outline:2px solid #38deff}.thumb{height:230px;display:grid;place-items:center;background:#010204}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.card.icon .thumb{height:120px}.card.icon img{max-width:75px;max-height:75px;image-rendering:auto}.meta{display:grid;gap:6px;padding:12px}.meta b{color:#48dbfa}.meta small{color:#94aebc}.empty{padding:40px;color:#aac6d4;text-align:center}footer{padding:24px;color:#809cad;text-align:center}@media(min-width:1600px){.thumb{height:290px}}</style></head>
<body><header><h1>AIG II • RGB 圖片分類</h1><a href="./">返回可操作 Runtime</a></header>
<main><p class="hint">圖片與 Runtime 核心分離：已確認的 2 張核准 HOME（手機與電腦分開）、9 張頁面／機台參考，以及 32 張已入庫 RGB 按鈕圖示。參考圖不是完整 Runtime Authority，按鈕圖示也不是可點擊邏輯。缺少的 6AX、AI、NC 整頁核准圖不以其他頁冒充。HOME 427 現有原圖解析度低於最終高解析度目標，需後續以核准修正版替換。</p>
<div class="filters"><button class="filter active" data-filter="全部">全部</button><button class="filter" data-filter="官方 HOME">官方 HOME</button><button class="filter" data-filter="頁面／機台參考">頁面／機台參考</button><button class="filter" data-filter="按鈕圖示">按鈕圖示</button><input id="search" aria-label="搜尋圖片" placeholder="搜尋 HOME / CAD / 5AX / icon"><span id="count"></span></div>
<div class="grid" id="images"></div><div class="empty" id="empty" hidden>沒有符合的圖片。</div>
</main><footer>AIG-II RGB • Verified source list • Mobile / Desktop Authority separate</footer>

const grid=document.getElementById("images"),empty=document.getElementById("empty"),count=document.getElementById("count"),search=document.getElementById("search");let filter="全部";
function render(){const q=search.value.trim().toLowerCase(),items=entries.filter(e=>(filter==="全部"||e.type===filter)&&(!q||(e.label+" "+e.type+" "+e.src).toLowerCase().includes(q)));grid.replaceChildren();for(const e of items){const a=document.createElement("a");a.className="card"+(e.kind==="icon"?" icon":"");a.href=e.url;a.target="_blank";a.rel="noopener";const thumb=document.createElement("div");thumb.className="thumb";const img=document.createElement("img");img.loading="lazy";img.src=e.url;img.alt=e.label;thumb.appendChild(img);const meta=document.createElement("div");meta.className="meta";const label=document.createElement("b");label.textContent=e.label;const source=document.createElement("small");source.textContent=e.type+" • "+e.src;meta.append(label,source);a.append(thumb,meta);grid.appendChild(a)}count.textContent=items.length+" / "+entries.length+" 張";empty.hidden=items.length>0}
