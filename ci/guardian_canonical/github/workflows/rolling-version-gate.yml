name: Studio Rolling Version Gate

on:
  push:
    branches: [main]
    paths:
      - 'release-version.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify version only moves forward
        run: python3 ci/verify_rolling_version.py
