services:
  - type: web
    name: aig-remote-bridge
    runtime: python
    plan: free
    region: singapore
    branch: infra/aig-remote-bridge-20261015
    buildCommand: pip install -r infra/aig-remote-bridge/requirements.txt
    startCommand: uvicorn --app-dir infra/aig-remote-bridge app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aig-remote-command-db
          property: connectionString
      - key: AIG_CONTROLLER_TOKEN
        generateValue: true
      - key: AIG_AGENT_TOKEN
        generateValue: true

databases:
  - name: aig-remote-command-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
