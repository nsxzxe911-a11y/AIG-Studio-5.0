name: AIG Real3D 3.14 Triangle Collision and Heroine Appearance Gate
on:
  push:
    branches:
      - verify/real3d-unified-appearance-3-5-20261023
    paths:
      - 'formal-web/school-3d/fastmodel/single-photo/aig-unified-appearance-3-5.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-unified-120-core-3-6.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-character-asset-index-3-8.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-runtime-stability-3-9.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-modular-hair-3-10.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-contact-constraints-3-11.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-secondary-motion-3-12.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-classmate-crowd-3-13.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-triangle-contact-3-14.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-triangle-contact-3-14.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-classmates-crowd-3-13-ui.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-classmate-crowd-3-13.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-secondary-motion-3-12.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-contact-constraints-3-11.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-modular-hair-3-10.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-19200-logical-kernel-3-10.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-garment-pose-follow-3-9.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-garment-pose-follow-3-9.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-runtime-stability-3-9.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-modular-outfits-3-7.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-large-wardrobe-3-8.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-unified-120-core-3-6.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-continuous-surface-scan-2-9-ui.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/scene-runtime-studio.html'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-unified-appearance-3-5.test.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-unified-appearance-3-5.real-browser.mjs'
      - '.github/workflows/aig-real3d-3-5-unified-appearance-gate.yml'
  pull_request:
    branches:
      - verify/real3d-true-world-movie-2-5-20261023
  workflow_dispatch:
jobs:
  same-photo-multi-method-one-geometry:
    name: Source RGB and human-mask to unified watertight 3D + appearance bounds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Strict source geometry, screenshot-safe and no misleading 100 percent gate
        run: |
          node --check aig-unified-appearance-3-5.mjs
          node --check aig-unified-120-core-3-6.mjs
          node --check aig-character-asset-index-3-8.mjs
          node --check aig-runtime-stability-3-9.mjs
          node --check aig-modular-hair-3-10.mjs
          node --check aig-contact-constraints-3-11.mjs
          node --check aig-secondary-motion-3-12.mjs
          node --check aig-classmate-crowd-3-13.mjs
          node --check aig-triangle-contact-3-14.mjs
          node --test tests/aig-triangle-contact-3-14.test.mjs
          node --check aig-classmates-crowd-3-13-ui.mjs
          node --test tests/aig-classmate-crowd-3-13.test.mjs
          node --test tests/aig-secondary-motion-3-12.test.mjs
          node --test tests/aig-contact-constraints-3-11.test.mjs
          node --test tests/aig-modular-hair-3-10.test.mjs
          node --test tests/aig-19200-logical-kernel-3-10.test.mjs
          node --check aig-garment-pose-follow-3-9.mjs
          node --test tests/aig-garment-pose-follow-3-9.test.mjs
          node --test tests/aig-runtime-stability-3-9.test.mjs
          node --check aig-modular-outfits-3-7.mjs
          node --test tests/aig-large-wardrobe-3-8.test.mjs
          node --test tests/aig-unified-120-core-3-6.test.mjs
          node --check aig-continuous-surface-scan-2-9-ui.mjs
          node --check scene-runtime-studio.mjs
          node --test tests/aig-unified-appearance-3-5.test.mjs
          node --test tests/aig-fused-manifold-surface-3-0.test.mjs
          node --test tests/aig-photo-digit-silhouette-3-4.test.mjs
      - name: Bundle actual formal renderer, no second render context
        run: |
          npm run build
          test -s dist/scene-runtime-studio.js
          test -s dist/scene-runtime-studio.html
          node --check dist/scene-runtime-studio.js
          grep -q 'aig35-width' dist/scene-runtime-studio.html
          grep -q 'aig35-colour' dist/scene-runtime-studio.html
          grep -q 'scan36-light' dist/scene-runtime-studio.html
          grep -q 'scan36-source-preview' dist/scene-runtime-studio.html
          grep -q 'scan37-slot-count' dist/scene-runtime-studio.html
          grep -q 'value="19200" selected' dist/scene-runtime-studio.html
          grep -q 'scan310-hair' dist/scene-runtime-studio.html
          grep -q 'scan38-asset-manager' dist/scene-runtime-studio.html
          grep -q 'AIG_REAL3D_3_5_UNIFIED_SOURCE_APPEARANCE_GATE' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_7_ONE_KERNEL_SCALABLE_LOGICAL_SHARDS' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_8_LAZY_CHARACTER_ASSET_INDEX' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_9_SINGLE_KERNEL_STABILITY' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_9_ATTACHED_GARMENT_VERTEX_MOTION' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_10_REMOVABLE_SOURCE_ANCHORED_HAIR' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_11_REAL_POSE_CONTACT_PROXY' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_12_FIXED_STEP_SECONDARY_HAIR_SKIRT' dist/scene-runtime-studio.js
          grep -q 'scan313-count' dist/scene-runtime-studio.html
          grep -q 'scan313-bench' dist/scene-runtime-studio.html
          grep -q 'AIG_REAL3D_3_13_SOURCED_CLASSMATES_AND_CROWD_BENCH' dist/scene-runtime-studio.js
          grep -q 'AIG_REAL3D_3_14_SOURCE_BODY_TRIANGLE_CONTACT' dist/scene-runtime-studio.js
          grep -q 'REAL3D_19200_LOGICAL_WORK_SLOTS' dist/scene-runtime-studio.js
      - name: Install Chromium QA for actual phone/desktop rendered geometry
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real shared WebGL screenshots and 3.5 shape, colour, proportion callbacks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig35-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-unified-appearance-3-5.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Real3D-3-5-SourceXY-Phone-Desktop-Appearance
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-3-5-unified-appearance/
          if-no-files-found: warn
