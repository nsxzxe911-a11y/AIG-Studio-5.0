name: Real3D Geometry-First Neutral Rendering Diagnostics
on:
  push:
    branches:
      - verify/real3d-neutral-render-inspection-20261024
    paths:
      - 'formal-web/shared-3d/aig-real3d-webgl.mjs'
      - 'formal-web/shared-3d/aig-real3d-render-inspection*'
      - 'formal-web/shared-3d/aig-real3d-human-brown-render-lab*'
      - 'formal-web/shared-3d/aig-real3d-source-review-gate.mjs'
      - 'formal-web/shared-3d/aig-real3d-reference-silhouette*.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-reference-silhouette.test.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-source-review-gate.test.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-brown-obj-source.real-browser.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-human-brown-render.real-browser.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-render-inspection*'
      - 'formal-web/shared-3d/tests/aig-real3d-human-brown-render-contract.test.mjs'
      - 'formal-web/shared-3d/authority/aig-real3d-human-brown-render-v1.json'
      - 'docs/REAL3D-HUMAN-BROWN-RENDER-V1-FORMAL-20261024.md'
      - '.github/workflows/aig-real3d-neutral-render-inspection-gate.yml'
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-webgl.mjs'
      - 'formal-web/shared-3d/aig-real3d-render-inspection*'
      - 'formal-web/shared-3d/aig-real3d-human-brown-render-lab*'
      - 'formal-web/shared-3d/aig-real3d-reference-silhouette*.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-reference-silhouette.test.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-brown-obj-source.real-browser.mjs'
      - 'formal-web/shared-3d/tests/aig-real3d-render-inspection*'
      - '.github/workflows/aig-real3d-neutral-render-inspection-gate.yml'
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and neutral geometry diagnostics
        run: |
          node --check formal-web/shared-3d/aig-real3d-webgl.mjs
          node --check formal-web/shared-3d/aig-real3d-render-inspection.mjs
          node --check formal-web/shared-3d/aig-real3d-render-inspection-lab.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-render-inspection.real-browser.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-human-brown-render.real-browser.mjs
          node --check formal-web/shared-3d/aig-real3d-human-brown-render-lab.mjs
          node --check formal-web/shared-3d/aig-real3d-source-review-gate.mjs
          node --check formal-web/shared-3d/aig-real3d-reference-silhouette.mjs
          node --check formal-web/shared-3d/aig-real3d-reference-silhouette-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-reference-silhouette.test.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-brown-obj-source.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-source-review-gate.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-render-inspection.test.mjs formal-web/shared-3d/tests/aig-real3d-human-brown-render-contract.test.mjs
          test -s docs/REAL3D-HUMAN-BROWN-RENDER-V1-FORMAL-20261024.md
          grep -q "setInspectionMode" formal-web/shared-3d/aig-real3d-webgl.mjs
          grep -q "postProcessBloomApplied:false" formal-web/shared-3d/aig-real3d-render-inspection.mjs
          test -s formal-web/aig-new-home.html
          test -s formal-web/fastmodel/cinema-engine/index.html
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real GPU browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate 7 real GPU images from one nonhuman GLB
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/real3d-neutral.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-render-inspection-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-render-inspection.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-human-brown-render.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-brown-obj-source.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-Neutral-Silhouette-Lighting-7-GPU-Frames-NONHUMAN-QA
          path: |
            artifacts/aig-real3d-neutral-geometry-frame/
            artifacts/aig-real3d-brown-4pass-real-gpu/
            artifacts/aig-real3d-brown-source-obj-review/
          if-no-files-found: warn
