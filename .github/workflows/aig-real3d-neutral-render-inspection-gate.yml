  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real GPU browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate 7 real GPU images from one nonhuman GLB
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/real3d-neutral.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-render-inspection-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-render-inspection.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-human-brown-render.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-brown-obj-source.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-dense-source.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-Neutral-Silhouette-Lighting-7-GPU-Frames-NONHUMAN-QA
          path: |
            artifacts/aig-real3d-neutral-geometry-frame/
            artifacts/aig-real3d-brown-4pass-real-gpu/
            artifacts/aig-real3d-brown-source-obj-review/
            artifacts/aig-real3d-dense-original-source/
          if-no-files-found: warn
