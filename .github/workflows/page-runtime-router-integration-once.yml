name: AIG page runtime router integration once

on:
  push:
    branches:
      - architecture/page-autonomy-ai-orchestrator-after-588
    paths:
      - .github/page-runtime-router-integration.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: architecture/page-autonomy-ai-orchestrator-after-588
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Apply narrow runtime compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply_page_runtime_router_integration.py | tee router-patch.log
          python3 ci/finalize_page_runtime_router_patch.py | tee router-finalize.log
          python3 ci/apply_nc_first_air_feed_compatibility.py | tee nc-first-air-feed.log
          python3 ci/apply_nc_preview_action_evidence.py | tee nc-preview-evidence.log
          grep -Fq 'PAGE_RUNTIME_ROUTER_INTEGRATION_PATCH_PASS|' router-patch.log
          grep -Fq 'PAGE_RUNTIME_ROUTER_ANDROID_FINALIZE_PASS|' router-finalize.log
          grep -Fq 'NC_FIRST_AIR_FEED_COMPAT_PATCH_PASS|' nc-first-air-feed.log
          grep -Fq 'NC_PREVIEW_ACTION_EVIDENCE_PATCH_PASS|' nc-preview-evidence.log
          git diff --check
      - name: Verify shared page routing contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_page_department_manifests.py | tee page-manifests.log
          python3 ci/verify_cad_cam_page_runtimes.py | tee cad-cam-runtime.log
          python3 ci/verify_sim_axis_page_runtimes.py | tee sim-axis-runtime.log
          python3 ci/verify_nc_home_page_runtimes.py | tee nc-home-runtime.log
          python3 ci/verify_ai_machining_runtime.py | tee ai-machining-runtime.log
          python3 ci/verify_page_runtime_cross_platform.py | tee page-runtime-cross-platform.log
          grep -Fq 'PAGE_DEPARTMENT_MANIFEST_PASS|' page-manifests.log
          grep -Fq 'CAD_CAM_PAGE_RUNTIME_BINDING_PASS|' cad-cam-runtime.log
          grep -Fq 'SIM_AXIS_PAGE_RUNTIME_BINDING_PASS|' sim-axis-runtime.log
          grep -Fq 'NC_HOME_PAGE_RUNTIME_BINDING_PASS|' nc-home-runtime.log
          grep -Fq 'AI_MACHINING_RUNTIME_BINDING_PASS|' ai-machining-runtime.log
          grep -Fq 'PAGE_RUNTIME_CROSS_PLATFORM_PASS|' page-runtime-cross-platform.log
      - name: Compile and focused regression gate
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:testClasses :core:pageAutonomyRegression :app:assembleDebug :desktop:compileKotlin --stacktrace
      - name: Commit verified runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIG Router Integrator'
          git config user.email 'aig-router-integrator@users.noreply.github.com'
          git add app/src/main/java/com/aigstudio/app/MainActivity.kt \
                  desktop/src/main/kotlin/com/aigstudio/desktop/DesktopApp.kt \
                  web/index.html \
                  core/src/main/kotlin/com/aigstudio/core/NcFirstMotion.kt \
                  core/src/main/kotlin/com/aigstudio/core/NcPageRuntime.kt
          if git diff --cached --quiet; then
            echo 'PAGE_RUNTIME_ROUTER_ALREADY_INTEGRATED=PASS'
            exit 0
          fi
          git commit -m 'feat: wire autonomous page routers and structured NC runtime evidence'
          git push origin HEAD:architecture/page-autonomy-ai-orchestrator-after-588
          echo 'PAGE_RUNTIME_ROUTER_PLATFORM_COMMIT=PASS'
