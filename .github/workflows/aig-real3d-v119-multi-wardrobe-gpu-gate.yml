name: Real3D V119 Multiple Real Garment GLB Outfits, Actor SHA and 5AX GPU Gate
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v119-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v119-*'
      - 'docs/REAL3D-V119-*'
      - '.github/workflows/aig-real3d-v119-multi-wardrobe-gpu-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v119-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  garment-geometry-source-and-actor-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Distinct original garment mesh cuts, 2-12 outfits, stable actor and wrong-asset BLOCK
        run: |
          node --check formal-web/shared-3d/aig-real3d-v119-multi-wardrobe.mjs
          node --check formal-web/shared-3d/aig-real3d-v119-wardrobe-ui.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v119-multi-wardrobe.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v119-multi-wardrobe.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v118-local-neural.test.mjs
  actual-native-source-outfit-webgl:
    needs: garment-geometry-source-and-actor-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium and WebGL
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Import three independent PNG/GLB originals, switch two clothing cuts, V107 actual GPU A/B
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v119-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v119-wardrobe-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v119-multi-wardrobe.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-v118-local-neural.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V119-Genuine-Source-Outfit-Wardrobe-And-FiveAxis-GPU
          path: |
            artifacts/aig-real3d-v119/
            artifacts/aig-real3d-v118/
          if-no-files-found: warn
