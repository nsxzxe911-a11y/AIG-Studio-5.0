name: AIG Authority Image Cleanup Gate
on:
  push:
    branches:
      - cleanup/authority-asset-prune-20261020
      - web/aig-dual-formal-runtime-20261016
    paths:
      - 'formal-web/image-library.html'
      - 'formal-web/visual-library/**'
      - 'formal-web/qa/authority-prune-*.cjs'
      - '.github/workflows/authority-image-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node formal-web/qa/authority-prune-source.cjs
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory formal-web >/tmp/aig-authority-http.log 2>&1 &
          sleep 2
      - run: node formal-web/qa/authority-prune-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Authority-Only-S23-4K-Reference-Gallery
          path: artifacts/aig-authority-cleanup/
          if-no-files-found: warn
