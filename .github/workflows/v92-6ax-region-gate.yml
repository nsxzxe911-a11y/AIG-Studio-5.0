name: AIG V92 6AX Authority Reverse Mapping Runtime Gate
on:
  push:
    branches: [integration/v92-authority-6ax-reverse-map]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check formal-web/runtime/v92-6ax-authority-layout.js
      - run: node formal-web/qa/v92-6ax-region-static.cjs
      - run: python3 formal-web/zoo-6ax/validate-v93-glb.py
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory formal-web >/tmp/aig-v92-server.log 2>&1 &
          sleep 2
      - run: node formal-web/qa/v92-6ax-region-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-V92-Real-6AX-RGB-4K-S23-Authority-Region
          path: artifacts/v92/
          if-no-files-found: warn
