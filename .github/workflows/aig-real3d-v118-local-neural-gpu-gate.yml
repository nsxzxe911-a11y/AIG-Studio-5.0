name: Real3D V118 Actual Locally Trained Neural Weights and Five GPU Poses
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v118-*'
      - 'formal-web/shared-3d/aig-real3d-v109-photo-surface-ui.mjs'
      - 'formal-web/shared-3d/aig-real3d-v109-photo-surface-lab.html'
      - 'formal-web/shared-3d/tests/aig-real3d-v118-*'
      - 'docs/REAL3D-V118-*'
      - '.github/workflows/aig-real3d-v118-local-neural-gpu-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v118-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-neural-learning-and-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Actually train weights with Adam and verify SHA, mask, source data and rejection cases
        run: |
          node --check formal-web/shared-3d/aig-real3d-v118-local-neural.mjs
          node --check formal-web/shared-3d/aig-real3d-v109-photo-surface-ui.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v118-local-neural.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v118-local-neural.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v117-evidence-orchestrator.test.mjs
  real-neural-mask-glb-fiveaxis-browser:
    needs: actual-neural-learning-and-source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Original RGB canvas seed labels -> train true model -> true GLB -> V107 five WebGL frames
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v118-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v109-photo-surface-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v118-local-neural.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-v117-evidence-orchestrator.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V118-Actual-Learned-Local-Model-GLB-FiveAxis-Evidence
          path: |
            artifacts/aig-real3d-v118/
            artifacts/aig-real3d-v117/
          if-no-files-found: warn
