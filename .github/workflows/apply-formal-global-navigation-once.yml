name: Apply formal global navigation once

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015
    paths:
      - .github/workflows/apply-formal-global-navigation-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aig-dual-ai-web-update-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply formal global navigation
        shell: bash
        run: |
          set -euo pipefail
          python ci/apply_formal_global_navigation.py
          python ci/verify_aig_dual_ai_web_update.py
          python ci/verify_ui_button_manifest_consistency.py
          python ci/verify_axis_button_asset_contract.py
          python ci/verify_formal_global_navigation.py
          gradle :core:compileKotlin --no-daemon --console=plain
      - name: Commit formal global navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/kotlin/com/aigstudio/core/EnvironmentSettings.kt
          git add core/src/test/kotlin/com/aigstudio/core/CoreRegressionTest.kt
          git add app/src/main/java/com/aigstudio/app/MainActivity.kt
          git commit -m 'feat(ui): expose formal 3AX through 6AX global navigation' || true
          git push origin HEAD:feature/aig-dual-ai-web-update-20261015
