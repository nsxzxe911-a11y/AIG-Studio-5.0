name: AIG Studio 6AX V9 local GLB

on:
  workflow_dispatch:
  push:
    branches:
      - web/aig-dual-formal-runtime-20261016
    paths:
      - formal-web/zoo-6ax/generate-v9-glb.py
      - formal-web/zoo-6ax/upgrade-v91-glb.py
      - formal-web/zoo-6ax/validate-v9-glb.py
      - formal-web/zoo-6ax/validate-v91-glb.py
      - .github/workflows/aig-studio-v9-local-glb.yml

permissions:
  contents: write

jobs:
  build-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate base V9 GLB
        run: python3 formal-web/zoo-6ax/generate-v9-glb.py
      - name: Validate base V9 GLB
        run: python3 formal-web/zoo-6ax/validate-v9-glb.py
      - name: Apply Visual V9.1 professional proportion pass
        run: python3 formal-web/zoo-6ax/upgrade-v91-glb.py
      - name: Validate Visual V9.1 mechanical hierarchy
        run: python3 formal-web/zoo-6ax/validate-v91-glb.py
      - name: Write checksums
        run: |
          cd formal-web/zoo-6ax/local-glb
          sha256sum aig_6ax_machine_v9.glb aig_6ax_machine_v9.manifest.json > SHA256SUMS.txt
          printf 'AIG_V91_LOCAL_GLB_PASS\n' > BUILD_STATUS.txt
      - name: Commit V9.1 GLB to Studio branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formal-web/zoo-6ax/local-glb/aig_6ax_machine_v9.glb
          git add formal-web/zoo-6ax/local-glb/aig_6ax_machine_v9.manifest.json
          git add formal-web/zoo-6ax/local-glb/SHA256SUMS.txt
          git add formal-web/zoo-6ax/local-glb/BUILD_STATUS.txt
          git commit -m "asset(6ax): publish Visual V9.1 GLB" || exit 0
          git push origin HEAD:web/aig-dual-formal-runtime-20261016
