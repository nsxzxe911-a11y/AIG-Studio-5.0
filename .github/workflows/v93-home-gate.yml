name: AIG V93 RGB HOME Native Runtime Gate
on:
  push:
    branches: [integration/v93-home-rgb-runtime, web/aig-dual-formal-runtime-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check formal-web/runtime/v93-home-rgb-layout.js
      - run: node --check formal-web/runtime/v93-home-glb-viewer.js
      - run: node formal-web/qa/v93-home-static.cjs
      - run: python3 formal-web/zoo-6ax/validate-v93-glb.py
  visual:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory formal-web >/tmp/aig-v93-http.log 2>&1 &
          sleep 2
      - run: node formal-web/qa/v93-home-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-V93-HOME-RGB-4K-S23-NATIVE
          path: artifacts/v93/
          if-no-files-found: warn
