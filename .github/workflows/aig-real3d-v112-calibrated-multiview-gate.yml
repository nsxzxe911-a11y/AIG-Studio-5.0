name: Real3D V112 Two Real Calibrated Depth Sources GLB and 5AX GPU Gate
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v112-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v112-*'
      - 'docs/REAL3D-V112-*'
      - '.github/workflows/aig-real3d-v112-calibrated-multiview-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v112-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-calibrated-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check two source depth maps, shared world XYZ, landmark error, occlusion, no false 1to1
        run: |
          node --check formal-web/shared-3d/aig-real3d-v112-calibrated-multiview.mjs
          node --check formal-web/shared-3d/aig-real3d-v112-calibrated-multiview-ui.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v112-calibrated-multiview.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v112-calibrated-multiview.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v111-seeded-segmentation.test.mjs
  two-source-real-chromium-gpu:
    needs: actual-calibrated-geometry
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install real Chromium WebGL ANGLE SwiftShader
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real GLB two embedded source views and A/B GPU; reject wrong camera pose
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v112-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v112-calibrated-multiview-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v112-calibrated-multiview.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-v111-seeded-segmentation.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V112-Two-Observed-Depth-Sources-GLB-5AX-GPU
          path: |
            artifacts/aig-real3d-v112/
            artifacts/aig-real3d-v111/
          if-no-files-found: warn
