name: AIG School 3D Source Gate
on:
  pull_request:
    paths:
      - 'formal-web/school-3d/**'
      - '.github/workflows/school-3d-source-gate.yml'
  push:
    branches:
      - feature/aig-school-3d-hero-v1-20261020
    paths:
      - 'formal-web/school-3d/**'
      - '.github/workflows/school-3d-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax
        run: |
          node --check formal-web/school-3d/school-hero.v1.js
          node --check formal-web/school-3d/glb-audit.v1.mjs
          node --check formal-web/school-3d/material-lab.v1.js
      - name: Run fake-model rejection tests
        run: node --test formal-web/school-3d/tests/glb-audit.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'formal-web/school-3d/tools/material-requirements.txt'
      - name: Install material generator dependencies
        run: python -m pip install -r formal-web/school-3d/tools/material-requirements.txt
      - name: Test deterministic PBR maps
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_skin_materials.py' -v
      - name: Generate NON-APPROVED PBR candidate maps
        run: python formal-web/school-3d/tools/skin_materials.py --out artifacts/school-3d-prototype-pbr --size 512
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-PBR-Prototype-NOT-Authority
          path: artifacts/school-3d-prototype-pbr/
          retention-days: 14
          if-no-files-found: error
      - name: Build rigged humanoid GLB QA fixture (NOT APPROVED)
        run: |
          python formal-web/school-3d/tools/build_rig_prototype.py --source artifacts/school-3d-prototype-pbr --output artifacts/school-3d-rig-technical/hero-rig-CANDIDATE-NOT-APPROVED.glb
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-rig-technical/hero-rig-CANDIDATE-NOT-APPROVED.glb
      - name: Test deterministic rig + morph + skeletal clips
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_rig_prototype.py' -v
      - name: Upload explicit non-authority technical fixture
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Rig-CANDIDATE-NOT-APPROVED
          path: artifacts/school-3d-rig-technical/
          retention-days: 14
          if-no-files-found: error
      - name: Phase5 reconstruct smoother-skinned candidate (NOT APPROVED)
        run: |
          python formal-web/school-3d/tools/build_rig_phase5.py --source artifacts/school-3d-prototype-pbr --output artifacts/school-3d-rig-phase5/hero-rig-Phase5-NOT-APPROVED.glb
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-rig-phase5/hero-rig-Phase5-NOT-APPROVED.glb
      - name: Phase5 anatomically blended vertices and animation data Gate
        env:
          AIG_PHASE5_MATERIALS_DIR: artifacts/school-3d-prototype-pbr
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_phase5_rig.py' -v
      - name: Archive Phase5 technical candidate (NOT VISUAL AUTHORITY)
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Phase5-Skinned-Motion-NOT-APPROVED
          path: artifacts/school-3d-rig-phase5/
          retention-days: 14
          if-no-files-found: error
      - name: Phase6 build 2-bone IK contact GLB (NOT VISUAL AUTHORITY)
        run: |
          mkdir -p artifacts/school-3d-phase6-ik
          python formal-web/school-3d/tools/build_rig_phase6.py --source artifacts/school-3d-prototype-pbr --output artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb > artifacts/school-3d-phase6-ik/phase6-build-report.json
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb > artifacts/school-3d-phase6-ik/glb-structure-report.json
          python formal-web/school-3d/tools/verify_foot_contact_phase6.py artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb > artifacts/school-3d-phase6-ik/ik-stance-evidence.json
      - name: Test Phase6 deterministic rig and encoded ankle contact
        env:
          AIG_PHASE6_PBR_DIR: artifacts/school-3d-prototype-pbr
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_phase6_ik.py' -v
      - name: Upload only unapproved Phase6 technical GLB
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Phase6-IK-NOT-APPROVED
          path: artifacts/school-3d-phase6-ik/
          retention-days: 14
          if-no-files-found: error
      - name: Phase7 reverse identity reference QA (no fictional rear geometry)
        run: |
          python -m unittest discover -s formal-web/school-3d/tools -p 'test_reverse_authority.py' -v
          python -c "import json; m=json.load(open('formal-web/school-3d/reverse-authority.v1.json')); assert m['reverseGate']=='REFERENCE_EXTRACTED_ONLY_NOT_3D_MODEL'; assert not m['releasedToHomepage']; print('PHASE7 2D REFERENCE ONLY - 3D NOT APPROVED')"
      - name: Explicit release status
        run: |
          node -e "const m = require('./formal-web/school-3d/authority.v1.json'); if (m.deploymentState !== 'PREVIEW_ONLY_NOT_PRODUCTION') process.exit(1); console.log('SOURCE QA ONLY: real female rig/PBR/walk/poster 3D authority is NOT approved');"
