name: AIG School 3D Source Gate
on:
  pull_request:
    paths:
      - 'formal-web/school-3d/**'
      - '.github/workflows/school-3d-source-gate.yml'
  push:
    branches:
      - feature/aig-school-3d-hero-v1-20261020
    paths:
      - 'formal-web/school-3d/**'
      - '.github/workflows/school-3d-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax
        run: |
          node --check formal-web/school-3d/school-hero.v1.js
          node --check formal-web/school-3d/glb-audit.v1.mjs
          node --check formal-web/school-3d/material-lab.v1.js
      - name: Run fake-model rejection tests
        run: node --test formal-web/school-3d/tests/glb-audit.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'formal-web/school-3d/tools/material-requirements.txt'
      - name: Install material generator dependencies
        run: python -m pip install -r formal-web/school-3d/tools/material-requirements.txt
      - name: Test deterministic PBR maps
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_skin_materials.py' -v
      - name: Generate NON-APPROVED PBR candidate maps
        run: python formal-web/school-3d/tools/skin_materials.py --out artifacts/school-3d-prototype-pbr --size 512
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-PBR-Prototype-NOT-Authority
          path: artifacts/school-3d-prototype-pbr/
          retention-days: 14
          if-no-files-found: error
      - name: Build rigged humanoid GLB QA fixture (NOT APPROVED)
        run: |
          python formal-web/school-3d/tools/build_rig_prototype.py --source artifacts/school-3d-prototype-pbr --output artifacts/school-3d-rig-technical/hero-rig-CANDIDATE-NOT-APPROVED.glb
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-rig-technical/hero-rig-CANDIDATE-NOT-APPROVED.glb
      - name: Test deterministic rig + morph + skeletal clips
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_rig_prototype.py' -v
      - name: Upload explicit non-authority technical fixture
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Rig-CANDIDATE-NOT-APPROVED
          path: artifacts/school-3d-rig-technical/
          retention-days: 14
          if-no-files-found: error
      - name: Phase5 reconstruct smoother-skinned candidate (NOT APPROVED)
        run: |
          python formal-web/school-3d/tools/build_rig_phase5.py --source artifacts/school-3d-prototype-pbr --output artifacts/school-3d-rig-phase5/hero-rig-Phase5-NOT-APPROVED.glb
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-rig-phase5/hero-rig-Phase5-NOT-APPROVED.glb
      - name: Phase5 anatomically blended vertices and animation data Gate
        env:
          AIG_PHASE5_MATERIALS_DIR: artifacts/school-3d-prototype-pbr
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_phase5_rig.py' -v
      - name: Archive Phase5 technical candidate (NOT VISUAL AUTHORITY)
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Phase5-Skinned-Motion-NOT-APPROVED
          path: artifacts/school-3d-rig-phase5/
          retention-days: 14
          if-no-files-found: error
      - name: Phase6 build 2-bone IK contact GLB (NOT VISUAL AUTHORITY)
        run: |
          mkdir -p artifacts/school-3d-phase6-ik
          python formal-web/school-3d/tools/build_rig_phase6.py --source artifacts/school-3d-prototype-pbr --output artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb > artifacts/school-3d-phase6-ik/phase6-build-report.json
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb > artifacts/school-3d-phase6-ik/glb-structure-report.json
          python formal-web/school-3d/tools/verify_foot_contact_phase6.py artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb > artifacts/school-3d-phase6-ik/ik-stance-evidence.json
      - name: Test Phase6 deterministic rig and encoded ankle contact
        env:
          AIG_PHASE6_PBR_DIR: artifacts/school-3d-prototype-pbr
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_phase6_ik.py' -v
      - name: Upload only unapproved Phase6 technical GLB
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Phase6-IK-NOT-APPROVED
          path: artifacts/school-3d-phase6-ik/
          retention-days: 14
          if-no-files-found: error
      - name: Phase7 reverse identity reference QA (no fictional rear geometry)
        run: |
          python -m unittest discover -s formal-web/school-3d/tools -p 'test_reverse_authority.py' -v
          python -c "import json; m=json.load(open('formal-web/school-3d/reverse-authority.v1.json')); assert m['reverseGate']=='REFERENCE_EXTRACTED_ONLY_NOT_3D_MODEL'; assert not m['releasedToHomepage']; print('PHASE7 2D REFERENCE ONLY - 3D NOT APPROVED')"
      - name: Phase8 old skeleton sizing must not override Reverse Authority
        run: |
          python -m unittest discover -s formal-web/school-3d/tools -p 'test_reverse_rig_fit.py' -v
          python formal-web/school-3d/tools/normalize_rig_for_reverse.py --out artifacts/school-3d-proportion-handoff/rig-fit-NOT-APPROVED.json
      - name: Archive normalized bones, NEVER claim new character
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School3D-Phase8-Proportion-Handoff-NOT-APPROVED
          path: artifacts/school-3d-proportion-handoff/
          retention-days: 14
          if-no-files-found: error
      - name: Phase9 QA target mesh first, never force fit to old rig
        run: |
          mkdir -p artifacts/school-3d-phase9-meshfirst
          python formal-web/school-3d/tools/prepare_qa_mesh.py \
            --source artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb \
            --target artifacts/school-3d-phase9-meshfirst/target-TECHNICAL-NOT-APPROVED.glb \
            --landmarks artifacts/school-3d-phase9-meshfirst/3d-anchors-NOT-APPROVED.json
          python formal-web/school-3d/tools/fit_mesh_first_rig.py \
            --source artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb \
            --target artifacts/school-3d-phase9-meshfirst/target-TECHNICAL-NOT-APPROVED.glb \
            --anchors artifacts/school-3d-phase9-meshfirst/3d-anchors-NOT-APPROVED.json \
            --out artifacts/school-3d-phase9-meshfirst/meshfirst-rig-NOT-APPROVED.glb > artifacts/school-3d-phase9-meshfirst/fit-report.json
          python formal-web/school-3d/tools/verify_mesh_first.py \
            --target artifacts/school-3d-phase9-meshfirst/target-TECHNICAL-NOT-APPROVED.glb \
            --result artifacts/school-3d-phase9-meshfirst/meshfirst-rig-NOT-APPROVED.glb > artifacts/school-3d-phase9-meshfirst/mesh-first-matrix-qa.json
          python formal-web/school-3d/tools/verify_fit_foot_contact.py \
            artifacts/school-3d-phase9-meshfirst/meshfirst-rig-NOT-APPROVED.glb > artifacts/school-3d-phase9-meshfirst/foot-joint-only-qa.json
      - name: Phase9 11 independent fail-closed mesh-first tests
        env:
          AIG_PHASE9_SOURCE_GLB: artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_mesh_first.py' -v
      - name: Upload Phase9 rigging QA artifact, explicitly NOT Authority
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School3D-Phase9-MeshFirst-QA-NOT-APPROVED
          path: artifacts/school-3d-phase9-meshfirst/
          retention-days: 14
          if-no-files-found: error
      - name: Phase10 convert prior mesh to truly independent UNRIGGED QA GLB
        run: |
          mkdir -p artifacts/school-3d-phase10-independent
          python formal-web/school-3d/tools/make_unrigged_qa_fixture.py \
            --source artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb \
            --target artifacts/school-3d-phase10-independent/unrigged-import-NOT-APPROVED.glb \
            --anchors artifacts/school-3d-phase10-independent/joint-anchors-MANUAL-3D-TEST.json > artifacts/school-3d-phase10-independent/import-report.json
          python formal-web/school-3d/tools/bind_unrigged_mesh.py \
            --source artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb \
            --target artifacts/school-3d-phase10-independent/unrigged-import-NOT-APPROVED.glb \
            --anchors artifacts/school-3d-phase10-independent/joint-anchors-MANUAL-3D-TEST.json \
            --out artifacts/school-3d-phase10-independent/33joint-fitted-NOT-VISUAL-AUTHORITY.glb > artifacts/school-3d-phase10-independent/rebound-report.json
          python formal-web/school-3d/tools/verify_prototype.py artifacts/school-3d-phase10-independent/33joint-fitted-NOT-VISUAL-AUTHORITY.glb > artifacts/school-3d-phase10-independent/glb-technical-audit.json
          python formal-web/school-3d/tools/verify_fit_foot_contact.py artifacts/school-3d-phase10-independent/33joint-fitted-NOT-VISUAL-AUTHORITY.glb > artifacts/school-3d-phase10-independent/foot-joint-only-audit.json
      - name: Phase10 sixteen true unrigged GLB retarget tests
        env:
          AIG_PHASE10_SOURCE_GLB: artifacts/school-3d-phase6-ik/hero-rig-Phase6-TECHNICAL-ONLY.glb
        run: python -m unittest discover -s formal-web/school-3d/tools -p 'test_unrigged_mesh_binding.py' -v
      - name: Archive Phase10 unrigged rig adapter QA, NOT visual approval
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School3D-Phase10-Unrigged-Adapter-NOT-APPROVED
          path: artifacts/school-3d-phase10-independent/
          retention-days: 14
          if-no-files-found: error
      - name: Phase11 Reverse 2D to real GLB 3D projection regression tests
        run: |
          python -m unittest discover -s formal-web/school-3d/tools -p 'test_phase11_projection_gate.py' -v
          python -c "import json; r=json.load(open('formal-web/school-3d/PHASE11-VISUAL-EVIDENCE.json')); a=json.load(open('formal-web/school-3d/reverse-authority.v1.json')); assert r['referenceSHA256']==a['source']['sha256']; assert r['releaseAllowed'] is False and r['visualAuthorityPassed'] is False and r['isRealCalibratedCamera'] is False; assert len(r['pairs'])==8 and r['meanErrorPx']>0; print('GLB projection diagnostic only, not visual approval')"
      - name: Phase12 matchstick-slim skeleton cannot deform reverse mesh
        run: |
          node --check formal-web/school-3d/matchstick-rig.v1.js
          python -m unittest discover -s formal-web/school-3d/tools -p 'test_matchstick_rig.py' -v
          mkdir -p artifacts/school-3d-phase12-matchstick
          python formal-web/school-3d/tools/build_matchstick_spec.py \
            --reverse formal-web/school-3d/reverse-authority.v1.json \
            --out artifacts/school-3d-phase12-matchstick/matchstick-rig.v1.json
          python -c "import json; a=json.load(open('artifacts/school-3d-phase12-matchstick/matchstick-rig.v1.json')); b=json.load(open('formal-web/school-3d/matchstick-rig.v1.json')); assert a==b, 'matchstick rig source mismatch'; print('exact matching JSON fields - PASS')"
      - name: Archive Phase12 thin-bone contract only (NOT A CHARACTER)
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Phase12-Matchstick-REVERSE-QA-ONLY
          path: artifacts/school-3d-phase12-matchstick/
          retention-days: 14
          if-no-files-found: error
      - name: Phase13 ORIGINAL envelope source-code QA (synthetic image only)
        run: |
          node --check formal-web/school-3d/phase13/envelope-workbench.v1.js
          python -m unittest discover -s formal-web/school-3d/phase13/tools -p 'test_envelope_ci.py' -v
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('formal-web/school-3d/phase13')
          manifest=json.loads((a/'mesh-envelope.v1.json').read_text())
          html=(a/'envelope-workbench.v1.html').read_text()
          embedded=json.loads(re.search(r'<script id="spec" type="application/json">\s*(.*?)\s*</script>',html,re.S).group(1))
          reverse=json.loads(Path('formal-web/school-3d/reverse-authority.v1.json').read_text())
          assert embedded==manifest, 'HTML embedded envelope manifest drift'
          assert manifest['source']['sha256']==reverse['source']['sha256']
          assert manifest['releaseAllowed'] is False and manifest['approved3DModel'] is False
          print('Phase13 source contract passes; no real heroine model approved')
          PY
      - name: Generate Phase13 SYNTHETIC mesh artifact for QA, NOT original girl
        run: python formal-web/school-3d/phase13/tools/build_envelope_synthetic_fixture.py --outdir artifacts/school-3d-phase13-synthetic
      - name: Archive explicitly synthetic Phase13 GLB (NOT visual Authority)
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School-3D-Phase13-SYNTHETIC-Skin-Envelope-NOT-APPROVED
          path: artifacts/school-3d-phase13-synthetic/
          retention-days: 14
          if-no-files-found: error
      - name: Phase14 ORIGINAL hair-spring face-geometry and sketch-color QA (NO AI model)
        run: |
          node --check formal-web/school-3d/phase14/beauty-engine.v1.js
          node --check formal-web/school-3d/phase14/hair-face-workbench.v1.js
          node formal-web/school-3d/phase14/tools/test_beauty_engine.cjs
          python -m unittest discover -s formal-web/school-3d/phase14/tools -p 'test_phase14_contract.py' -v
          python formal-web/school-3d/phase14/tools/make_hair_spec.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path('formal-web/school-3d/phase14/hair-face-spec.v1.json')
          s=json.loads(a.read_text())
          r=json.loads(Path('formal-web/school-3d/reverse-authority.v1.json').read_text())
          assert s['source']['sha256']==r['source']['sha256']
          assert len(s['hair']['strands'])==88 and s['hair']['segmentsPerStrand']==9
          assert s['gate']['aiModelAvailable'] is False
          assert s['approved3DModel'] is False and s['releasedToHomepage'] is False
          print('Phase14 hair spring and color source QA PASS — 3D/AI visual gate remains BLOCKED')
          PY
      - name: Phase15 original AIG 3D hair card exporter — SYNTHETIC INPUT ONLY
        run: |
          mkdir -p artifacts/school-3d-phase15-synthetic
          python formal-web/school-3d/phase15/tools/prepare_ci_synthetic.py \
            --synthetic-png artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png \
            --hair-spec formal-web/school-3d/phase14/hair-face-spec.v1.json \
            --out artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json
          python formal-web/school-3d/phase15/tools/build_hair_cards.py \
            --base artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-MESH-NOT-VISUAL-AUTHORITY.glb \
            --source artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png \
            --hair-spec artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json \
            --envelope-spec artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-SPEC.json \
            --phase13-builder formal-web/school-3d/phase13/tools/build_envelope.py \
            --out artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-TRUE-3D-HAIR-NOT-APPROVED.glb \
            --report artifacts/school-3d-phase15-synthetic/CI-PHASE15-STRUCTURAL-REPORT.json
      - name: Phase15 real skeleton 3D hair tests (12 hard gates)
        env:
          AIG_PHASE15_BASE_GLB: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-MESH-NOT-VISUAL-AUTHORITY.glb
          AIG_PHASE15_OUTPUT_GLB: artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-TRUE-3D-HAIR-NOT-APPROVED.glb
          AIG_PHASE15_HAIR_SPEC: artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json
          AIG_PHASE15_SOURCE_IMG: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png
          AIG_PHASE15_ENVELOPE_SPEC: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-SPEC.json
          AIG_PHASE15_PHASE13_BUILDER: formal-web/school-3d/phase13/tools/build_envelope.py
        run: python -m unittest discover -s formal-web/school-3d/phase15/tools -p 'test_phase15_hair.py' -v
      - name: Archive Phase15 SYNTHETIC GLB — never a real girl approval
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School3D-Phase15-SYNTHETIC-3D-HairRig-NOT-APPROVED
          path: artifacts/school-3d-phase15-synthetic/
          retention-days: 14
          if-no-files-found: error
      - name: Phase16 original fine alpha hair rebuild — SYNTHETIC INPUT ONLY
        run: |
          mkdir -p artifacts/school-3d-phase16-fine
          python formal-web/school-3d/phase16/tools/build_fine_hair.py \
            --base artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-TRUE-3D-HAIR-NOT-APPROVED.glb \
            --source artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png \
            --hair-spec artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json \
            --envelope-spec artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-SPEC.json \
            --phase13-builder formal-web/school-3d/phase13/tools/build_envelope.py \
            --out artifacts/school-3d-phase16-fine/CI-SYNTHETIC-528-FINE-HAIR-NOT-APPROVED.glb \
            --report artifacts/school-3d-phase16-fine/CI-STRUCTURAL-EVIDENCE.json
      - name: Phase16 fine strands, PNG transparency and skin integrity — 12 hard gates
        env:
          AIG_P16_BASE: artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-TRUE-3D-HAIR-NOT-APPROVED.glb
          AIG_P16_OUT: artifacts/school-3d-phase16-fine/CI-SYNTHETIC-528-FINE-HAIR-NOT-APPROVED.glb
          AIG_P16_IMAGE: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png
          AIG_P16_HAIR: artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json
          AIG_P16_ENV: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-SPEC.json
          AIG_P16_BUILDER: formal-web/school-3d/phase13/tools/build_envelope.py
        run: python -m unittest discover -s formal-web/school-3d/phase16/tools -p 'test_phase16_fine_hair.py' -v
      - name: Archive Phase16 synthetic technical GLB, NOT cinematic approval
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School3D-Phase16-SYNTHETIC-FineHair528-NOT-APPROVED
          path: artifacts/school-3d-phase16-fine/
          retention-days: 14
          if-no-files-found: error
      - name: Phase17 actual GLB image-silhouette reproject — SYNTHETIC CI only
        run: |
          mkdir -p artifacts/school-3d-phase17-synthetic
          python formal-web/school-3d/phase17/tools/build_source_fidelity.py \
            --base artifacts/school-3d-phase16-fine/CI-SYNTHETIC-528-FINE-HAIR-NOT-APPROVED.glb \
            --source artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png \
            --hair-spec artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json \
            --envelope-spec artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-SPEC.json \
            --phase15-builder formal-web/school-3d/phase15/tools/build_hair_cards.py \
            --phase13-builder formal-web/school-3d/phase13/tools/build_envelope.py \
            --out artifacts/school-3d-phase17-synthetic/CI-PHASE17-SYNTHETIC-SOURCE-MATTE-NOT-AUTHORITY.glb \
            --report artifacts/school-3d-phase17-synthetic/CI-STRUCTURE-NOT-VISUAL-FIDELITY.json
      - name: Phase17 16 strict source-mesh SHA face-alpha and no-fake tests
        env:
          AIG_P17_HAIR15: formal-web/school-3d/phase15/tools/build_hair_cards.py
          AIG_P17_CORE13: formal-web/school-3d/phase13/tools/build_envelope.py
          AIG_P17_BASE: artifacts/school-3d-phase16-fine/CI-SYNTHETIC-528-FINE-HAIR-NOT-APPROVED.glb
          AIG_P17_OUT: artifacts/school-3d-phase17-synthetic/CI-PHASE17-SYNTHETIC-SOURCE-MATTE-NOT-AUTHORITY.glb
          AIG_P17_IMAGE: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-NOT-AUTHORITY.png
          AIG_P17_HAIR_SPEC: artifacts/school-3d-phase15-synthetic/CI-SYNTHETIC-HAIR-SPEC.json
          AIG_P17_ENV: artifacts/school-3d-phase13-synthetic/CI-SYNTHETIC-SPEC.json
        run: python -m unittest discover -s formal-web/school-3d/phase17/tools -p 'test_phase17_source.py' -v
      - name: Archive Phase17 synthetic GLB technical only, NOT real heroine
        uses: actions/upload-artifact@v4
        with:
          name: AIG-School3D-Phase17-SYNTHETIC-HairMatte-NOT-APPROVED
          path: artifacts/school-3d-phase17-synthetic/
          retention-days: 14
          if-no-files-found: error
      - name: Explicit release status
        run: |
          node -e "const m = require('./formal-web/school-3d/authority.v1.json'); if (m.deploymentState !== 'PREVIEW_ONLY_NOT_PRODUCTION') process.exit(1); console.log('SOURCE QA ONLY: real female rig/PBR/walk/poster 3D authority is NOT approved');"
