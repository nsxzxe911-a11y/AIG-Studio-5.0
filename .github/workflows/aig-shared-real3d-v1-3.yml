name: AIG Three-Project Real3D Single-Block NC Replay V1.3 Gate
on:
  push:
    branches:
      - repair/core-first-fastmodel-20261021
    paths:
      - 'formal-web/shared-3d/**'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-real3d-replay-v1-3*'
      - 'formal-web/school-3d/fastmodel/single-photo/build.mjs'
      - '.github/workflows/aig-shared-real3d-v1-3.yml'
  workflow_dispatch:
jobs:
  real-blockwise-geometry:
    name: Atomic G0-G1 NC source steps and real WebGL phone desktop evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Syntax and true numerical source reparse
        run: |
          node --check viewer.mjs
          node --check scene-runtime-studio.mjs
          node --check aig-text-world-storyboard-2-2.mjs
          node --test tests/aig-text-world-storyboard-2-2.test.mjs
          node --check aig-map-model-alignment-2-1.mjs
          node --check tests/aig-map-actor-2-1.real-browser.mjs
          node --test tests/aig-map-model-alignment-2-1.test.mjs
          node --check aig-world-scene-2-0.mjs
          node --check aig-world-runtime-2-0.mjs
          node --check tests/aig-world-scene-2-0.real-browser.mjs
          node --test tests/aig-world-scene-2-0.test.mjs
          node --check aig-scene-lifecycle-1-9.mjs
          node --check scene-runtime-studio.mjs
          node --check tests/aig-scene-lifecycle-1-9.real-browser.mjs
          node --test tests/aig-scene-lifecycle-1-9.test.mjs
          node --check aig-external-asset-library-7-16.mjs
          node --check aig-native-asset-library-7-16.mjs
          node --check asset-library-studio.mjs
          node --check scene-map-studio.mjs
          node --check movie-ui.mjs
          node --check tests/aig-asset-library-7-16.real-browser.mjs
          node --test tests/aig-asset-library-7-16.native.test.mjs
          node --check aig-heroine-candidate-7-15.mjs
          node --check aig-heroine-candidate-ui-7-15.mjs
          node --test tests/aig-heroine-candidate-7-15.test.mjs
          node --check aig-heroine-scan-7-14.mjs
          node --check aig-heroine-scan-ui-7-14.mjs
          node --check tests/aig-heroine-scan-7-14.real-browser.mjs
          node --test tests/aig-heroine-scan-7-14.test.mjs
          node --check aig-metric-stereo-7-13.mjs
          node --check metric-stereo-studio.mjs
          node --check tests/aig-metric-stereo-7-13.real-browser.mjs
          node --test tests/aig-metric-stereo-7-13.test.mjs
          node --check aig-static-instancing-1-8.mjs
          node --test tests/aig-static-instancing-1-8.test.mjs
          node --check aig-glb-gpu-adaptive-1-7.mjs
          node --check viewer.mjs
          node --check app.mjs
          node --check tests/aig-glb-gpu-v1-7.real-browser.mjs
          node --test tests/aig-glb-gpu-adaptive-1-7.test.mjs
          node --check ../../../shared-3d/aig-real3d-gpu-budget-1-6.mjs
          node --check ../../../shared-3d/aig-real3d-webgl.mjs
          node --check tests/aig-real3d-gpu-v1-6.test.mjs
          node --check tests/aig-real3d-gpu-v1-6.real-browser.mjs
          node --test tests/aig-real3d-gpu-v1-6.test.mjs
          node --check ../../../shared-3d/aig-real3d-step-replay-1-3.mjs
          node --check ../../../shared-3d/aig-real3d-axis-bridge-1-4.mjs
          node --check ../../../shared-3d/aig-real3d-rig-integrity-1-5.mjs
          node --check tests/aig-real3d-rig-integrity-v1-5.test.mjs
          node --check tests/aig-real3d-axis-bridge-v1-4.test.mjs
          node --check ../../../shared-3d/aig-real3d-replay-lab.mjs
          node --check tests/aig-real3d-replay-v1-3.test.mjs
          node --check tests/aig-real3d-replay-v1-3.real-browser.mjs
          node --test tests/aig-real3d-replay-v1-3.test.mjs
          node --test tests/aig-real3d-axis-bridge-v1-4.test.mjs
          node --test tests/aig-real3d-rig-integrity-v1-5.test.mjs
          node --test tests/aig-real3d-nc-v1-2.test.mjs tests/aig-real3d-stock-v1-1.test.mjs tests/aig-real3d-shared-v1.test.mjs
      - name: Offline build retains 1.0 1.1 1.2 and 1.3 source exact
        run: |
          npm run build
          test -s dist/scene-runtime-studio.html
          test -s dist/scene-runtime-studio.js
          node --check dist/scene-runtime-studio.js
          test -s dist/asset-library-studio.html
          test -s dist/asset-library-studio.js
          node --check dist/asset-library-studio.js
          test -s dist/metric-stereo-studio.html
          test -s dist/metric-stereo-studio.js
          npx esbuild tests/aig-glb-gpu-1-7-lab.mjs --bundle --format=iife --platform=browser --target=chrome100 --outfile=dist/aig17-browser-bundle.js
          cp tests/aig-glb-gpu-1-7-lab.html dist/aig17-gpu-browser-lab.html
          test -s dist/aig17-browser-bundle.js
          test -s dist/aig17-gpu-browser-lab.html
          test -s dist/shared-3d/aig-real3d-gpu-budget-1-6.mjs
          cmp ../../../shared-3d/aig-real3d-gpu-budget-1-6.mjs dist/shared-3d/aig-real3d-gpu-budget-1-6.mjs
          cmp ../../../shared-3d/aig-real3d-webgl.mjs dist/shared-3d/aig-real3d-webgl.mjs
          test -s dist/shared-3d/aig-real3d-step-replay-1-3.mjs
          test -s dist/shared-3d/aig-real3d-axis-bridge-1-4.mjs
          test -s dist/shared-3d/aig-real3d-rig-integrity-1-5.mjs
          cmp ../../../shared-3d/aig-real3d-rig-integrity-1-5.mjs dist/shared-3d/aig-real3d-rig-integrity-1-5.mjs
          cmp ../../../shared-3d/aig-real3d-axis-bridge-1-4.mjs dist/shared-3d/aig-real3d-axis-bridge-1-4.mjs
          test -s dist/shared-3d/aig-real3d-replay-lab.html
          test -s dist/shared-3d/aig-real3d-replay-lab.mjs
          cmp ../../../shared-3d/aig-real3d-step-replay-1-3.mjs dist/shared-3d/aig-real3d-step-replay-1-3.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real phone desktop incremental stock material removal and rewind
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig-nc13-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-map-actor-2-1.real-browser.mjs
          node tests/aig-world-scene-2-0.real-browser.mjs
          node tests/aig-scene-lifecycle-1-9.real-browser.mjs
          node tests/aig-asset-library-7-16.real-browser.mjs
          node tests/aig-real3d-replay-v1-3.real-browser.mjs
          node tests/aig-real3d-gpu-v1-6.real-browser.mjs
          node tests/aig-glb-gpu-v1-7.real-browser.mjs
          node tests/aig-metric-stereo-7-13.real-browser.mjs
          node tests/aig-heroine-scan-7-14.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Real3D-1-3-NC-G0G1-True-Single-Block-Voxel-WebGL
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-replay-v1-3/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-1-6-WebGL-GPU-Resource-Bounded-Not-Native-FPS
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-gpu-v1-6/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-1-7-Actual-GLTF2-Animation-GPU-Not-Heroine-Or-Native-FPS
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-gpu-v1-7/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-16-External-UserData-Asset-Vault-Real-Browser-Not-Native-APK
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-external-asset-library-7-16/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Real3D-1-9-Single-Scene-GPU-Lifecycle-Browser-Evidence
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-scene-lifecycle-1-9/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-2-0-Actual-Multi-GLB-World-Phone-Desktop
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-world-scene-2-0/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-2-1-Source-Map-Actor-Motion-Phone-Desktop
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-map-actor-2-1/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-2-2-Actual-Chinese-Story-GLB-Camera-Subtitle
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-text-story-2-2/
          if-no-files-found: warn
      - name: Exact proof boundary
        if: always()
        run: |
          {
            echo 'TRUE_3D_STOCK_STEP=NUMERICAL_VOXEL_OCCUPANCY_AND_BOUNDARY_REBUILD'
            echo 'G0_STOCK_REMOVAL=ZERO'
            echo 'G1_STOCK_REMOVAL=PHYSICAL_MM3_VOXEL_APPROXIMATION'
            echo 'REWIND=RECOMPUTE_FROM_SAME_SOURCE_NOT_FAKE_IMAGE'
            echo 'CNC_COMMAND_OUTPUT=DISABLED'
            echo 'FULL_FANUC_3_6_AXIS_POST_AND_COLLISION=NOT_VERIFIED'
            echo 'CONTINUOUS_0_001_MM_SURFACE=NOT_VERIFIED'
            echo 'ANDROID_APK_WINDOWS_EXE_GPU=NOT_VERIFIED'
            echo 'GPU_RESIDENT_BUFFER_BUDGET=REAL_BUFFER_HANDLE_COUNT_AND_BYTES_NOT_GPU_TIMING'
            echo 'WEBGL_STREAMED_G0_G1_LINE_BUFFERS=REUSED_BOUNDED_NOT_RECREATED_EACH_FRAME'
            echo 'FASTMODEL_1_6_NATIVE_60FPS=NOT_VERIFIED'
            echo 'FASTMODEL_1_7_REAL_GLB_ANIMATED_AND_GPU_TIMER=TRUST_ONLY_EXT_DISJOINT_IF_AVAILABLE'
            echo 'FASTMODEL_1_7_GPU_NATIVE_PERFORMANCE_AND_PHOTOREAL_HEROINE=NOT_VERIFIED'
            echo 'FASTMODEL_1_8_REAL_STATIC_INSTANCING=TRUE_THREE_GPU_DRAW_CALLS_ONLY'
            echo 'FASTMODEL_1_8_SKINNED_MORPH_ANIMATED_AND_CNC_SOURCE=UNCHANGED'
            echo 'FASTMODEL_1_8_NATIVE_DEVICE_FPS_UPLIFT=NOT_YET_MEASURED'
            echo 'FASTMODEL_7_13_METRIC_XYZ=ONLY_WITH_REVIEWED_PHYSICAL_CAMERA_BASELINE_AND_FOCAL'
            echo 'FASTMODEL_7_13_SINGLE_PHOTO_BACKSIDE_OR_FULL_HUMAN_ACCURACY=NOT_VERIFIED'
            echo 'FASTMODEL_7_14_ACTUAL_RGB_DEPTH_NORMAL_CONFIDENCE=REQUIRES_MEASURED_STEREO_AND_REVIEWED_COLOR_SEEDS'
            echo 'FASTMODEL_7_14_REAL_APPROVED_HEROINE_FULL_BODY_AND_BACKSIDE=NOT_YET_SCANNED'
            echo 'FASTMODEL_7_15_EDITABLE_HAIR_FACE_NECK_CLOTH_GEOMETRY=SOURCE_SEMANTIC_DRAFT'
            echo 'FASTMODEL_7_15_ESTIMATED_DEPTH=RELATIVE_NOT_MM'
            echo 'FASTMODEL_7_15_MEASURED_DEPTH=INDEPENDENT_CALIBRATED_STEREO_MM'
            echo 'FASTMODEL_7_15_SKELETON=EDITABLE_ANCHORS_NOT_FULL_SKINNING'
            echo 'FASTMODEL_7_15_GLTF=REAL_GEOMETRY_NOT_VERIFIED_1_TO_1'
            echo 'FASTMODEL_7_16_PERSON_BUILDING_MAP_SCENE_TRANSITION_ASSETS=CONTENT_ADDRESSED_LOCAL_USER_DATA'
            echo 'FASTMODEL_7_16_REUSE=APPROVED_TAG_AND_HISTORY_ONLY_NOT_MODEL_TRAINING'
            echo 'FASTMODEL_7_16_NATIVE_APPDATA_AND_ANDROID_FILESDIR=ADAPTER_IMPLEMENTED_NATIVE_APP_WIRING_NOT_VERIFIED'
            echo 'FASTMODEL_7_16_EAGER_READING_ALL_MODELS_AT_STARTUP=DISABLED'
            echo 'FASTMODEL_REAL3D_1_9_ACTIVE_GPU_SCENES=ONE'
            echo 'FASTMODEL_REAL3D_1_9_RAM_CACHE=BOUNDED_LRU_AND_LAZY_LOAD'
            echo 'FASTMODEL_REAL3D_1_9_ORIGINAL_GLB_INDEXEDDB=IMMUTABLE_ON_GPU_UNLOAD'
            echo 'FASTMODEL_REAL3D_1_9_GPU_VRAM_ACTUAL_BYTES=NOT_MEASURED'
            echo 'FASTMODEL_REAL3D_1_9_ANDROID_WINDOWS_NATIVE=NOT_YET_INTEGRATED'
            echo 'FASTMODEL_REAL3D_2_0_MULTI_GLTF_WORLD=SINGLE_THREE_RENDERER_SOURCE_LOCKED'
            echo 'FASTMODEL_REAL3D_2_0_MAP=SHA_REFERENCED_READ_ONLY_7_12_GEODATA'
            echo 'FASTMODEL_REAL3D_2_0_CAMERA=SOURCE_KEYFRAMES_NOT_AI_GENERATED_MOTION'
            echo 'FASTMODEL_REAL3D_2_0_ESTIMATED_ONE_PHOTO_SCALE=NOT_MEASURED_METRES'
            echo 'FASTMODEL_REAL3D_2_0_ORIGINAL_GLB_IMMUTABLE=TRUE'
            echo 'FASTMODEL_REAL3D_2_0_RENDER_NATIVE_ANDROID_WINDOWS=NOT_VERIFIED'
            echo 'FASTMODEL_REAL3D_2_1_MAP_TO_GLTF=SOURCE_GEOMETRY_XY_TO_GROUND_XZ_NO_FAKE_HEIGHT'
            echo 'FASTMODEL_REAL3D_2_1_ACTOR_CLIPS=ORIGINAL_GLTF2_ONLY_NO_SYNTHETIC_TEXT_MOTION'
            echo 'FASTMODEL_REAL3D_2_1_METRIC_SCALE=SOURCE_REVIEW_REQUIRED'
            echo 'FASTMODEL_REAL3D_2_1_SOURCE_SHA=UNCHANGED_AND_VALIDATED'
            echo 'FASTMODEL_REAL3D_2_1_REAL_HEROINE_FULL_RIG=NOT_VERIFIED'
            echo 'FASTMODEL_REAL3D_2_2_TEXT_ACTOR_ACTIONS=SOURCE_GLB_CLIP_ONLY'
            echo 'FASTMODEL_REAL3D_2_2_CAMERA=PREAUTHORED_KEYFRAME_ONLY'
            echo 'FASTMODEL_REAL3D_2_2_VOICE_GENERATION=NOT_IMPLEMENTED'
            echo 'FASTMODEL_REAL3D_2_2_STILL_IMAGE_FULL_RIG=NOT_YET_GENERATED'
            echo 'FASTMODEL_REAL3D_2_2_STORYBOARD=EXTERNAL_SOURCE_SHA_REVISION_LOCKED'
          } >> "$GITHUB_STEP_SUMMARY"
