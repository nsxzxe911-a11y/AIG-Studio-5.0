name: AIG Three-Project Real3D Single-Block NC Replay V1.3 Gate
on:
  push:
    branches:
      - repair/core-first-fastmodel-20261021
    paths:
      - 'formal-web/shared-3d/**'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-real3d-replay-v1-3*'
      - 'formal-web/school-3d/fastmodel/single-photo/build.mjs'
      - '.github/workflows/aig-shared-real3d-v1-3.yml'
  workflow_dispatch:
jobs:
  real-blockwise-geometry:
    name: Atomic G0-G1 NC source steps and real WebGL phone desktop evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Syntax and true numerical source reparse
        run: |
          node --check aig-metric-stereo-7-13.mjs
          node --check metric-stereo-studio.mjs
          node --check tests/aig-metric-stereo-7-13.real-browser.mjs
          node --test tests/aig-metric-stereo-7-13.test.mjs
          node --check aig-static-instancing-1-8.mjs
          node --test tests/aig-static-instancing-1-8.test.mjs
          node --check aig-glb-gpu-adaptive-1-7.mjs
          node --check viewer.mjs
          node --check app.mjs
          node --check tests/aig-glb-gpu-v1-7.real-browser.mjs
          node --test tests/aig-glb-gpu-adaptive-1-7.test.mjs
          node --check ../../../shared-3d/aig-real3d-gpu-budget-1-6.mjs
          node --check ../../../shared-3d/aig-real3d-webgl.mjs
          node --check tests/aig-real3d-gpu-v1-6.test.mjs
          node --check tests/aig-real3d-gpu-v1-6.real-browser.mjs
          node --test tests/aig-real3d-gpu-v1-6.test.mjs
          node --check ../../../shared-3d/aig-real3d-step-replay-1-3.mjs
          node --check ../../../shared-3d/aig-real3d-axis-bridge-1-4.mjs
          node --check ../../../shared-3d/aig-real3d-rig-integrity-1-5.mjs
          node --check tests/aig-real3d-rig-integrity-v1-5.test.mjs
          node --check tests/aig-real3d-axis-bridge-v1-4.test.mjs
          node --check ../../../shared-3d/aig-real3d-replay-lab.mjs
          node --check tests/aig-real3d-replay-v1-3.test.mjs
          node --check tests/aig-real3d-replay-v1-3.real-browser.mjs
          node --test tests/aig-real3d-replay-v1-3.test.mjs
          node --test tests/aig-real3d-axis-bridge-v1-4.test.mjs
          node --test tests/aig-real3d-rig-integrity-v1-5.test.mjs
          node --test tests/aig-real3d-nc-v1-2.test.mjs tests/aig-real3d-stock-v1-1.test.mjs tests/aig-real3d-shared-v1.test.mjs
      - name: Offline build retains 1.0 1.1 1.2 and 1.3 source exact
        run: |
          npm run build
          test -s dist/metric-stereo-studio.html
          test -s dist/metric-stereo-studio.js
          npx esbuild tests/aig-glb-gpu-1-7-lab.mjs --bundle --format=iife --platform=browser --target=chrome100 --outfile=dist/aig17-browser-bundle.js
          cp tests/aig-glb-gpu-1-7-lab.html dist/aig17-gpu-browser-lab.html
          test -s dist/aig17-browser-bundle.js
          test -s dist/aig17-gpu-browser-lab.html
          test -s dist/shared-3d/aig-real3d-gpu-budget-1-6.mjs
          cmp ../../../shared-3d/aig-real3d-gpu-budget-1-6.mjs dist/shared-3d/aig-real3d-gpu-budget-1-6.mjs
          cmp ../../../shared-3d/aig-real3d-webgl.mjs dist/shared-3d/aig-real3d-webgl.mjs
          test -s dist/shared-3d/aig-real3d-step-replay-1-3.mjs
          test -s dist/shared-3d/aig-real3d-axis-bridge-1-4.mjs
          test -s dist/shared-3d/aig-real3d-rig-integrity-1-5.mjs
          cmp ../../../shared-3d/aig-real3d-rig-integrity-1-5.mjs dist/shared-3d/aig-real3d-rig-integrity-1-5.mjs
          cmp ../../../shared-3d/aig-real3d-axis-bridge-1-4.mjs dist/shared-3d/aig-real3d-axis-bridge-1-4.mjs
          test -s dist/shared-3d/aig-real3d-replay-lab.html
          test -s dist/shared-3d/aig-real3d-replay-lab.mjs
          cmp ../../../shared-3d/aig-real3d-step-replay-1-3.mjs dist/shared-3d/aig-real3d-step-replay-1-3.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real phone desktop incremental stock material removal and rewind
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig-nc13-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-real3d-replay-v1-3.real-browser.mjs
          node tests/aig-real3d-gpu-v1-6.real-browser.mjs
          node tests/aig-glb-gpu-v1-7.real-browser.mjs
          node tests/aig-metric-stereo-7-13.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Real3D-1-3-NC-G0G1-True-Single-Block-Voxel-WebGL
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-replay-v1-3/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-1-6-WebGL-GPU-Resource-Bounded-Not-Native-FPS
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-gpu-v1-6/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-Real3D-1-7-Actual-GLTF2-Animation-GPU-Not-Heroine-Or-Native-FPS
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-gpu-v1-7/
          if-no-files-found: warn
      - name: Exact proof boundary
        if: always()
        run: |
          {
            echo 'TRUE_3D_STOCK_STEP=NUMERICAL_VOXEL_OCCUPANCY_AND_BOUNDARY_REBUILD'
            echo 'G0_STOCK_REMOVAL=ZERO'
            echo 'G1_STOCK_REMOVAL=PHYSICAL_MM3_VOXEL_APPROXIMATION'
            echo 'REWIND=RECOMPUTE_FROM_SAME_SOURCE_NOT_FAKE_IMAGE'
            echo 'CNC_COMMAND_OUTPUT=DISABLED'
            echo 'FULL_FANUC_3_6_AXIS_POST_AND_COLLISION=NOT_VERIFIED'
            echo 'CONTINUOUS_0_001_MM_SURFACE=NOT_VERIFIED'
            echo 'ANDROID_APK_WINDOWS_EXE_GPU=NOT_VERIFIED'
            echo 'GPU_RESIDENT_BUFFER_BUDGET=REAL_BUFFER_HANDLE_COUNT_AND_BYTES_NOT_GPU_TIMING'
            echo 'WEBGL_STREAMED_G0_G1_LINE_BUFFERS=REUSED_BOUNDED_NOT_RECREATED_EACH_FRAME'
            echo 'FASTMODEL_1_6_NATIVE_60FPS=NOT_VERIFIED'
            echo 'FASTMODEL_1_7_REAL_GLB_ANIMATED_AND_GPU_TIMER=TRUST_ONLY_EXT_DISJOINT_IF_AVAILABLE'
            echo 'FASTMODEL_1_7_GPU_NATIVE_PERFORMANCE_AND_PHOTOREAL_HEROINE=NOT_VERIFIED'
            echo 'FASTMODEL_1_8_REAL_STATIC_INSTANCING=TRUE_THREE_GPU_DRAW_CALLS_ONLY'
            echo 'FASTMODEL_1_8_SKINNED_MORPH_ANIMATED_AND_CNC_SOURCE=UNCHANGED'
            echo 'FASTMODEL_1_8_NATIVE_DEVICE_FPS_UPLIFT=NOT_YET_MEASURED'
            echo 'FASTMODEL_7_13_METRIC_XYZ=ONLY_WITH_REVIEWED_PHYSICAL_CAMERA_BASELINE_AND_FOCAL'
            echo 'FASTMODEL_7_13_SINGLE_PHOTO_BACKSIDE_OR_FULL_HUMAN_ACCURACY=NOT_VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"
