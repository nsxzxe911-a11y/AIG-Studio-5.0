# committed-state verification for Studio 592
name: TEMP Studio 592 Core Closure

on:
  push:
    branches:
      - work/studio-592-web-authority-core-closure

permissions:
  contents: write

concurrency:
  group: studio-592-core-closure
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36 preflight
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          INSTALLED_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort -V | tail -1 || true)"
          test -n "$INSTALLED_BUILD_TOOLS"
          echo "ANDROID_SDK_36_PREFLIGHT=PASS|BUILD_TOOLS=$INSTALLED_BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Detect callback patch state
        id: state
        shell: bash
        run: |
          if grep -Fq 'selectTool(Tool.SELECT)' design/ui/button-manifest-v1.json; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply minimal live callback fix
        if: steps.state.outputs.applied == 'false'
        run: python3 ci/apply_ui_button_live_callback_v2.py
      - name: Verify Web Authority surfaces
        run: |
          set -euo pipefail
          python3 ci/verify_formal_web_navigation.py
          python3 ci/verify_web_authority_isolation.py
          node ci/verify_web_runtime.mjs
      - name: Verify production navigation callbacks are live
        run: python3 ci/verify_ui_button_live_callbacks_v2.py
      - name: Verify existing runtime gates
        run: |
          set -euo pipefail
          python3 ci/verify_ui_button_manifest_consistency.py
          python3 ci/verify_production_runtime.py
          python3 ci/verify_runtime_surfaces.py
      - name: Run supported focused core regressions
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :core:camManualMachiningContractRegression \
            :core:runtimeLinkRegression \
            :core:openRuntimePolicyRegression \
            :core:rgbGlobalSkinRegression \
            :core:tutorialPresentationRegression
      - name: Compile and assemble Android production runtime
        run: gradle --no-daemon :app:verifyAndroidPlatform :app:assembleDebug
      - name: Commit verified live callback fix
        if: steps.state.outputs.applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIG Cloud Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/aigstudio/app/MainActivity.kt core/src/main/kotlin/com/aigstudio/core/UiButtonManifestContract.kt design/ui/button-manifest-v1.json
          git diff --cached --check
          git commit -m 'fix(ui): bind CAD production nav to live core state'
          git push origin HEAD:work/studio-592-web-authority-core-closure
