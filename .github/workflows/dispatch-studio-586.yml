name: AIG Studio 586 verified dispatcher

on:
  push:
    branches:
      - ops/dispatch-studio-586-f66fc

permissions:
  contents: read
  actions: write

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f66fc0b3177c315dcb522bd86ab38eac511b2a2d
      - name: Pin exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f66fc0b3177c315dcb522bd86ab38eac511b2a2d"
          echo 'STUDIO_586_TARGET_SHA=f66fc0b3177c315dcb522bd86ab38eac511b2a2d'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Re-run formal gates on exact target
        shell: bash
        run: |
          set -euo pipefail
          python ci/verify_aig_dual_ai_web_update.py
          python ci/verify_ui_button_manifest_consistency.py
          python ci/verify_axis_button_asset_contract.py
          python ci/verify_formal_global_navigation.py
          python ci/verify_android_axis_page_persistence_contract.py
          python ci/verify_production_runtime.py
      - name: Compile Android and core on exact target
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:compileKotlin :app:compileDebugKotlin --no-daemon --console=plain
      - name: Dispatch formal builder against immutable release ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/dispatch-body.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-download.yml/dispatches" \
            -d '{"ref":"release/studio-586-f66fc"}')"
          cat /tmp/dispatch-body.txt || true
          test "$code" = '204'
          echo 'STUDIO_586_FORMAL_DISPATCH=PASS|REF=release/studio-586-f66fc|SHA=f66fc0b3177c315dcb522bd86ab38eac511b2a2d'
