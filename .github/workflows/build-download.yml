name: AIG Studio release build
run-name: AIG Studio release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK and source package
        shell: bash
        run: ./build_android_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Android-APK
          path: release/android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Full-Project-Source
          path: release/source/
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Windows EXE
        shell: pwsh
        run: .\AIG_Studio_5_0_UI_branch_update\AIG_Studio_5_0\build_windows_native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Windows-EXE
          path: release/windows/
          if-no-files-found: error
