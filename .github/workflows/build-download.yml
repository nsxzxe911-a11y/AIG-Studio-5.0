name: AIG Studio release build
run-name: AIG Studio release build

on:
  workflow_dispatch:

concurrency:
  group: aig-studio-release-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        working-directory: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Prepare APK and source package
        shell: bash
        run: |
          set -euo pipefail
          APK="AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk
          sha256sum AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk > AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk.sha256
          git archive --format=zip --output=AIG_Studio_FULL_PROJECT_SOURCE.zip HEAD
          sha256sum AIG_Studio_FULL_PROJECT_SOURCE.zip > AIG_Studio_FULL_PROJECT_SOURCE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Android-APK
          path: |
            AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk
            AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Full-Project-Source
          path: |
            AIG_Studio_FULL_PROJECT_SOURCE.zip
            AIG_Studio_FULL_PROJECT_SOURCE.zip.sha256
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin and WiX
        shell: pwsh
        run: |
          choco install kotlinc -y
          choco install wixtoolset -y
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $Project='AIG_Studio_5_0_UI_branch_update\AIG_Studio_5_0'
          & ".\$Project\build_windows_native.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $exe=Get-ChildItem "$Project\dist\windows-self-contained" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'Windows EXE missing' }
          Copy-Item $exe.FullName AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe -Force
          (Get-FileHash AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe -Algorithm SHA256).Hash | Out-File AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Windows-EXE
          path: |
            AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe
            AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe.sha256
          if-no-files-found: error
