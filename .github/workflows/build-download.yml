name: AIG Studio release build
run-name: AIG Studio release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        working-directory: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK and source package
        shell: bash
        run: |
          set -euo pipefail
          APK="AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk
          sha256sum AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk > AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk.sha256
          git archive --format=zip --output=AIG_Studio_FULL_PROJECT_SOURCE.zip HEAD
          sha256sum AIG_Studio_FULL_PROJECT_SOURCE.zip > AIG_Studio_FULL_PROJECT_SOURCE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Android-APK
          path: |
            AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk
            AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Full-Project-Source
          path: |
            AIG_Studio_FULL_PROJECT_SOURCE.zip
            AIG_Studio_FULL_PROJECT_SOURCE.zip.sha256
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Windows EXE
        shell: pwsh
        run: .\AIG_Studio_5_0_UI_branch_update\AIG_Studio_5_0\build_windows_native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Windows-EXE
          path: |
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe.sha256
          if-no-files-found: error
