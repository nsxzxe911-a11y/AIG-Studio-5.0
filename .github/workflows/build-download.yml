name: AIG Studio release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android APK and source package
        shell: bash
        run: ./build_android_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Android-and-Source
          path: |
            release/android/
            release/source/
          if-no-files-found: error

  windows-exe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Windows EXE
        shell: pwsh
        run: .\build_windows_native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AIG-Studio-Windows-EXE
          path: release/windows/
          if-no-files-found: error
