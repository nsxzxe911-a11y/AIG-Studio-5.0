name: Real3D V107 vs original true 3D GPU A/B visual and performance comparison
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/tests/aig-real3d-v107-vs-v106-baseline.real-browser.mjs'
      - 'docs/REAL3D-V107-ORIGINAL-3D-AB-*'
      - '.github/workflows/aig-real3d-v107-baseline-vs-fiveaxis-ab-gpu-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v107-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-vs-5ax-actual-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Node syntax for side-by-side original GLB comparisons
        run: |
          node --check formal-web/shared-3d/tests/aig-real3d-v107-vs-v106-baseline.real-browser.mjs
          node --check formal-web/shared-3d/aig-real3d-webgl.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v107-five-axis-foot-head.test.mjs
      - name: Chromium/WebGL library
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render same GLB source old 3D, A0 B0 full and A45 B90 quarter height
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v107-ab-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v99-native-source-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v107-vs-v106-baseline.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V107-vs-Original-True-3D-AB-GPU-Screenshots-Timings
          path: artifacts/aig-real3d-v107-vs-original/
          if-no-files-found: warn
