name: Apply cross-platform global navigation once

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015
    paths:
      - .github/workflows/apply-cross-platform-global-navigation-once.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aig-dual-ai-web-update-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply and verify cross-platform global navigation
        shell: bash
        run: |
          set -euo pipefail
          python ci/apply_cross_platform_global_navigation.py
          python ci/verify_aig_dual_ai_web_update.py
          python ci/verify_ui_button_manifest_consistency.py
          python ci/verify_axis_button_asset_contract.py
          python ci/verify_formal_global_navigation.py
          python ci/verify_production_runtime.py
          python ci/verify_runtime_surfaces.py
          python ci/fast_review.py
          gradle :core:compileKotlin :desktop:compileKotlin --no-daemon --console=plain
      - name: Commit cross-platform global navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/com/aigstudio/desktop/DesktopApp.kt
          git add desktop/src/main/resources/aig-generated-rgb/approved/184/manifest.json
          git add desktop/src/main/resources/aig-generated-rgb/approved/184/sha256.properties
          git add ci/verify_production_runtime.py
          git add ci/verify_runtime_surfaces.py
          git add .github/workflows/build-download.yml
          git commit -m 'fix(ui): align Android Windows 9-mode production navigation'
          git push origin HEAD:feature/aig-dual-ai-web-update-20261015
      # one-shot trigger: 2026-10-15
