name: Verify Authority HOME dev once

on:
  push:
    branches:
      - architecture/page-autonomy-ai-orchestrator-after-588
    paths:
      - '.github/authority-home-dev.trigger'

permissions:
  contents: read

concurrency:
  group: authority-home-dev-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: architecture/page-autonomy-ai-orchestrator-after-588
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Compile current feature HEAD
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:pageAutonomyRegression :app:assembleDebug :desktop:compileKotlin --stacktrace
          echo 'AUTHORITY_HOME_FEATURE_COMPILE=PASS'
      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
          echo 'ANDROID_EMULATOR_KVM_READY=PASS'
      - name: Authority-only HOME emulator evidence
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/verify_android_authority_only_home_dev.sh
      - name: Upload dev visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: AIG-Studio-Authority-HOME-Dev-Evidence
          path: release/android/dev-authority-evidence/
          if-no-files-found: error
          retention-days: 3
