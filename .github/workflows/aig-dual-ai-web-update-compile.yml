name: AIG Studio dual AI web update compile

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'
      - name: Compile Studio update policy
        run: gradle :core:compileKotlin --no-daemon --console=plain
