name: AIG Studio dual AI web update compile

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015

permissions:
  contents: read
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Studio update policy
        run: gradle :core:compileKotlin --no-daemon --console=plain

  dispatch-builder-583:
    if: ${{ contains(github.event.head_commit.message, '[dispatch-583]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch formal builder 583
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-download.yml --repo nsxzxe911-a11y/AIG-Studio-5.0 --ref feature/aig-dual-ai-web-update-20261015
          echo 'FORMAL_BUILDER_583_DISPATCHED=PASS'
