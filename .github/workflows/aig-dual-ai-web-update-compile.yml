name: Dispatch formal builder 586 once

on:
  push:
    branches:
      - tmp/formal-builder-dispatch-586

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch formal builder against clean feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/nsxzxe911-a11y/AIG-Studio-5.0/actions/workflows/build-download.yml/dispatches \
            -f ref='feature/aig-dual-ai-web-update-20261015'
          echo 'FORMAL_BUILDER_586_DISPATCH_PASS|TARGET=feature/aig-dual-ai-web-update-20261015|EXPECTED_HEAD=7c8aebf9eb56ec0b03848b9dd4f944ad92f58bf7'
