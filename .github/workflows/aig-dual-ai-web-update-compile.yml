name: AIG Studio dual AI web update compile

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Studio update policy
        run: gradle :core:compileKotlin --no-daemon --console=plain

  apply-axis-persistence:
    if: ${{ contains(github.event.head_commit.message, '[apply-axis-persistence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aig-dual-ai-web-update-20261015
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply and verify axis persistence runtime changes
        shell: bash
        run: |
          set -euo pipefail
          python ci/apply_axis_persistence_runtime.py
          python ci/verify_android_axis_page_persistence_contract.py
          python ci/verify_formal_global_navigation.py
          python ci/verify_production_runtime.py
          bash -n ci/verify_android_axis_page_persistence.sh
          gradle :core:compileKotlin :app:compileDebugKotlin --no-daemon --console=plain
      - name: Commit verified axis persistence runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aigstudio/app/MainActivity.kt
          git add app/src/main/java/com/aigstudio/app/Machining3DView.kt
          git add ci/verify_android_offline_rgb_home.sh
          git commit -m 'fix(android): keep 3AX through 6AX runtime pages verifiable'
          git push origin HEAD:feature/aig-dual-ai-web-update-20261015
