name: AIG Studio dual AI web update compile

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015

permissions:
  contents: write
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Studio update policy
        run: gradle :core:compileKotlin --no-daemon --console=plain

  kvm-hotfix-581:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/aig-dual-ai-web-update-20261015
          fetch-depth: 0
      - name: Patch only formal builder KVM block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/build-download.yml')
          text = p.read_text(encoding='utf-8')
          old = '''      - name: Enable KVM group perms
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
          echo 'ANDROID_EMULATOR_KVM_READY=PASS'
'''
          new = '''      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo 'ANDROID_EMULATOR_KVM_READY=PASS'
'''
          if new in text:
              print('KVM_581_PATCH_ALREADY_PRESENT=PASS')
          elif old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('KVM_581_PATCH_APPLIED=PASS')
          else:
              raise SystemExit('KVM_581_EXPECTED_BLOCK_NOT_FOUND')
          PY
          python3 ci/verify_android_emulator_kvm_contract.py
      - name: Commit exact KVM hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-download.yml
          if git diff --cached --quiet; then
            echo 'KVM_581_COMMIT_NOT_NEEDED=PASS'
          else
            git commit -m 'fix(ci): harden formal builder KVM gate for 581'
            git push origin HEAD:feature/aig-dual-ai-web-update-20261015
          fi
      - name: Dispatch formal builder 581
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-download.yml --repo nsxzxe911-a11y/AIG-Studio-5.0 --ref feature/aig-dual-ai-web-update-20261015
          echo 'FORMAL_BUILDER_581_DISPATCHED=PASS'
