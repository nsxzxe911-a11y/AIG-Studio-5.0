name: AIG Studio dual AI web update compile

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015

permissions:
  contents: read
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Studio update policy
        run: gradle :core:compileKotlin --no-daemon --console=plain

  dispatch-builder-581:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI-only KVM preflight
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ANDROID_EMULATOR_KVM_PREFLIGHT=PASS' build_android_release.sh
          grep -Fq 'sudo chmod 666 /dev/kvm' build_android_release.sh
          grep -Fq 'test -r /dev/kvm' build_android_release.sh
          grep -Fq 'test -w /dev/kvm' build_android_release.sh
          echo 'KVM_581_RELEASE_PREFLIGHT_CONTRACT=PASS'
      - name: Dispatch formal builder 581
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-download.yml --repo nsxzxe911-a11y/AIG-Studio-5.0 --ref feature/aig-dual-ai-web-update-20261015
          echo 'FORMAL_BUILDER_581_DISPATCHED=PASS'
