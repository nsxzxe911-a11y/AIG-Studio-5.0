name: AIG Studio dual AI web update compile

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Studio update policy
        run: gradle :core:compileKotlin --no-daemon --console=plain

  fix-home-6ax:
    if: ${{ contains(github.event.head_commit.message, '[fix-home-6ax]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aig-dual-ai-web-update-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply single-path Windows HOME 6AX fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop/src/main/kotlin/com/aigstudio/desktop/DesktopApp.kt')
          s=p.read_text(encoding='utf-8')
          old='''        add(homeLaunch("6AX",Color(159,114,255)){productionUiButtons["6AX"]?.doClick(); runCatching{showUnifiedMachiningEditor(
                          frame,doc,status,productionCamDerivedCache,"6AX",productionCamSettings,productionFixtures,productionToolAssembly)}.onFailure{status.text="6AX WARNING • "+(it.message?:"error")}})'''
          new='''        add(homeLaunch("6AX",Color(159,114,255)){productionUiButtons["6AX"]?.doClick()})'''
          assert s.count(old)==1, f'WINDOWS_HOME_6AX_DOUBLE_LAUNCH_PATTERN_COUNT={s.count(old)}'
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('WINDOWS_HOME_6AX_SINGLE_PATH_PATCH_PASS')
          PY
          python ci/verify_formal_global_navigation.py
          python ci/verify_production_runtime.py
          python ci/verify_runtime_surfaces.py
          python ci/fast_review.py
          gradle :core:compileKotlin :desktop:compileKotlin --no-daemon --console=plain
      - name: Commit single-path Windows HOME 6AX fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/com/aigstudio/desktop/DesktopApp.kt
          git commit -m 'fix(ui): make Windows HOME 6AX launch single-path'
          git push origin HEAD:feature/aig-dual-ai-web-update-20261015
