          test -s dist/occlusion-studio.mjs
          test -s dist/aig-hair-neck-7-7.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real phone and desktop local photo hair/neck brush test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig77-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-hair-neck-7-7.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
