      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-9-Independent-Real-Video-Camera-Keyframe-Evidence
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-continuous-7-9/
          if-no-files-found: warn
      - name: Explicit 3D-reconstruction truth gate
        if: always()
        run: |
          {
            echo 'VIDEO_CAMERA_FRAME_CAPTURE=REAL_BROWSER_API'
            echo 'KEYFRAME_MEMORY=LOCAL_BOUNDED_FRAME_DESCRIPTORS'
            echo 'ACTUAL_AUTO_CAMERA_POSE_SOLVED=NO'
            echo 'UNSEEN_TRUE_3D_FACE_RECOVERED=NO'
            echo 'USER_HEROINE_LIKENESS=NOT_VERIFIED'
            echo 'NATIVE_APK_EXE=NOT_VERIFIED'
            echo 'MMO_ONLINE=NOT_IMPLEMENTED'
          } >> "$GITHUB_STEP_SUMMARY"

  multiview-7-10:
    name: Independent 7.10 calibrated multi-video-frame XYZ fusion gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
