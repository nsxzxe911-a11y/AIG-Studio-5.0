      - name: Explicit source/3D trust boundary
        if: always()
        run: |
          {
            echo 'MATCHED_SOURCE_VIDEO_PIXELS=ACTUAL_BIDIRECTIONAL_PATCH_MATCH'
            echo 'CAMERA_MOTION_ESTIMATION=NOT_SOLVED'
            echo 'CAMERA_INTRINSICS=USER_VERIFIED_NOT_AUTO_ESTIMATED'
            echo 'XYZ_FUSION=ONLY_HUMAN_REVIEWED_WITH_7_10_STEREO_CALIBRATION'
            echo 'COMPLETE_HUMAN_FACE_OR_SKIN=NOT_APPROVED'
            echo 'NATIVE_APK_EXE_FPS=NOT_VERIFIED'
            echo 'LIVE_MULTIPLAYER=NOT_IMPLEMENTED'
          } >> "$GITHUB_STEP_SUMMARY"
