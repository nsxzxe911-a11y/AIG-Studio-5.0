      - name: Offline production bundle includes new standalone editor
        run: |
          npm run build
          test -s dist/aig-multiview-fusion-7-10.mjs
          test -s dist/multiview-studio.html
          test -s dist/multiview-studio.mjs
          cmp aig-multiview-fusion-7-10.mjs dist/aig-multiview-fusion-7-10.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real two decoded video frames and physical XYZ phone desktop evidence
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig710-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-multiview-fusion-7-10.real-browser.mjs
      - uses: actions/upload-artifact@v4
