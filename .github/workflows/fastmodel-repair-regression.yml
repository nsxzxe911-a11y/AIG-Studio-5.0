          if-no-files-found: warn
      - name: Truth labels
        if: always()
        run: |
          {
            echo 'VERIFIED_TRUE_SPATIAL_XYZ_HEAD_NECK_MOTION=SYNTHETIC_NUMERIC'
            echo 'ACTUAL_HUMAN_3D_HEAD_DEPTH=NOT_VERIFIED'
            echo 'REAL_HAIR_STRAND_PHYSICS=NOT_VERIFIED'
            echo 'FULL_CHARACTER_AND_REFERENCE_LIKENESS=NOT_APPROVED'
            echo 'NATIVE_APK_EXE_GPU_FPS=NOT_VERIFIED'
            echo 'MMO_MULTIPLAYER=NOT_IMPLEMENTED'
          } >> "$GITHUB_STEP_SUMMARY"

  continuous-scan-7-9:
    name: Independent 7.9 local video camera continuous scan Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
