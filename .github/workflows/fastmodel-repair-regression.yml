      - name: Offline package keeps source and prior versions
        run: |
          npm run build
          test -s dist/spatial-studio.html
          test -s dist/spatial-studio.mjs
          test -s dist/aig-spatial-rig-7-8.mjs
          cmp aig-spatial-rig-7-8.mjs dist/aig-spatial-rig-7-8.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
