name: FastModel repair regression (not character approval)
on:
  pull_request:
    paths:
      - 'formal-web/school-3d/fastmodel/single-photo/**'
      - '.github/workflows/fastmodel-repair-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - id: browser_runtime
        name: Real browser workflows and independent output evidence
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/fastmodel-http.log 2>&1 &
          aig_http_pid=$!
          trap 'kill "$aig_http_pid" 2>/dev/null || true' EXIT
          node tests/aig-compact-ui-real-browser.mjs
          node tests/aig-generation-state-real-browser.mjs
          node tests/aig-reverse-7-0-real-browser.mjs
          node tests/aig-implicit-volume-7-1.real-browser.mjs
          node tests/aig-volumetric-deform-7-2.real-browser.mjs
          node tests/aig-face-material-7-3.real-browser.mjs
          node tests/aig-avatar-rig-7-4.real-browser.mjs
          node tests/aig-landmark-rig-7-5.real-browser.mjs
          node tests/aig-face-depth-7-6.real-browser.mjs
          node tests/aig-hair-neck-7-7.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-browser-regression-not-heroine-approval
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-compact-ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-0-real-pixel-numeric-browser-not-character-approval
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-reverse-7-0/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-1-implicit-volume-not-human-3D
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-implicit-7-1/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-2-XYZ-Tetra-PBD-Not-Human-Approval
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-volumetric-7-2/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-3-Reviewed-Photo-Makeup-Not-Human-3D
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-face-makeup-7-3/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-4-Game-Avatar-3D-Expression-Not-MMO-Live
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-avatar-7-4/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-5-Reviewed-Photo-Landmark-XYZ-Not-Human-Approval
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-landmarks-7-5/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-6-3D-Depth-Prior-Not-Photogrammetry
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-depth-7-6/
          if-no-files-found: warn

      - name: Distinguish real video playback from unverified character animation
        if: always()
        env:
          BROWSER_RESULT: ${{ steps.browser_runtime.outcome }}
        run: |
          {
            echo '### FastModel browser regression at SHA ${{ github.sha }}'
            echo "Browser / independent output: $BROWSER_RESULT"
            echo 'On failure inspect matching phone/desktop failure-evidence.json and failure.png.'
            echo 'CANVAS_PIXEL_MOVEMENT_NE_HUMAN_BODY_JOINT_MOVEMENT'
            echo 'REAL_HEROINE_3D=NOT_CERTIFIED'
            echo 'RELEASE=BLOCKED'
          } >> "$GITHUB_STEP_SUMMARY"

  landmark-7-5:
    name: Independent reviewed-photo XYZ rig gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Real manual photo point and XYZ numerical geometry tests
        run: |
          node --check aig-landmark-rig-7-5.mjs
          node --check landmark-studio.mjs
          node --test tests/aig-landmark-rig-7-5.test.mjs
      - name: Verify offline viewer source
        run: |
          npm run build
          test -s dist/landmark-studio.html
          test -s dist/landmark-studio.mjs
          test -s dist/aig-landmark-rig-7-5.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Phone/desktop Chromium 10-point source review and 3D ray Gate
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/aig75-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/aig-landmark-rig-7-5.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-5-Isolated-Photo-XYZ-Validation
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-landmarks-7-5/
          if-no-files-found: warn
      - name: Distinguish 3D numerical proof from true face quality and legacy suite
        if: always()
        run: |
          {
            echo 'FastModel 7.5 independent 3D reviewed-landmark test, separate from legacy UI regression.'
            echo 'ORIGINAL_PHOTO_LANDMARKS_USER_REVIEWED=REQUIRED'
            echo 'TRUE_ANATOMICAL_HEAD=NOT_VERIFIED'
            echo 'REAL_HEROINE_FACE=NOT_CERTIFIED'
            echo 'MMO_MULTIPLAYER=NOT_IMPLEMENTED'
          } >> "$GITHUB_STEP_SUMMARY"

  depth-7-6:
    name: Independent source-photo estimated-depth XYZ gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Real estimated depth numerical shape/roundtrip tests
        run: |
          node --check aig-face-depth-7-6.mjs
          node --check depth-studio.mjs
          node --test tests/aig-face-depth-7-6.test.mjs
      - name: Offline viewer production source copy
        run: |
          npm run build
          test -s dist/depth-studio.html
          test -s dist/depth-studio.mjs
          test -s dist/aig-face-depth-7-6.mjs
          cmp aig-face-depth-7-6.mjs dist/aig-face-depth-7-6.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real phone/desktop estimated nose/eye/lip Z depth browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/aig76-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-face-depth-7-6.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-6-Isolated-Estimated-Z-Depth-Evidence
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-depth-7-6/
          if-no-files-found: warn
      - name: Truth gate
        if: always()
        run: |
          {
            echo 'SOURCE_PHOTO_2D_POINTS=MANUALLY_REVIEWED'
            echo 'THREE_DIMENSIONAL_Z_PRIORS=EXPLICIT_ESTIMATES_NOT_CAMERA_MEASUREMENTS'
            echo 'REAL_ANATOMICAL_HUMAN_FACE=NOT_VERIFIED'
            echo 'REAL_HAIR_NECK_CONTINUITY=NOT_VERIFIED'
            echo 'FASTMODEL_NATIVE_APK_EXE=NOT_VERIFIED'
            echo 'MMO_ONLINE=NOT_IMPLEMENTED'
          } >> "$GITHUB_STEP_SUMMARY"

  hair-neck-7-7:
    name: Independent 7.7 hair-neck source/XYZ occlusion gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Real binary source hair/neck region and XYZ occlusion tests
        run: |
          node --check aig-hair-neck-7-7.mjs
          node --check occlusion-studio.mjs
          node --check tests/aig-hair-neck-7-7.real-browser.mjs
          node --test tests/aig-hair-neck-7-7.test.mjs
      - name: Standalone offline renderer includes hair-neck UI
        run: |
          npm run build
          test -s dist/occlusion-studio.html
          test -s dist/occlusion-studio.mjs
          test -s dist/aig-hair-neck-7-7.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real phone and desktop local photo hair/neck brush test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig77-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-hair-neck-7-7.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastModel-7-7-Source-Hair-Neck-XYZ-Not-Final-Human
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-hair-neck-7-7/
          if-no-files-found: warn
      - name: Explicit anti-fake gate
        if: always()
        run: |
          {
            echo 'SOURCE_HAIR_NECK_REGION=USER_REVIEW_REQUIRED'
            echo 'SOURCE_CONNECTED_HEAD_NECK_MASK=TESTED'
            echo 'TRUE_WORLD_XYZ_LAYER_DEPTH=ESTIMATED'
            echo 'ORIGINAL_HAIR_FIBERS_SKIN_PHYSICS=NOT_VERIFIED'
            echo 'APPROVED_USER_CHARACTER=NOT_VERIFIED'
            echo 'NATIVE_APK_EXE=NOT_VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"
