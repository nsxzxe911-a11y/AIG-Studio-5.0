          test -s dist/continuous-studio.mjs
          test -s dist/aig-continuous-scan-7-9.mjs
          cmp aig-continuous-scan-7-9.mjs dist/aig-continuous-scan-7-9.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real local WebM and getUserMedia continuous capture on phone desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/aig79-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
