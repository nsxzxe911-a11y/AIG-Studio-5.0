          name: FastModel-7-7-Source-Hair-Neck-XYZ-Not-Final-Human
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/fastmodel-hair-neck-7-7/
          if-no-files-found: warn
      - name: Explicit anti-fake gate
        if: always()
        run: |
          {
            echo 'SOURCE_HAIR_NECK_REGION=USER_REVIEW_REQUIRED'
            echo 'SOURCE_CONNECTED_HEAD_NECK_MASK=TESTED'
            echo 'TRUE_WORLD_XYZ_LAYER_DEPTH=ESTIMATED'
            echo 'ORIGINAL_HAIR_FIBERS_SKIN_PHYSICS=NOT_VERIFIED'
            echo 'APPROVED_USER_CHARACTER=NOT_VERIFIED'
            echo 'NATIVE_APK_EXE=NOT_VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"

  spatial-7-8:
