name: NC Semantic Timeline Gate

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'app/src/main/java/com/aigstudio/app/MainActivity.kt'
      - 'desktop/src/main/kotlin/com/aigstudio/desktop/DesktopApp.kt'
      - 'release-version.properties'
      - '.github/workflows/nc-semantic-timeline-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and run core regression three times
        shell: bash
        run: |
          : > semantic-timeline.log
          for pass in 1 2 3; do
            echo "=== CORE REGRESSION PASS $pass/3 ===" | tee -a semantic-timeline.log
            gradle :core:coreRegression --no-daemon --stacktrace | tee semantic-pass-$pass.log
            cat semantic-pass-$pass.log >> semantic-timeline.log
          done
      - name: Verify semantic authority and execution timeline
        shell: bash
        run: |
          grep -Fq 'NC_SEMANTIC_AUTHORITY_PASS' semantic-timeline.log
          grep -Fq 'NC_EXECUTION_TIMELINE_PASS' semantic-timeline.log
          grep -Fq 'NC_3D_ANIMATION_BRIDGE_PASS' semantic-timeline.log
          grep -Fq 'ALL TESTS PASSED' semantic-timeline.log
          grep -Fq 'NC_MODAL_EVIDENCE_NO_TRUNCATION_PASS' semantic-timeline.log
          grep -Fq 'NC_RUNTIME_INTERLOCK_PASS' semantic-timeline.log
          grep -Fq 'NC_MACHINE_ALARM_RECOVERY_PASS' semantic-timeline.log
          grep -Fq 'NC_MACHINE_BOUNDARY_MATRIX_PASS' semantic-timeline.log
          grep -Fq 'NC_MACHINE_STABILITY_STRESS_PASS' semantic-timeline.log
          grep -Fq 'NC_PARSER_CONFLICT_STRESS_PASS' semantic-timeline.log
          grep -Fq 'NC_TIMELINE_LINEAR_PRECOMPUTE_PASS' semantic-timeline.log
          test "$(grep -Fc 'NC_TIMELINE_LINEAR_PRECOMPUTE_PASS' semantic-timeline.log)" -eq 3
          test "$(grep -Fc 'NC_PARSER_CONFLICT_STRESS_PASS' semantic-timeline.log)" -eq 3
          test "$(grep -Fc 'ALL TESTS PASSED' semantic-timeline.log)" -eq 3
          test "$(grep -Fc 'NC_MACHINE_STABILITY_STRESS_PASS' semantic-timeline.log)" -eq 3
          echo 'STUDIO_NC_SEMANTIC_TIMELINE_GATE=PASS'
      - name: Install Android SDK 36 for UI compile
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android and Windows UI surfaces
        shell: bash
        run: |
          gradle :app:assembleDebug :desktop:compileKotlin --no-daemon --stacktrace | tee ui-compile.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'STUDIO_NC_UI_COMPILE_GATE=PASS'
