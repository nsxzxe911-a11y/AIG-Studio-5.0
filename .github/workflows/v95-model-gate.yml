name: AIG V95 Complete 6AX HOME Model Gate
on:
  push:
    branches: [integration/v95-home-6ax-model-correction]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check formal-web/runtime/v93-home-glb-viewer.js
      - run: node formal-web/qa/v95-model-integrity.cjs
      - run: python3 formal-web/zoo-6ax/validate-v93-glb.py
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory formal-web >/tmp/aig-v95-http.log 2>&1 &
          sleep 2
      - run: node formal-web/qa/v95-model-visual-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-V95-COMPLETE-HOME-6AX-4K-S23
          path: artifacts/v95/
          if-no-files-found: warn
