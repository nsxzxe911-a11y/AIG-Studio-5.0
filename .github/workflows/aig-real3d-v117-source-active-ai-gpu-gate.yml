name: Real3D V117 Source-Evidence Autonomous Planner & Five Real GPU Poses
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v117-*'
      - 'formal-web/shared-3d/aig-real3d-v109-photo-surface-ui.mjs'
      - 'formal-web/shared-3d/aig-real3d-v109-photo-surface-lab.html'
      - 'formal-web/shared-3d/tests/aig-real3d-v117-*'
      - 'docs/REAL3D-V117-*'
      - '.github/workflows/aig-real3d-v117-source-active-ai-gpu-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v117-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evidence-planning-without-fake-neural:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real V110/V111 source segmentation, independent-mask provenance and actual GPU frame authority
        run: |
          node --check formal-web/shared-3d/aig-real3d-v117-evidence-orchestrator.mjs
          node --check formal-web/shared-3d/aig-real3d-v109-photo-surface-ui.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v117-evidence-orchestrator.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v117-evidence-orchestrator.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v111-seeded-segmentation.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v110-source-mask.test.mjs
  chromium-actual-five-pose-source-control:
    needs: evidence-planning-without-fake-neural
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install genuine browser and GL context
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: V117 one-click real PNG/GLB, V107 five GPU poses, reject complex and unobserved 1to1
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v117-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v109-photo-surface-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v117-evidence-orchestrator.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-v109-photo-surface.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V117-True-Autonomous-Source-to-GLB-Five-GPU-Pose-Proof
          path: |
            artifacts/aig-real3d-v117/
            artifacts/aig-real3d-v109/
          if-no-files-found: warn
