name: AIG Studio 588 verified dispatcher

on:
  push:
    branches:
      - ops/dispatch-studio-588-3bdeed

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/studio-588-3bdeed
      - name: Pin verified release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3bdeed6cb4a504a65b23ba9ad355ba34d2af0e9b"
          echo 'STUDIO_588_TARGET_SHA=3bdeed6cb4a504a65b23ba9ad355ba34d2af0e9b'
      - name: Dispatch formal builder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/dispatch-body.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-download.yml/dispatches" \
            -d '{"ref":"release/studio-588-3bdeed"}')"
          cat /tmp/dispatch-body.txt || true
          test "$code" = '204'
          echo 'STUDIO_588_FORMAL_DISPATCH=PASS|REF=release/studio-588-3bdeed|SHA=3bdeed6cb4a504a65b23ba9ad355ba34d2af0e9b'
