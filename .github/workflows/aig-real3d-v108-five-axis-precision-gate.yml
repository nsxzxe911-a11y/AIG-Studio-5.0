name: Real3D V108 FastModel 5AX 625-Pose Millimeter Precision and Original GPU Baseline
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v108-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v108-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v107-vs-v106-baseline.real-browser.mjs'
      - 'formal-web/shared-3d/aig-real3d-v107-five-axis-foot-head.mjs'
      - 'docs/REAL3D-V108-*'
      - '.github/workflows/aig-real3d-v108-five-axis-precision-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v108-precision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-precision-625:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify real A/B transformations, source clips, 0.001 mm and original XYZ immutable
        run: |
          node --check formal-web/shared-3d/aig-real3d-v108-five-axis-precision.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v108-five-axis-precision.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v108-five-axis-precision.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v107-five-axis-foot-head.test.mjs
  original-glb-chromium-gpu-regression:
    needs: source-precision-625
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium GPU software backend
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: V107 baseline real WebGL same-source pixel zero check is still passing
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v108-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v99-native-source-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v107-vs-v106-baseline.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V108-Original-GLB-True-GPU-Regression-Not-Human-Likeness
          path: artifacts/aig-real3d-v107-vs-original/
          if-no-files-found: warn
