name: AIG Studio 5.0 Android Build + Runtime Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aig-studio-android-runtime-gate
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    defaults:
      run:
        working-directory: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Security update and antivirus gate
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=app/src/main/AndroidManifest.xml
          SECURE=app/src/main/java/com/aigstudio/app/SecureServices.kt
          MAIN=app/src/main/java/com/aigstudio/app/MainActivity.kt
          grep -Fq 'android.permission.INTERNET' "$MANIFEST"
          grep -Fq 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -Fq 'SHA256withRSA' "$SECURE"
          grep -Fq 'MessageDigest.getInstance("SHA-256")' "$SECURE"
          grep -Fq 'APK signing certificate mismatch' "$SECURE"
          grep -Fq 'object AppSecurityScanner' "$SECURE"
          grep -Fq 'Executable magic=' "$SECURE"
          grep -Fq 'SecureUpdateManager.autoCheck' "$MAIN"
          grep -Fq 'AppSecurityScanner.scan' "$MAIN"
          grep -Fq 'ChatGPT AI 更新' "$MAIN"
          if grep -Fq 'AI 自動更新' "$MAIN"; then
            echo 'BLOCKED: legacy AI update wording found'
            exit 71
          fi
          if grep -R --include='*.kt' -n 'http://' app/src/main/java; then
            echo 'BLOCKED: clear-text URL found'
            exit 70
          fi
          echo 'STUDIO_SECURITY_UPDATE_GATE=PASS'

      - name: 2D CNC thousandth ruler gate
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/aigstudio/app/MainActivity.kt
          grep -Fq 'private fun cncRulerStepMm()' "$MAIN"
          grep -Fq 'drawCncThousandthRulers(canvas, stepMm)' "$MAIN"
          grep -Fq '顯示 0.000' "$MAIN"
          grep -Fq '精度 0.001 mm' "$MAIN"
          grep -Fq 'DisplayFormat.mm(lastWorld.x)' "$MAIN"
          grep -Fq 'DisplayFormat.mm(lastWorld.y)' "$MAIN"
          echo 'STUDIO_2D_CNC_THOUSANDTH_RULER_GATE=PASS'

      - name: Run 0.001 mm core regression
        run: bash scripts/run_core_tests.sh

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIGStudio5_B001.apk

      - name: Record APK outer and payload digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum AIGStudio5_B001.apk | tee APK_OUTER_SHA256.txt
          python3 -c 'import hashlib,zipfile; apk="AIGStudio5_B001.apk"; z=zipfile.ZipFile(apk); rows=[f"{hashlib.sha256(z.read(n)).hexdigest()}  {len(z.read(n)):>10}  {n}" for n in sorted(z.namelist()) if not n.endswith("/")]; open("APK_PAYLOAD_SHA256.txt","w",encoding="utf-8").write("\n".join(rows)+"\n"); print(f"APK_PAYLOAD_ENTRIES={len(rows)}")'
          test -s APK_OUTER_SHA256.txt
          test -s APK_PAYLOAD_SHA256.txt

      - name: Prepare runtime evidence directory
        shell: bash
        run: mkdir -p runtime-evidence

      - name: Install emulator runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Enable Android emulator KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "BLOCKED: /dev/kvm is unavailable on this runner"
            exit 42
          fi

      - name: Install and launch on Pixel Google APIs emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          emulator-boot-timeout: 720
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/studio_android_runtime_3d_gate.sh"
      - name: Upload APK and runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIGStudio5_B001
          path: |
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/AIGStudio5_B001.apk
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/APK_OUTER_SHA256.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/APK_PAYLOAD_SHA256.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/runtime-evidence/**
          if-no-files-found: error
