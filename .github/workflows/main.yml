name: Build AIGStudio5 B001 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run 0.001 mm core regression
        run: bash scripts/run_core_tests.sh

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIGStudio5_B001.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIGStudio5_B001
          path: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/AIGStudio5_B001.apk
          if-no-files-found: error
