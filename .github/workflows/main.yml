name: AIG Studio 5.0 Android Build + Runtime Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aig-studio-android-runtime-gate
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    defaults:
      run:
        working-directory: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run 0.001 mm core regression
        run: bash scripts/run_core_tests.sh

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIGStudio5_B001.apk

      - name: Record APK outer and payload digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum AIGStudio5_B001.apk | tee APK_OUTER_SHA256.txt
          python3 -c 'import hashlib,zipfile; apk="AIGStudio5_B001.apk"; z=zipfile.ZipFile(apk); rows=[f"{hashlib.sha256(z.read(n)).hexdigest()}  {len(z.read(n)):>10}  {n}" for n in sorted(z.namelist()) if not n.endswith("/")]; open("APK_PAYLOAD_SHA256.txt","w",encoding="utf-8").write("\n".join(rows)+"\n"); print(f"APK_PAYLOAD_ENTRIES={len(rows)}")'
          test -s APK_OUTER_SHA256.txt
          test -s APK_PAYLOAD_SHA256.txt

      - name: Prepare runtime evidence directory
        shell: bash
        run: mkdir -p runtime-evidence

      - name: Install emulator runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Enable Android emulator KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "BLOCKED: /dev/kvm is unavailable on this runner"
            exit 42
          fi

      - name: Install and launch on Pixel Google APIs emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          emulator-boot-timeout: 720
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            APP_DIR="$GITHUB_WORKSPACE/AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0"
            APK="$APP_DIR/AIGStudio5_B001.apk"
            EVIDENCE="$APP_DIR/runtime-evidence"

            adb wait-for-device
            for i in $(seq 1 120); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            adb shell wm size 1080x2340
            adb shell wm density 425
            adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
            adb shell settings put system user_rotation 0 >/dev/null 2>&1 || true
            adb shell settings put system font_scale 1.0 >/dev/null 2>&1 || true

            adb install --no-streaming -r "$APK"
            adb shell am force-stop com.aigstudio.app
            adb shell am start -W -n com.aigstudio.app/.MainActivity | tee "$EVIDENCE/ANDROID_START.txt"

            alive=false
            for i in $(seq 1 30); do
              adb shell pidof com.aigstudio.app > "$EVIDENCE/PID.txt" 2>/dev/null || true
              adb shell dumpsys activity activities > "$EVIDENCE/ACTIVITY.txt" 2>/dev/null || true
              if [ -s "$EVIDENCE/PID.txt" ] && grep -Fq 'com.aigstudio.app/.MainActivity' "$EVIDENCE/ACTIVITY.txt"; then
                alive=true
                break
              fi
              sleep 2
            done
            test "$alive" = true

            dumped=false
            for i in $(seq 1 12); do
              adb shell rm -f /data/local/tmp/aigstudio-ui.xml >/dev/null 2>&1 || true
              if adb shell uiautomator dump /data/local/tmp/aigstudio-ui.xml >/dev/null 2>&1; then
                if adb exec-out cat /data/local/tmp/aigstudio-ui.xml > "$EVIDENCE/UI.xml" 2>/dev/null && grep -q '<hierarchy' "$EVIDENCE/UI.xml"; then
                  dumped=true
                  break
                fi
              fi
              sleep 2
            done
            test "$dumped" = true
            grep -Fq 'AIG Studio 5.0' "$EVIDENCE/UI.xml"
            grep -Fq '繪圖' "$EVIDENCE/UI.xml"

            tap_ui_text() {
              label="$1"
              adb shell rm -f /data/local/tmp/aigstudio-action.xml >/dev/null 2>&1 || true
              adb shell uiautomator dump /data/local/tmp/aigstudio-action.xml >/dev/null
              adb exec-out cat /data/local/tmp/aigstudio-action.xml > "$EVIDENCE/UI_ACTION.xml"
              coords="$(python3 - "$label" "$EVIDENCE/UI_ACTION.xml" <<'PY'
import re, sys, xml.etree.ElementTree as ET
label=sys.argv[1]
path=sys.argv[2]
root=ET.parse(path).getroot()
for n in root.iter("node"):
    text=n.attrib.get("text","")
    desc=n.attrib.get("content-desc","")
    if text==label or desc==label:
        m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", n.attrib.get("bounds",""))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2, (y1+y2)//2)
            raise SystemExit(0)
raise SystemExit(2)
PY
)"
              test -n "$coords"
              adb shell input tap $coords
              sleep 1
            }

            tap_ui_text "矩形"
            adb shell input tap 300 600
            adb shell input tap 760 1250
            sleep 1
            tap_ui_text "加工 ＋"
            tap_ui_text "3D 加工"

            for i in $(seq 1 12); do
              adb shell uiautomator dump /data/local/tmp/aigstudio-3d.xml >/dev/null 2>&1 || true
              adb exec-out cat /data/local/tmp/aigstudio-3d.xml > "$EVIDENCE/UI_3D.xml" 2>/dev/null || true
              if grep -Fq 'RGB 真 3D 加工' "$EVIDENCE/UI_3D.xml" && grep -Fq 'TRUE 3D' "$EVIDENCE/UI_3D.xml"; then
                break
              fi
              sleep 1
            done
            grep -Fq 'RGB 真 3D 加工' "$EVIDENCE/UI_3D.xml"
            grep -Fq 'TRUE 3D' "$EVIDENCE/UI_3D.xml"
            adb exec-out screencap -p > "$EVIDENCE/TRUE_3D_BEFORE.png"
            adb shell input swipe 300 650 760 820 450
            sleep 1
            adb exec-out screencap -p > "$EVIDENCE/TRUE_3D_AFTER.png"
            test -s "$EVIDENCE/TRUE_3D_BEFORE.png"
            test -s "$EVIDENCE/TRUE_3D_AFTER.png"
            if cmp -s "$EVIDENCE/TRUE_3D_BEFORE.png" "$EVIDENCE/TRUE_3D_AFTER.png"; then
              echo "STUDIO_TRUE_3D_INTERACTION=FAIL"
              exit 66
            fi
            echo "STUDIO_TRUE_3D_INTERACTION=PASS" | tee "$EVIDENCE/TRUE_3D_GATE.txt"

            adb exec-out screencap -p > "$EVIDENCE/STARTUP.png"
            test -s "$EVIDENCE/STARTUP.png"
            adb logcat -d -t 600 > "$EVIDENCE/LOGCAT.txt" 2>/dev/null || true

            {
              echo "ANDROID_EMULATOR_PROFILE=GOOGLE_APIS_PIXEL_7"
              adb shell wm size
              adb shell wm density
              echo "USER_ROTATION=$(adb shell settings get system user_rotation | tr -d '\r')"
              echo "FONT_SCALE=$(adb shell settings get system font_scale | tr -d '\r')"
              echo "STUDIO_ANDROID_RUNTIME_GATE=PASS"
            } | tee "$EVIDENCE/RUNTIME_GATE.txt"

            grep -Eq 'Override size: 1080x2340|Physical size: 1080x2340' "$EVIDENCE/RUNTIME_GATE.txt"
            grep -Eq 'Override density: 425|Physical density: 425' "$EVIDENCE/RUNTIME_GATE.txt"

      - name: Upload APK and runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIGStudio5_B001
          path: |
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/AIGStudio5_B001.apk
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/APK_OUTER_SHA256.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/APK_PAYLOAD_SHA256.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/runtime-evidence/**
          if-no-files-found: error
