name: Build AIGStudio5 B001 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run 0.001 mm core regression
        run: bash scripts/run_core_tests.sh

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIGStudio5_B001.apk

      - name: Record APK outer and payload digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum AIGStudio5_B001.apk | tee APK_OUTER_SHA256.txt
          python3 - <<'PY'
import hashlib, zipfile
apk="AIGStudio5_B001.apk"
with zipfile.ZipFile(apk) as z:
    rows=[]
    for name in sorted(z.namelist()):
        if name.endswith("/"):
            continue
        data=z.read(name)
        rows.append(f"{hashlib.sha256(data).hexdigest()}  {len(data):>10}  {name}")
with open("APK_PAYLOAD_SHA256.txt","w",encoding="utf-8") as f:
    f.write("\n".join(rows)+"\n")
print(f"APK_PAYLOAD_ENTRIES={len(rows)}")
PY
          test -s APK_OUTER_SHA256.txt
          test -s APK_PAYLOAD_SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIGStudio5_B001
          path: |
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/AIGStudio5_B001.apk
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/APK_OUTER_SHA256.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/APK_PAYLOAD_SHA256.txt
          if-no-files-found: error
