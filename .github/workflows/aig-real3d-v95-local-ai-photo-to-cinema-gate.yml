name: Real3D V95 Local Auto Photo-to-3D and Cinema Gate

on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v95-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v95-*'
      - 'docs/REAL3D-V95-*'
      - '.github/workflows/aig-real3d-v95-local-ai-photo-to-cinema-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real3d-v95-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V95 actual auto portrait candidate and original identity Gate
        run: |
          node --check formal-web/shared-3d/aig-real3d-v95-photo-vision.mjs
          node --check formal-web/shared-3d/aig-real3d-v95-provisional-rig.mjs
          node --check formal-web/shared-3d/aig-real3d-v95-ai-orchestrator.mjs
          node --check formal-web/shared-3d/aig-real3d-v95-auto-film-lab.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v95-auto-film.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v95-auto-pipeline.test.mjs
  real-native-gpu:
    needs: local-source
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium real WebGL
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: V95 true source candidate indexed XYZ, skinned motion, GPU PNG SHA
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v95-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v95-auto-film-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v95-auto-film.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V95-Original-Image-3D-Skin-GPU-Evidence
          path: artifacts/aig-real3d-v95-photo-to-3d/
          if-no-files-found: warn
