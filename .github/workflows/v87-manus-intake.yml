name: AIG V87 Manus Candidate Intake Gate
on:
  push:
    branches:
      - web/aig-dual-formal-runtime-20261016
    paths:
      - 'formal-web/integrations/manus-v87/**'
      - '.github/workflows/v87-manus-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manus-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate intake checker syntax
        run: node --check formal-web/integrations/manus-v87/intake-check.cjs
      - name: Report provenance and blocked external source state
        run: node formal-web/integrations/manus-v87/intake-check.cjs > manus-v87-intake-report.json
      - name: Enforce machine-output blocked and no false import claim
        run: |
          node -e '
            const fs=require("node:fs");
            const r=JSON.parse(fs.readFileSync("manus-v87-intake-report.json","utf8"));
            if(r.machineOutput!=="BLOCKED")process.exit(1);
            if(r.status==="BLOCKED_MANUS_SOURCE_MISSING"){console.log("SOURCE INTAKE BLOCKED: awaiting real Manus ZIP; not a UI/CORE PASS");}
            else if(r.status==="READY_FOR_MANUAL_UI_DIFF"){console.log("Candidate present; manual source review is still required");}
            else {console.log("Candidate requires review: "+r.status);}
          '
      - name: Safe source integrity strict gate (only after complete source files exist)
        run: |
          node -e '
            const fs=require("node:fs");
            const r=JSON.parse(fs.readFileSync("manus-v87-intake-report.json","utf8"));
            if(r.received===r.expected)process.exit(0);
            console.log("Strict source Gate NOT RUN: received "+r.received+"/"+r.expected);
          '
          if [ -f formal-web/integrations/manus-v87/candidate/app.js ]; then
            node formal-web/integrations/manus-v87/intake-check.cjs --strict
          fi
      - name: Upload exact intake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aig-v87-manus-intake-report
          path: manus-v87-intake-report.json
          if-no-files-found: warn
