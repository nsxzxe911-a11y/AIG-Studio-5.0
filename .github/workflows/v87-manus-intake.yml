name: AIG V87 Manus Candidate Intake Gate
on:
  push:
    branches: [web/aig-dual-formal-runtime-20261016]
    paths:
      - 'formal-web/integrations/manus-v87/**'
      - '.github/workflows/v87-manus-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manus-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify final design delivery ZIP with unchanged original source
        run: python3 formal-web/integrations/manus-v87/verify-final-design.py | tee manus-v87-final-report.json
      - name: Verify original Manus ZIP and extract only authorized source files
        run: python3 formal-web/integrations/manus-v87/extract-source.py
      - name: Validate JS source and source intake checker syntax
        run: |
          node --check formal-web/integrations/manus-v87/intake-check.cjs
          node --check formal-web/integrations/manus-v87/candidate/app.js
          node --check formal-web/integrations/manus-v87/candidate/server.js
      - name: Strict static source provenance, route and CNC safety Gate
        run: |
          node formal-web/integrations/manus-v87/intake-check.cjs --strict | tee manus-v87-intake-report.json
      - name: Eleven isolated routes HTTP smoke test
        shell: bash
        run: |
          cd formal-web/integrations/manus-v87/candidate
          PORT=8769 node server.js >/tmp/aig-v87-manus-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          for path in / /cad /cam /sim /3ax /4ax /5ax /6ax /nc /ai /toolpath; do
            curl --fail --silent --show-error -o /dev/null "http://127.0.0.1:8769$path"
            echo "HTTP 200: $path"
          done
      - name: Report and source provenance (candidate only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aig-v87-manus-original-source-intake
          path: |
            manus-v87-intake-report.json
            manus-v87-final-report.json
            formal-web/integrations/manus-v87/source-integrity.json
          if-no-files-found: warn
      - name: Gate boundary
        run: echo "MANUS SOURCE INTAKE ONLY; UI is isolated. Release, CNC material removal and machine output are NOT verified."
