name: AIG Studio 5.0 Dual-Platform FINAL Gate

on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read

concurrency:
  group: aig-studio-dual-platform-final-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dual-platform-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for same-revision platform gates
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dual-final-evidence
          : > dual-final-evidence/DUAL_PLATFORM_RUNS.txt

          wait_gate() {
            workflow="$1"
            label="$2"
            var_name="$3"
            for attempt in $(seq 1 80); do
              row="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 40 --json databaseId,status,conclusion,headSha --jq '.[] | select(.headSha=="'"$SOURCE_SHA"'") | [.databaseId,.status,.conclusion,.headSha] | @tsv' | head -1)"
              if [ -n "$row" ]; then
                run_id="$(printf '%s' "$row" | cut -f1)"
                status="$(printf '%s' "$row" | cut -f2)"
                conclusion="$(printf '%s' "$row" | cut -f3)"
                echo "$label|attempt=$attempt|run=$run_id|status=$status|conclusion=$conclusion|sha=$SOURCE_SHA" | tee -a dual-final-evidence/DUAL_PLATFORM_RUNS.txt
                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" != "success" ]; then
                    echo "$label=FAIL|run=$run_id|conclusion=$conclusion" | tee -a dual-final-evidence/DUAL_PLATFORM_FINAL_GATE.txt
                    return 1
                  fi
                  printf '%s=%s\n' "$var_name" "$run_id" >> "$GITHUB_ENV"
                  echo "$label=PASS|run=$run_id" | tee -a dual-final-evidence/DUAL_PLATFORM_FINAL_GATE.txt
                  return 0
                fi
              else
                echo "$label|attempt=$attempt|run=NONE|sha=$SOURCE_SHA" | tee -a dual-final-evidence/DUAL_PLATFORM_RUNS.txt
              fi
              sleep 15
            done
            echo "$label=TIMEOUT|sha=$SOURCE_SHA" | tee -a dual-final-evidence/DUAL_PLATFORM_FINAL_GATE.txt
            return 1
          }

          wait_gate main.yml ANDROID_RUNTIME ANDROID_RUNTIME_RUN
          wait_gate windows-runtime.yml WINDOWS_INSTALL WINDOWS_RUN
          wait_gate android-signed-release.yml ANDROID_SIGNED ANDROID_SIGNED_RUN

      - name: Download and verify FINAL artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dual-final-artifacts/android dual-final-artifacts/windows

          gh run download "$ANDROID_SIGNED_RUN" -R "$GITHUB_REPOSITORY"             -n AIG_Studio_5_0_RGB_FULL_RELEASE_APK             -D dual-final-artifacts/android

          gh run download "$WINDOWS_RUN" -R "$GITHUB_REPOSITORY"             -n AIG-Studio-5.0-Windows-Installable             -D dual-final-artifacts/windows

          APK="$(find dual-final-artifacts/android -type f -name 'AIG_Studio_5_0_RGB_FULL_RELEASE.apk' | head -1)"
          EXE="$(find dual-final-artifacts/windows -type f -name 'AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe' | head -1)"
          test -n "$APK" && test -s "$APK"
          test -n "$EXE" && test -s "$EXE"

          sha256sum "$APK" | tee dual-final-evidence/FINAL_APK_SHA256.txt
          sha256sum "$EXE" | tee dual-final-evidence/FINAL_EXE_SHA256.txt

          WIN_SOURCE="$(find dual-final-artifacts/windows -type f -name 'SOURCE_REVISION.txt' | head -1)"
          test -n "$WIN_SOURCE"
          grep -Fq "STUDIO_WINDOWS_SOURCE_SHA=$SOURCE_SHA" "$WIN_SOURCE"

          SIGN_GATE="$(find dual-final-artifacts/android -type f -name 'RELEASE_CERT_GATE.txt' | head -1)"
          test -n "$SIGN_GATE"
          grep -Fq 'STUDIO_ANDROID_SIGNING_IDENTITY=PASS' "$SIGN_GATE"

          {
            echo "AIG_STUDIO_DUAL_PLATFORM_FINAL=PASS"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "ANDROID_RUNTIME_RUN=$ANDROID_RUNTIME_RUN"
            echo "ANDROID_SIGNED_RUN=$ANDROID_SIGNED_RUN"
            echo "WINDOWS_RUN=$WINDOWS_RUN"
            echo "APK=AIG_Studio_5_0_RGB_FULL_RELEASE.apk"
            echo "EXE=AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe"
          } | tee -a dual-final-evidence/DUAL_PLATFORM_FINAL_GATE.txt

      - name: Upload dual-platform FINAL evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG_Studio_5_0_DUAL_PLATFORM_FINAL_EVIDENCE
          path: dual-final-evidence/**
          if-no-files-found: warn
          retention-days: 90
