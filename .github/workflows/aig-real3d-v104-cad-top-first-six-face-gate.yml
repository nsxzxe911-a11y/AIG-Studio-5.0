name: Real3D V104 CNC CAD Top-First Six-Face On-Demand Genuine XYZ Gate
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v104-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v104-*'
      - 'formal-web/shared-3d/aig-real3d-v99-native-source-lab.*'
      - 'docs/REAL3D-V104-*'
      - '.github/workflows/aig-real3d-v104-cad-top-first-six-face-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v104-cad-top-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-coordinate-and-lazy-faces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: V104 axis contract, top-first source projection, lazy original faces and provenance
        run: |
          node --check formal-web/shared-3d/aig-real3d-v104-cad-top-first.mjs
          node --check formal-web/shared-3d/aig-real3d-v99-native-source-lab.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v104-cad-top-first.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v99-native-model-ingest.test.mjs
  native-browser-sixface:
    needs: source-coordinate-and-lazy-faces
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install true Chromium + WebGL
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: V104 user-operable top CAD, genuine six-face CPU projections and one 3D GPU source
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v104-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v99-native-source-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v104-cad-top-first.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V104-CAD-Top-SixFace-Original-XYZ-Proof
          path: artifacts/aig-real3d-v104-cad/
          if-no-files-found: warn
