name: AIG V86 Desktop Mobile Browser Visual Gate
on:
  push:
    branches: [web/aig-dual-formal-runtime-20261016]
    paths:
      - 'formal-web/runtime/v86-*.js'
      - 'formal-web/v86-*.css'
      - 'formal-web/qa/v86-browser-gate.test.cjs'
      - 'formal-web/mobile-runtime.html'
      - '.github/workflows/v86-browser-visual-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local formal site
        run: |
          python3 -m http.server 8765 --directory formal-web > /tmp/aig86-http.log 2>&1 &
          echo $! > /tmp/aig86-http.pid
          sleep 2
      - name: Desktop and phone real Chromium DOM and screenshot Gate
        run: node formal-web/qa/v86-browser-gate.test.cjs
      - name: Always keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aig-v86-desktop-mobile-browser-evidence
          path: artifacts/v86/
          if-no-files-found: warn
      - name: CNC safety declaration
        if: success()
        run: echo "Browser layout test only; CAM material removal / CNC output Gate still BLOCKED pending numerical validation."
