name: AIG Studio 5.0 Windows Build Install Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aig-studio-windows-install-gate
  cancel-in-progress: true

jobs:
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Record exact source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Project = Join-Path $PWD 'AIG_Studio_5_0_UI_branch_update\AIG_Studio_5_0'
          $Evidence = Join-Path $Project 'windows-evidence'
          New-Item -ItemType Directory -Force $Evidence | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          "STUDIO_WINDOWS_SOURCE_SHA=$sha" | Tee-Object -FilePath (Join-Path $Evidence 'SOURCE_REVISION.txt')
          if ($sha -ne $env:GITHUB_SHA) { throw "Source SHA mismatch: $sha != $env:GITHUB_SHA" }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin and WiX
        shell: pwsh
        run: |
          choco install kotlinc -y
          choco install wixtoolset -y

      - name: Build true-core desktop and self-contained installer
        shell: pwsh
        run: |
          .\AIG_Studio_5_0_UI_branch_update\AIG_Studio_5_0\build_windows_native.ps1

      - name: Validate fresh install and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Project = Join-Path $PWD 'AIG_Studio_5_0_UI_branch_update\AIG_Studio_5_0'
          $Evidence = Join-Path $Project 'windows-evidence'
          New-Item -ItemType Directory -Force $Evidence | Out-Null
          $Installer = Join-Path $Project 'dist\windows-self-contained\AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe'
          if (-not (Test-Path $Installer)) { throw 'Studio Windows installer missing.' }
          Get-FileHash $Installer -Algorithm SHA256 | Format-List | Out-File (Join-Path $Evidence 'INSTALLER_SHA256.txt')

          $p = Start-Process -FilePath $Installer -ArgumentList '/quiet','/norestart' -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Studio install timeout'
          }
          if ($p.ExitCode -notin @(0,1641,3010)) { throw "Studio install failed: $($p.ExitCode)" }

          $candidates = @(
            "$env:ProgramFiles\AIG_Studio_5_0_RGB_FULL_RELEASE_PC\AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe",
            "$env:LOCALAPPDATA\AIG_Studio_5_0_RGB_FULL_RELEASE_PC\AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe"
          )
          $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) {
            foreach ($root in @($env:ProgramFiles,$env:LOCALAPPDATA)) {
              if ($root -and (Test-Path $root)) {
                $app = Get-ChildItem $root -Recurse -Filter 'AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
                if ($app) { break }
              }
            }
          }
          if (-not $app) { throw 'Studio installed launcher missing' }

          $dir = Join-Path $Evidence 'fresh_install_smoke'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $proc = Start-Process -FilePath $app -ArgumentList '--smoke' -WorkingDirectory $dir -PassThru
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Studio launch smoke timeout'
          }
          if ($proc.ExitCode -ne 0) { throw "Studio launch smoke failed: $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'desktop_smoke.txt'))) { throw 'Studio desktop smoke evidence missing' }
          Select-String -Path (Join-Path $dir 'desktop_smoke.txt') -Pattern 'STUDIO_WINDOWS_SMOKE=PASS' | Out-Null
          Get-FileHash $app -Algorithm SHA256 | Format-List | Out-File (Join-Path $dir 'INSTALLED_EXE_SHA256.txt')
          'STUDIO_WINDOWS_FRESH_INSTALL_LAUNCH=PASS' | Out-File (Join-Path $Evidence 'WINDOWS_INSTALL_GATE.txt')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Studio-5.0-Windows-Installable
          path: |
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/dist/windows-self-contained/AIG_Studio_5_0_RGB_FULL_RELEASE_PC.exe
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/dist/desktop_*.png
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/dist/desktop_smoke.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/dist/3D_RUNTIME_EVIDENCE.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/dist/REMOVED_CELLS.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/dist/3D_RUNTIME_SHA256.txt
            AIG_Studio_5_0_UI_branch_update/AIG_Studio_5_0/windows-evidence/**
          if-no-files-found: error
