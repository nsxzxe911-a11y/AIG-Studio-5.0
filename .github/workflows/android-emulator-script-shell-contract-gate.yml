name: Android emulator script shell contract gate

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015
    paths:
      - ci/verify_android_emulator_script_shell_contract.py
      - .github/workflows/android-emulator-script-shell-contract-gate.yml
      - .github/workflows/build-download.yml

permissions:
  contents: read

jobs:
  verify-shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify emulator POSIX shell contract
        run: python3 ci/verify_android_emulator_script_shell_contract.py
