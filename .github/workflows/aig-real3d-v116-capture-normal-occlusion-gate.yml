name: Real3D V116 Source Capture Normal and Occlusion 5AX GPU Gate
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v116-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v116-*'
      - 'formal-web/shared-3d/aig-real3d-v112-calibrated-multiview-ui.mjs'
      - 'formal-web/shared-3d/aig-real3d-v112-calibrated-multiview-lab.html'
      - 'formal-web/shared-3d/tests/aig-real3d-v114-verified-overlap-dedup.real-browser.mjs'
      - 'docs/REAL3D-V116-*'
      - '.github/workflows/aig-real3d-v116-capture-normal-occlusion-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v116-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  genuine-source-normal-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm V115 sources, camera manifests, actual normals and depth candidate fail closed
        run: |
          node --check formal-web/shared-3d/aig-real3d-v116-capture-normal-occlusion.mjs
          node --check formal-web/shared-3d/aig-real3d-v112-calibrated-multiview-ui.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v114-verified-overlap-dedup.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v116-capture-normal-occlusion.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v115-observed-boundary-atlas.test.mjs
  real-chromium-v116-5axis:
    needs: genuine-source-normal-and-capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install real headless Chromium browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Two synthetic calibrated scans V115/V116 normal+occlusion Gate then native GLB GPU
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v116-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v112-calibrated-multiview-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v114-verified-overlap-dedup.real-browser.mjs
          node formal-web/shared-3d/tests/aig-real3d-v112-calibrated-multiview.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V116-Source-Normal-Declared-Capture-FiveAxis-GPU-Evidence
          path: |
            artifacts/aig-real3d-v114/
            artifacts/aig-real3d-v112/
          if-no-files-found: warn
