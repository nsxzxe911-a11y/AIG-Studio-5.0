name: Studio 372 professional RGB runtime

on:
  push:
    branches:
      - professional-rgb-runtime-372

concurrency:
  group: studio-372-professional-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: studio-372-professional-${{ github.sha }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Professional RGB contract gate
        run: python3 ci/verify_professional_rgb_runtime.py
      - name: Professional live surface binding gate
        run: python3 ci/verify_professional_surface_binding.py

  release-init:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Create SHA-bound prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "AIG Studio 372 Professional RGB • ${GITHUB_SHA:0:12}" \
              --notes "Professional candidate built from exact SHA $GITHUB_SHA. Morning/canonical RGB skin + live Runtime callbacks/models. PASS is claimed only after APK/EXE launch evidence succeeds."

  android-apk:
    needs: release-init
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Verify professional contract
        run: |
          python3 ci/verify_professional_rgb_runtime.py
          python3 ci/verify_professional_surface_binding.py
      - name: Build Studio 372 installable APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./build_android_release.sh | tee studio-372-android-build.log
          test -s release/android/AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk
          cp release/android/AIG_Studio_5_0_RGB_FULL_INSTALLABLE.apk release/android/AIG_Studio_372_PROFESSIONAL_RGB.apk
          sha256sum release/android/AIG_Studio_372_PROFESSIONAL_RGB.apk | tee release/android/AIG_Studio_372_PROFESSIONAL_RGB.sha256
      - name: Enable emulator KVM access
        shell: bash
        run: |
          set -e
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo KVM_DEVICE_NOT_PRESENT; fi
      - name: Offline startup HOME and every primary page evidence
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK='release/android/AIG_Studio_372_PROFESSIONAL_RGB.apk'
            PKG='com.aigstudio.app'
            EVIDENCE='release/android/runtime-evidence'
            mkdir -p "$EVIDENCE"
            verify_png(){
              python3 - "$1" <<'PY'
            import struct,sys
            p=sys.argv[1]
            b=open(p,'rb').read(24)
            assert len(b)>=24 and b[:8]==b'\x89PNG\r\n\x1a\n', p
            w,h=struct.unpack('>II',b[16:24])
            assert w>=720 and h>=720,(p,w,h)
            print(f'PNG_OK|{p}|{w}x{h}')
            PY
            }
            tap_label(){
              label="$1"
              adb shell uiautomator dump /sdcard/aig-ui.xml >/dev/null
              adb pull /sdcard/aig-ui.xml "$EVIDENCE/current-ui.xml" >/dev/null
              coords="$(python3 - "$EVIDENCE/current-ui.xml" "$label" <<'PY'
            import re,sys,xml.etree.ElementTree as ET
            path,label=sys.argv[1],sys.argv[2]
            root=ET.parse(path).getroot()
            choices=[]
            for n in root.iter('node'):
                text=(n.attrib.get('text') or '').strip()
                desc=(n.attrib.get('content-desc') or '').strip()
                if text==label or desc==label or desc==f'UI {label}' or desc.startswith(f'UI {label} '):
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2=map(int,m.groups()); choices.append(((x2-x1)*(y2-y1),(x1+x2)//2,(y1+y2)//2,text,desc))
            assert choices,f'NAV_NOT_FOUND:{label}'
            _,x,y,_,_=min(choices,key=lambda t:t[0])
            print(x,y)
            PY
            )"
              read -r x y <<< "$coords"
              adb shell input tap "$x" "$y"
              sleep 1
            }
            adb install -r "$APK"
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am force-stop "$PKG"
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tee "$EVIDENCE/launcher.txt"
            grep -F "$PKG/.StartupActivity" "$EVIDENCE/launcher.txt"
            adb shell am start -n "$PKG/.StartupActivity" --el AIG_STARTUP_EVIDENCE_HOLD_MS 2500 >/dev/null
            sleep 1
            adb exec-out screencap -p > "$EVIDENCE/00_startup.png"
            verify_png "$EVIDENCE/00_startup.png"
            sleep 3
            adb shell uiautomator dump /sdcard/studio372-home.xml >/dev/null
            adb pull /sdcard/studio372-home.xml "$EVIDENCE/home_ui.xml" >/dev/null
            grep -F 'AIG CNC FORMAL RGB HOME' "$EVIDENCE/home_ui.xml"
            if grep -Eqi 'ENGINEERING SHELL|PHYSICAL PERFORMANCE|MAINTENANCE SYSTEM STRIP' "$EVIDENCE/home_ui.xml"; then echo ENGINEERING_SHELL_DEFAULT_FAIL; exit 20; fi
            adb exec-out screencap -p > "$EVIDENCE/01_HOME.png"
            verify_png "$EVIDENCE/01_HOME.png"
            i=2
            for page in CAD CAM SIM 3AX 4AX 5AX 6AX NC AI; do
              tap_label "$page"
              printf -v n '%02d' "$i"
              adb exec-out screencap -p > "$EVIDENCE/${n}_${page}.png"
              verify_png "$EVIDENCE/${n}_${page}.png"
              adb shell uiautomator dump "/sdcard/${page}.xml" >/dev/null
              adb pull "/sdcard/${page}.xml" "$EVIDENCE/${n}_${page}.xml" >/dev/null
              if grep -Eqi 'ENGINEERING SHELL|PHYSICAL PERFORMANCE|MAINTENANCE SYSTEM STRIP' "$EVIDENCE/${n}_${page}.xml"; then echo "ENGINEERING_SHELL_PAGE_FAIL|$page"; exit 21; fi
              i=$((i+1))
            done
            printf 'version=372.0.0\noffline=TRUE\ncallbacks=LIVE_RUNTIME\nmodels=LIVE_RUNTIME\n6ax=PROCEDURAL_RGB_GLASS_LIVE_ABC\nengineering_shell_default=FALSE\n' > "$EVIDENCE/PROFESSIONAL_RUNTIME_EVIDENCE.txt"
      - name: Publish APK and Android evidence to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/android/AIG_Studio_372_PROFESSIONAL_RGB.apk \
            release/android/AIG_Studio_372_PROFESSIONAL_RGB.sha256 \
            release/android/runtime-evidence/*.png \
            release/android/runtime-evidence/*.xml \
            release/android/runtime-evidence/*.txt

  windows-exe:
    needs: release-init
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Verify professional contract
        shell: pwsh
        run: |
          python ci/verify_professional_rgb_runtime.py
          python ci/verify_professional_surface_binding.py
      - name: Build Bootstrap installer portable Runtime and screenshots
        shell: pwsh
        run: .\ci\build_windows_professional_372.ps1
      - name: Publish EXE portable and Windows evidence to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --clobber `
            release/windows/AIG_Studio_372_SETUP.exe `
            release/windows/AIG_Studio_372_PORTABLE.zip `
            release/windows/SHA256SUMS.txt `
            release/windows/RELEASE_MANIFEST.txt `
            release/windows/runtime-evidence/desktop_startup_page.png `
            release/windows/runtime-evidence/desktop_launch.png `
            release/windows/runtime-evidence/desktop_smoke.txt `
            release/windows/runtime-evidence/REMOVED_CELLS.txt
