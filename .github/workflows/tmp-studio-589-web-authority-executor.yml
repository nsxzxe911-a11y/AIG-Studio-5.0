name: TEMP Studio 589 Web Authority Executor

on:
  push:
    branches:
      - work/studio-589-web-authority-completion

permissions:
  contents: write

concurrency:
  group: studio-589-web-authority-executor
  cancel-in-progress: false

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Already applied - verify only
        id: existing
        shell: bash
        run: |
          if grep -Fq 'function aiPage()' web/index.html; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prove RED before production patch
        if: steps.existing.outputs.applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if python3 ci/verify_formal_web_navigation.py > /tmp/formal-red.log 2>&1; then
            echo 'Expected formal navigation RED before AI implementation' >&2
            exit 1
          fi
          grep -Fq 'FORMAL_NAV_MISSING:AI' /tmp/formal-red.log
          if python3 ci/verify_web_authority_isolation.py > /tmp/authority-red.log 2>&1; then
            echo 'Expected authority isolation RED before AI implementation' >&2
            exit 1
          fi
          grep -Fq 'FORMAL_AI_SURFACE_MISSING' /tmp/authority-red.log
          echo 'STUDIO_589_RED_CONFIRMED|FORMAL_AI_MISSING|AUTHORITY_AI_MISSING'
      - name: Apply minimal formal AI and 10-page patch
        if: steps.existing.outputs.applied == 'false'
        run: python3 ci/apply_web_authority_completion_v1.py
      - name: Verify GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_formal_web_navigation.py
          python3 ci/verify_web_authority_isolation.py
          node ci/verify_web_runtime.mjs
      - name: Commit verified runtime patch
        if: steps.existing.outputs.applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIG Cloud Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add web/index.html ci/verify_web_runtime.mjs
          git diff --cached --check
          git commit -m 'feat(web): complete formal AI authority runtime'
          git push origin HEAD:work/studio-589-web-authority-completion
