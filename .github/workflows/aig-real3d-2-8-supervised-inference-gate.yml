name: AIG Real3D 2.8 First-Party Local Learned Inference Gate
on:
  push:
    branches:
      - verify/real3d-true-world-movie-2-5-20261023
    paths:
      - 'formal-web/school-3d/fastmodel/single-photo/aig-local-learner-2-8*'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-local-learner-2-8*'
      - 'formal-web/school-3d/fastmodel/single-photo/scene-runtime-studio.*'
      - '.github/workflows/aig-real3d-2-8-supervised-inference-gate.yml'
  workflow_dispatch:
jobs:
  true-source-supervised-inference:
    name: Real source reviewed-supervised weights, actual ML inference, abstention and non-leakage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Supervised training, strict source SHA and independent new-source IoU
        run: |
          node --check aig-local-learner-2-8.mjs
          node --check scene-runtime-studio.mjs
          node --test tests/aig-local-learner-2-8.test.mjs
          node --test tests/aig-seeded-segmentation-2-7.test.mjs
          node --test tests/aig-vision-metric-color-2-6.test.mjs
      - name: Full source preserving browser app bundle
        run: |
          npm run build
          node --check dist/scene-runtime-studio.js
          test -s dist/scene-runtime-studio.html
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real Android-shaped and desktop Chromium local reviewed-learning to new-photo inference
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig28-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-local-learner-2-8.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Real3D-2-8-First-Party-Learned-Inference-Phone-Desktop
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-2-8-first-party-learned/
          if-no-files-found: warn
