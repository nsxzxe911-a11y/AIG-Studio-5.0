name: FastModel Star Journey RGB Glass Preview Runtime Gate
on:
  push:
    branches: [feature/fastmodel-starjourney-authority-runtime-v1-20261024]
    paths:
      - 'formal-web/fastmodel/cinema-engine/**'
      - '.github/workflows/fastmodel-starjourney-ui-runtime-gate.yml'
  pull_request:
    paths:
      - 'formal-web/fastmodel/cinema-engine/**'
      - '.github/workflows/fastmodel-starjourney-ui-runtime-gate.yml'
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and authority manifest
        run: |
          node --check formal-web/fastmodel/cinema-engine/app.mjs
          node --check formal-web/fastmodel/cinema-engine/audio-mixer.mjs
          node --check formal-web/fastmodel/cinema-engine/storyboard-engine.mjs
          node --check formal-web/fastmodel/cinema-engine/cinematic-scene-renderer.mjs
          node --check formal-web/fastmodel/cinema-engine/tests/starjourney-storyboard.real-browser.mjs
          node --test formal-web/fastmodel/cinema-engine/tests/storyboard-engine.test.mjs
          node --check formal-web/fastmodel/cinema-engine/tests/starjourney-real-runtime.real-browser.mjs
          node -e "const x=require('./formal-web/fastmodel/cinema-engine/authority/starjourney-desktop-v1.json'); if(!x.approval.desktop_visual_authority||x.image.sha256!=='77611d97db45772f14a403331d4d044b773f132bc2a78c99222262a4e4a046e6'||x.image.binary_in_repo||x.runtime_gate.deployment!=='DRAFT_ONLY_NOT_RENDER_LIVE')process.exit(1);"
          node -e "const x=require('./formal-web/fastmodel/cinema-engine/authority/starjourney-mobile-v1.json');if(!x.approval.mobile_visual_authority||x.image.sha256!=='771e25505942b9ae9424ac8a8329f40bd706063c6f1eded81b53e05daff69d35'||x.image.binary_in_repository)process.exit(1);"
          test -s formal-web/aig-new-home.html
          test -s formal-web/fastmodel/cinema-engine/index.html
          grep -q 'disabled title="尚無 AI 角色生成後端' formal-web/fastmodel/cinema-engine/index.html
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise genuine image, Canvas PNG and mobile tabs
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory formal-web >/tmp/starjourney-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8765/fastmodel/cinema-engine/ >/dev/null && break
            sleep 1
          done
          node formal-web/fastmodel/cinema-engine/tests/starjourney-real-runtime.real-browser.mjs
          node formal-web/fastmodel/cinema-engine/tests/starjourney-storyboard.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-FastModel-StarJourney-RGB-Glass-REAL-Preview-QA-NOT-FORMAL-RELEASE
          path: |
            artifacts/aig-fastmodel-starjourney-ui-runtime-v1/
            artifacts/aig-starjourney-local-storyboard-cinema-v2/
          if-no-files-found: warn
