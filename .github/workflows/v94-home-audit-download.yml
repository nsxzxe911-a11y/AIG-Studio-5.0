name: AIG V94 HOME Audit Download Gate
on:
  push:
    branches:
      - integration/v94-home-audit-download
      - web/aig-dual-formal-runtime-20261016
    paths:
      - 'formal-web/mobile-runtime.html'
      - 'formal-web/service-worker.js'
      - 'formal-web/runtime/v94-home-audit-download.js'
      - 'formal-web/v94-home-audit-download.css'
      - 'formal-web/qa/v94-home-audit-static.cjs'
      - 'formal-web/qa/v94-home-audit-browser.cjs'
      - '.github/workflows/v94-home-audit-download.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check formal-web/runtime/v94-home-audit-download.js
      - run: node --check formal-web/qa/v94-home-audit-static.cjs
      - run: node --check formal-web/qa/v94-home-audit-browser.cjs
      - run: node formal-web/qa/v94-home-audit-static.cjs
  chromium:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory formal-web >/tmp/aig-v94.log 2>&1 &
          sleep 2
      - run: node formal-web/qa/v94-home-audit-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-V94-HOME-Audit-Download-4K-S23
          path: artifacts/v94/
          if-no-files-found: warn
      - run: echo "Source/UI/download-routing gate only. No APK/EXE binaries created; CNC Safety remains BLOCKED."
