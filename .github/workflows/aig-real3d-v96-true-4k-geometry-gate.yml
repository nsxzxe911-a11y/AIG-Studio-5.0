name: Real3D V96 True Native 4K Geometry and Film Quality Gate
on:
  pull_request:
    paths:
      - 'formal-web/shared-3d/aig-real3d-v96-*'
      - 'formal-web/shared-3d/tests/aig-real3d-v96-*'
      - 'formal-web/shared-3d/aig-real3d-v95-auto-film-lab.html'
      - 'formal-web/shared-3d/aig-real3d-v95-auto-film-lab.mjs'
      - 'docs/REAL3D-V96-*'
      - '.github/workflows/aig-real3d-v96-true-4k-geometry-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real3d-v96-4k-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: V96 4K genuine pixels / source topology / camera / memory source Gate
        run: |
          node --check formal-web/shared-3d/aig-real3d-v96-native-4k-pipeline.mjs
          node --check formal-web/shared-3d/aig-real3d-v95-auto-film-lab.mjs
          node --check formal-web/shared-3d/tests/aig-real3d-v96-native-4k.real-browser.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v96-native-4k.test.mjs
          node --test formal-web/shared-3d/tests/aig-real3d-v95-auto-pipeline.test.mjs
  native-gpu-4k:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install actual Chromium / WebGL graphics context
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: V96 verify real 3840 × 2160 source-indexed framebuffer and encoded PNG SHA
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 --directory formal-web >/tmp/v96-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8772/shared-3d/aig-real3d-v95-auto-film-lab.html >/dev/null && break
            sleep 1
          done
          node formal-web/shared-3d/tests/aig-real3d-v96-native-4k.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real3D-V96-Real-Native-4K-GPU-Source-Evidence
          path: artifacts/aig-real3d-v96-native-4k/
          if-no-files-found: warn
