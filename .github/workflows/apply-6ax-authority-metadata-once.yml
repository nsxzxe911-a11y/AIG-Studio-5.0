name: Apply 6AX authority metadata once

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015
    paths:
      - .github/workflows/apply-6ax-authority-metadata-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aig-dual-ai-web-update-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 6AX authority metadata
        run: |
          set -euo pipefail
          python ci/apply_6ax_authority_metadata.py
          python ci/verify_axis_button_asset_contract.py
      - name: Commit 6AX authority metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/aig-generated-rgb/approved/184/manifest.json
          git add app/src/main/assets/aig-generated-rgb/approved/184/sha256.properties
          git add app/src/main/java/com/aigstudio/app/MainActivity.kt
          git commit -m 'fix(ui): bind distinct 6AX authority asset' || true
          git push origin HEAD:feature/aig-dual-ai-web-update-20261015
