name: AIG Real3D 3.4 Source-Pixel Five-Tip SDF Constraint Gate
on:
  push:
    branches:
      - verify/real3d-true-world-movie-2-5-20261023
    paths:
      - 'formal-web/school-3d/fastmodel/single-photo/aig-photo-digit-silhouette-3-4*'
      - 'formal-web/school-3d/fastmodel/single-photo/tests/aig-photo-digit-silhouette-3-4*'
      - 'formal-web/school-3d/fastmodel/single-photo/aig-20-digit-articulation-3-2-ui.mjs'
      - 'formal-web/school-3d/fastmodel/single-photo/scene-runtime-studio.*'
      - '.github/workflows/aig-real3d-3-4-source-silhouette-gate.yml'
  workflow_dispatch:
jobs:
  actual-source-five-tip-contour-to-existing-sdf:
    name: Real source RGB five observed tips alter 3D SDF + phone and desktop missing-source safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal-web/school-3d/fastmodel/single-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Automatic actual source pixel mask scan with five real tips, source SHA and 3D deformation
        run: |
          node --check aig-photo-digit-silhouette-3-4.mjs
          node --check aig-photo-digit-silhouette-3-4-ui.mjs
          node --check aig-20-digit-articulation-3-2-ui.mjs
          node --check scene-runtime-studio.mjs
          node --check tests/aig-photo-digit-silhouette-3-4.real-browser.mjs
          node --test tests/aig-photo-digit-silhouette-3-4.test.mjs
          node --test tests/aig-implicit-digit-field-3-3.test.mjs
          node --test tests/aig-20-digit-articulation-3-2.test.mjs
      - name: Build original AIG full formal world, unchanged CNC and GLB
        run: |
          npm run build
          test -s dist/scene-runtime-studio.html
          test -s dist/scene-runtime-studio.js
          node --check dist/scene-runtime-studio.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Actual Chromium phone and desktop SHA-source contour fail-closed plus visible 3D SDF
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/aig34-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/aig-photo-digit-silhouette-3-4.real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIG-Real3D-3-4-True-Photo-FiveTips-SDF-Phone-Desktop
          path: formal-web/school-3d/fastmodel/single-photo/artifacts/aig-real3d-3-4-source-silhouette/
          if-no-files-found: warn
