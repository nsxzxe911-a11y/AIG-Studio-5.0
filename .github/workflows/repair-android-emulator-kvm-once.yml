name: Repair Android emulator KVM once

on:
  push:
    branches:
      - feature/aig-dual-ai-web-update-20261015
    paths:
      - .github/workflows/repair-android-emulator-kvm-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/aig-dual-ai-web-update-20261015
      - name: Repair formal builder KVM setup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/build-download.yml')
          text = p.read_text(encoding='utf-8')

          old = '''      - name: Enable KVM group perms
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
          echo 'ANDROID_EMULATOR_KVM_READY=PASS'
'''

          new = '''      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo 'ANDROID_EMULATOR_KVM_DEVICE_MISSING=FAIL'
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo 'ANDROID_EMULATOR_KVM_READY=PASS'
'''

          if 'sudo chmod 666 /dev/kvm' in text and 'test -e /dev/kvm' in text:
              print('KVM_RESILIENT_SETUP_ALREADY_PRESENT=PASS')
          else:
              if old not in text:
                  raise SystemExit('KVM_REPAIR_OLD_BLOCK_MISSING')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('KVM_RESILIENT_SETUP_PATCHED=PASS')
          PY
          python3 ci/verify_android_emulator_kvm_contract.py
      - name: Commit KVM repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-download.yml
          if git diff --cached --quiet; then
            echo 'KVM_REPAIR_ALREADY_PRESENT=PASS'
          else
            git commit -m 'fix(ci): harden KVM setup for Android runtime evidence'
            git push origin HEAD:feature/aig-dual-ai-web-update-20261015
          fi
      - name: Dispatch formal builder on repaired ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-download.yml --repo 'nsxzxe911-a11y/AIG-Studio-5.0' --ref 'feature/aig-dual-ai-web-update-20261015'
