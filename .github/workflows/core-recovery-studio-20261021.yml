name: AIG Studio CNC core-first REAL recovery gate (no release)
on:
  push:
    branches: [repair/core-first-studio-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-core-before-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: source_lock
        name: Fail closed if native CAD/CAM/SIM/NC source vanished
        run: python3 ci/verify_core_recovery_lock.py
      - id: source_controls
        name: Verify Android and Windows callbacks actually use navigation IDs
        run: python3 ci/verify_native_control_bindings.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - id: native_core
        name: Run real MANUAL CAM with A/B/C and project/NC persistence
        run: gradle --no-daemon :core:coreRecoverySmoke :core:camManualMachiningContractRegression :core:runtimeLinkRegression :core:coreDeepRecoveryRegression :core:uiNavigationBindingRegression :core:rgbGlobalSkinRegression
      - name: Core-only verdict
        run: |
          echo "STUDIO_CORE_SMOKE=SOURCE_AND_JVM_ONLY"
          echo "ANDROID_APK=UNVERIFIED"
          echo "WINDOWS_EXE=UNVERIFIED"
          echo "6AX_MACHINE_MOTION=NOT_CERTIFIED"
          echo "CONTROL_BINDINGS=DEFERRED_UNTIL_CORE_GATES_PASS"

      - name: Classify core/source/control gates without fake release claims
        if: always()
        env:
          SOURCE_GATE: ${{ steps.source_lock.outcome }}
          CONTROL_GATE: ${{ steps.source_controls.outcome }}
          CORE_GATE: ${{ steps.native_core.outcome }}
        run: |
          {
            echo '### AIG evidence: exact commit ${{ github.sha }}'
            echo "Source SHA integrity: \`$SOURCE_GATE\`"
            echo "Control source-ID binding: \`$CONTROL_GATE\` (not real UI callbacks)"
            echo "Real JVM regression: \`$CORE_GATE\`"
            echo 'Android device / Nox screenshots: NOT_TESTED'
            echo 'Windows EXE / installer: NOT_TESTED'
            echo 'Physical CNC / full 6AX kinematics: BLOCKED'
            echo 'RELEASE_GATE=BLOCKED until native UI and full output evidence'
            echo 'Inspect the failing step and its raw logs before editing geometry.'
          } >> "$GITHUB_STEP_SUMMARY"

  native-android-windows-compile:
    name: Verify real Android UI + Windows JVM compilation (NOT a release)
    needs: restore-core-before-ui
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Preserve locked native cores
        run: python3 ci/verify_core_recovery_lock.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify Android API 36 installed, install only if absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -x "$SDKMANAGER"
            "$SDKMANAGER" "platforms;android-36"
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
      - id: native_compile
        name: Compile native Android and Windows runtime entrypoints
        run: gradle --no-daemon :app:assembleDebug :desktop:jar
      - id: compiled_bytes
        name: Verify actual compiled APK/JAR bytes exist
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          find desktop/build/libs -maxdepth 1 -name '*.jar' -size +0c -print -quit | grep -q '.'
          echo 'NATIVE_SOURCE_COMPILE_ONLY_PASS|ANDROID_DEBUG_APK|WINDOWS_JVM_JAR|NOT_EXE|NOT_DEVICE_UI|NOT_RELEASE'

      # QA-only native debug artifacts. No signature/release/EXE is claimed.
      # Publish only after full JVM regression and native compilation PASS.
      - id: android_upload
        name: QA-only native debug artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aig-studio-core-control-android-debug-NOT-RELEASE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - id: windows_upload
        name: QA-only Windows JVM evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aig-studio-core-control-windows-jar-NOT-EXE
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Classify native build separately from artifact delivery
        if: always()
        env:
          COMPILE_GATE: ${{ steps.native_compile.outcome }}
          BYTES_GATE: ${{ steps.compiled_bytes.outcome }}
          ANDROID_UPLOAD: ${{ steps.android_upload.outcome }}
          WINDOWS_UPLOAD: ${{ steps.windows_upload.outcome }}
        run: |
          {
            echo '### AIG native/delivery evidence: ${{ github.sha }}'
            echo "Android APK + Windows JVM compilation: \`$COMPILE_GATE\`"
            echo "APK/JAR bytes verified: \`$BYTES_GATE\`"
            echo "QA Android artifact upload: \`$ANDROID_UPLOAD\`"
            echo "QA Windows JAR artifact upload: \`$WINDOWS_UPLOAD\`"
            if [ "$COMPILE_GATE" = success ] && [ "$BYTES_GATE" = success ]; then
              echo 'NATIVE_COMPILE=PASS; do not classify upload failure as CAD source bug'
            else
              echo 'NATIVE_COMPILE=BLOCKED; inspect compiler and byte-verification logs'
            fi
            if [ "$ANDROID_UPLOAD" = skipped ] && [ "$WINDOWS_UPLOAD" = skipped ]; then
              echo 'QA_ARTIFACT_UPLOAD=SKIPPED_INTENTIONALLY_TO_SAVE_QUOTA'
              echo 'Exact SHA + compilation logs remain; manually dispatch for needed QA packages.'
            elif [ "$ANDROID_UPLOAD" != success ] || [ "$WINDOWS_UPLOAD" != success ]; then
              echo 'DELIVERY=BLOCKED; inspect artifact upload quota/storage logs'
            else
              echo 'QA_ARTIFACT_UPLOAD=PASS (NOT A SIGNED RELEASE)'
            fi
            echo 'NO_WINDOWS_EXE; NO_DEVICE_RGB_SCREENSHOTS; RELEASE=BLOCKED'
          } >> "$GITHUB_STEP_SUMMARY"
