name: Apply Wave1 CAD host patch

on:
  push:
    branches:
      - professional-rgb-runtime-372
    paths:
      - 'ci/apply_wave1_cad_host.py'
      - '.github/workflows/apply-wave1-cad-host.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: professional-rgb-runtime-372
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Apply exact CAD host patch
        run: python3 ci/apply_wave1_cad_host.py
      - name: Compile patched Android Runtime before commit
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Commit only compiled MainActivity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aigstudio/app/MainActivity.kt
          git diff --cached --exit-code && { echo 'PATCH_NO_CHANGE'; exit 1; } || true
          git commit -m "refactor: mount formal Studio CAD through RuntimePageHost"
          git push origin HEAD:professional-rgb-runtime-372
