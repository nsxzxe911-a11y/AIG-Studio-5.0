<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020407"><title>AIG Studio 5.0 UI/UX 圖庫</title>
<style>
:root{--bg:#020407;--cyan:#27e9ff;--green:#33f39b;--pink:#ff4da6;--amber:#ffb326;--violet:#9f72ff;--muted:#89a7b7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}body{display:grid;grid-template-rows:auto 1fr}.top{background:rgba(2,4,7,.985);border-bottom:1px solid rgba(39,233,255,.3);padding:7px 8px}.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:15px}.brand small{color:var(--muted);font-size:9px}.status{margin-left:auto;color:#baffd7;font-size:9px}.tabs{display:flex;gap:5px;overflow:auto;padding-top:7px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-height:38px;padding:7px 10px;border:1px solid #22495d;border-radius:9px;background:linear-gradient(#0d1923,#03070a);color:#eaf9ff;white-space:nowrap}.tab.active{border-color:var(--cyan);box-shadow:0 0 18px rgba(39,233,255,.24),inset 0 0 14px rgba(39,233,255,.07)}.stage{position:relative;display:grid;place-items:center;overflow:auto;background:#010204}.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}.badge{position:absolute;left:8px;bottom:8px;padding:6px 9px;border:1px solid rgba(39,233,255,.35);border-radius:8px;background:rgba(0,0,0,.72);font-size:10px;backdrop-filter:blur(8px)}.badge img{width:24px;height:24px;display:inline-block;vertical-align:middle;margin-right:6px}.mode{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}.mode button{padding:7px 9px;border:1px solid #22495d;border-radius:8px;background:rgba(0,0,0,.72);color:#fff}.full img{max-width:none;max-height:none}@media(max-width:700px){.brand small,.status{display:none}.tab{font-size:11px;padding:7px 9px}.badge{font-size:9px}.stage{place-items:start center}}
</style></head><body>
<header class="top"><div class="brand"><b>AIG Studio 5.0 • 繁中 UI/UX 完整圖庫</b><small>正式 UI 基礎 • 非工程殼 • 258.0.0</small><span class="status">● UIUX LIBRARY READY</span></div><nav class="tabs"><button class="tab" data-id="HOME" data-img="home.png" data-icon="workspace.png">首頁</button><button class="tab" data-id="CAD" data-img="cad.png" data-icon="cad.png">2D 製圖</button><button class="tab active" data-id="CAM" data-img="cam.jpg" data-icon="cam.png">CAM 刀路</button><button class="tab" data-id="SIM" data-img="sim.jpg" data-icon="sim.png">3D 模擬</button><button class="tab" data-id="3AX" data-img="axis3.jpg" data-icon="3ax.png">3AX</button><button class="tab" data-id="4AX" data-img="axis4.png" data-icon="4ax.png">4AX</button><button class="tab" data-id="5AX" data-img="axis5.jpg" data-icon="5ax.png">5AX</button><button class="tab" data-id="MACHINE" data-img="machine.jpg" data-icon="machine_model.png">機台</button><button class="tab" data-id="NC" data-img="machine.jpg" data-icon="nc.png">NC 程式</button><button class="tab" data-id="AI" data-img="home.png" data-icon="ai.png">AI 智慧</button><button class="tab" data-id="FILE" data-img="home.png" data-icon="save.png">檔案</button><button class="tab" data-id="SKETCH" data-img="cad.png" data-icon="line.png">製圖</button><button class="tab" data-id="SOLID" data-img="cad.png" data-icon="rect.png">實體</button><button class="tab" data-id="SURFACE" data-img="cad.png" data-icon="arc.png">曲面</button><button class="tab" data-id="ASSEMBLY" data-img="machine.jpg" data-icon="machine_model.png">組立</button><button class="tab" data-id="TOOLPATH" data-img="cam.jpg" data-icon="tool_group.png">刀路</button><button class="tab" data-id="POST" data-img="machine.jpg" data-icon="nc.png">後處理</button><button class="tab" data-id="UTILITY" data-img="home.png" data-icon="verify.png">工具</button><button class="tab" data-id="CONTINUITY" data-img="home.png" data-icon="ai_resume.png">斷線續接</button><button class="tab" data-id="STARTUP" data-img="startup.png" data-icon="rgb_wallpaper.png">啟動</button></nav></header>
<main class="stage" id="stage"><img id="screen" src="./assets/cam.jpg" alt="AIG UI/UX"><div class="badge"><img id="ico" src="https://raw.githubusercontent.com/nsxzxe911-a11y/AIG-Studio-5.0/main/app/src/main/assets/aig-generated-rgb/approved/184/cam.png"><span id="label">CAM 刀路</span></div><div class="mode"><button id="fit">Fit</button><button id="one">原尺寸</button></div></main>
<script>
const stage=document.getElementById("stage"),screen=document.getElementById("screen"),ico=document.getElementById("ico"),label=document.getElementById("label");
const base="https://raw.githubusercontent.com/nsxzxe911-a11y/AIG-Studio-5.0/main/app/src/main/assets/aig-generated-rgb/approved/184/";
function select(b){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));screen.src="./assets/"+b.dataset.img;ico.src=base+b.dataset.icon;label.textContent=b.textContent;stage.classList.remove("full");history.replaceState(null,"","#"+b.dataset.id)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>select(b));document.getElementById("fit").onclick=()=>stage.classList.remove("full");document.getElementById("one").onclick=()=>stage.classList.add("full");
const q=(location.hash||"#CAM").slice(1);const hit=[...document.querySelectorAll(".tab")].find(b=>b.dataset.id===q);if(hit)select(hit);
</script></body></html>
