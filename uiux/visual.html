<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#020407}nav{position:sticky;top:0;display:flex;gap:6px;overflow:auto;padding:7px;background:#020407;border-bottom:1px solid #17445b}button{padding:9px;border-radius:9px;border:1px solid #21485c;background:#06101a;color:#fff;white-space:nowrap}main{height:calc(100vh - 55px);display:grid;place-items:center;overflow:auto}img{max-width:100%;max-height:100%;object-fit:contain}</style><nav><button onclick="show('home')">首頁</button><button onclick="show('cad')">CAD 製圖</button><button onclick="show('cam')">CAM 刀路</button><button onclick="show('sim')">SIM 模擬</button><button onclick="show('startup')">啟動</button></nav><main><img id="i"></main><script>const f={home:"home.png",cad:"cad.png",cam:"cam.jpg",sim:"sim.jpg",startup:"startup.png"};function show(p){document.getElementById("i").src="./assets/"+(f[p]||f.cam);history.replaceState(null,"","#"+p)}show((location.hash||"#cam").slice(1));</script>
