<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020407">
<title>AIG Studio 5.0 繁中 UI/UX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020407;color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:7px;padding:7px 8px;background:rgba(2,4,7,.97);border-bottom:1px solid rgba(39,233,255,.24);overflow:auto;white-space:nowrap;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.brand{font-weight:900;letter-spacing:.04em;margin-right:4px}
.tab{min-height:38px;padding:7px 11px;border-radius:10px;border:1px solid #24495b;background:linear-gradient(#0d1720,#03070a);color:#dff7ff;box-shadow:inset 0 1px rgba(255,255,255,.035)}
.tab.active{border-color:#27e9ff;box-shadow:0 0 18px rgba(39,233,255,.24),inset 0 0 14px rgba(39,233,255,.06)}
.stage{position:relative;width:100%;height:100%;overflow:auto;background:#010204;display:grid;place-items:center}
.stage img{display:block;max-width:none;width:auto;height:auto}
.fit img{max-width:100%;max-height:100%;object-fit:contain}
.desktop img{min-width:100%;min-height:100%;object-fit:contain}
.mobile img{width:100%;height:auto}
.note{position:fixed;right:8px;bottom:8px;z-index:5;padding:6px 9px;border-radius:9px;background:rgba(0,0,0,.72);border:1px solid rgba(39,233,255,.28);font-size:10px;color:#bfefff;backdrop-filter:blur(8px)}
@media(max-width:700px){.brand{font-size:12px}.tab{font-size:11px;padding:7px 9px}.bar{gap:5px}.note{font-size:9px}.stage{place-items:start center}}
</style>
</head>
<body>
<nav class="bar">
  <span class="brand">AIG Studio 5.0 繁中 UI/UX</span>
  <button class="tab" data-page="home">首頁</button>
  <button class="tab" data-page="cad">CAD 製圖</button>
  <button class="tab active" data-page="cam">CAM 刀路</button>
  <button class="tab" data-page="sim">SIM 模擬</button>
  <button class="tab" data-page="startup">啟動</button>
  <button class="tab" data-fit="fit">Fit</button>
  <button class="tab" data-fit="full">原尺寸</button>
</nav>
<div data-baseline="zh-tw" style="position:fixed;left:8px;bottom:8px;z-index:6;padding:6px 9px;border:1px solid rgba(51,243,155,.34);border-radius:9px;background:rgba(0,0,0,.72);font-size:10px;color:#c9ffe4;backdrop-filter:blur(8px)">基礎母版：AIG RGB • 繁中優先 • CAD / CAM / SIM / 3AX / 4AX / 5AX / NC</div><main id="stage" class="stage fit"><img id="screen" src="./assets/cam.jpg" alt="AIG original UI"></main>
<div class="note">繁中 UI/UX 基礎母版 • 正式介面開發 • 非工程殼</div>
<script>
const files={home:"home.png",cad:"cad.png",cam:"cam.jpg",sim:"sim.jpg",startup:"startup.png"};
const stage=document.getElementById("stage"),screen=document.getElementById("screen");
function show(p){
  if(!files[p])p="cam";
  screen.src="./assets/"+files[p];
  document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  history.replaceState(null,"","#"+p);
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>show(b.dataset.page));
document.querySelectorAll("[data-fit]").forEach(b=>b.onclick=()=>{
  stage.classList.remove("fit","desktop","mobile");
  if(b.dataset.fit==="fit") stage.classList.add("fit");
});
show((location.hash||"#cam").slice(1));
</script>
</body></html>
