<header><div><h1>AIG 原創網格包覆 × 火柴棒骨架轉向</h1><small>Reverse Authority → Envelope Mesh → Skin Weights → Rotation</small></div><a href="../index.html">獨立工作區</a></header>
<main><p class="summary">以已核准圖片的可見輪廓產生三角網格；滑桿讓頭部和肩膀轉向，骨架不會把人物撐大。非完整 3D 角色。</p>
<section class="panel"><canvas id="model" class="canvas" width="1672" height="941" aria-label="原圖上的蒙皮網格旋轉實驗"></canvas>
<div class="tools">
<label>核准 PNG <input id="source" type="file" accept="image/png"></label>
<label>頭部轉向 <input id="headYaw" type="range" min="-12" max="12" step="1" value="0"><output id="headVal">0°</output></label>
<label>左肩 <input id="leftArm" type="range" min="-12" max="12" value="0"><output id="leftVal">0°</output></label>
<label>右肩 <input id="rightArm" type="range" min="-12" max="12" value="0"><output id="rightVal">0°</output></label>
<label><input id="wire" type="checkbox" checked>網格</label><label><input id="edit" type="checkbox">編輯輪廓</label><label><input id="bones" type="checkbox" checked>細骨架</label>
<button id="reset" type="button">重設姿勢</button><button id="save" type="button">匯出輪廓 JSON</button><small id="stats">等待原圖</small></div>
<div id="status" class="status" role="status">等待原圖</div></section>
<p class="notes"><strong>真實完成：</strong>可重建的網格包覆、權重、GLB 結構與骨架旋轉測試。<strong>尚未完成：</strong>從單一圖片還原真 3D 臉部、背面、完整雙腿及自然物理動畫。推定背面不可當成核准模型；不連接任何第三方建模平台。</p></main>
