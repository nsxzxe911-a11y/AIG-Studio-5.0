</style></head><body><header><h1><span>AIG</span> FastModel <small>2.7 · 網站版 2.5D</small></h1><span class="tag">網站版 · 本機照片動畫</span></header><main><section class="workspace"><canvas id="view" aria-label="3D 模型與動畫預覽"></canvas><div class="hint" id="viewport-status" role="status">選圖生成 2.5D 動畫，或載入 3D GLB。</div></section><aside><div id="generation"><h2>一張照片，立即播放動畫</h2><p>在此裝置建立原彩 2.5D 照片浮雕與左右擺動動畫；不需服務金鑰，照片不會上傳。深度依明暗估算，並非完整 3D 重建。</p><label for="photo">照片或 2.5D 圖片 · 20 MB 內</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><button id="generate" class="primary" disabled>生成本機 2.5D 動畫</button><h3>已有真正的 3D 模型？</h3><label for="model">載入 GLB · 播放原有骨架／表情動畫</label><input id="model" type="file" accept=".glb,model/gltf-binary"><p>完整 3D 重建、自動骨架與擬真動作：雲端後端尚未連接。此網站目前無法從任意照片完成這些功能。</p></div><div id="status" class="status" role="status" aria-live="polite">正在載入照片動畫工具…</div><h3>播放與檔案</h3><label for="clip">動畫片段</label><select id="clip" disabled></select><button id="pause" disabled style="margin:10px 0">暫停動畫</button><div class="downloads" id="downloads"></div><p class="footer">本機照片模式不補背面、不辨識骨架，也不生成走路或說話。正式女主角頭頸修復、影片輸出與實機 60 FPS 尚未驗收。<br><a href="/index.html#dual-projects">返回 AIG 首頁</a></p></aside></main><script src="./app.js"></script></body></html>
